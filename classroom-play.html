<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<script src="/no-zoom.js?v=2"></script>
<title>班級 PK · 對戰</title>
<script src="config.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    min-height:100vh;
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: linear-gradient(180deg, #12182b 0%, #1c2545 60%, #232f56 100%);
    color:#e6ecf7;
  }
  body { display:flex; flex-direction:column; min-height:100vh; }

  .topbar {
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 18px; background:rgba(10,15,32,.75);
    border-bottom:1px solid rgba(140,170,220,.12);
  }
  .topbar .info { font-size:12px; color:#a8b8d8; }
  .topbar .info strong { color:#ffd54d; font-size:14px; margin-right:4px; }

  .score-strip {
    display:flex; justify-content:space-around; padding:14px;
    background: linear-gradient(135deg, rgba(74,125,212,.2), rgba(110,91,212,.2));
    border-bottom: 1px solid rgba(140,170,220,.15);
  }
  .score-side { text-align:center; min-width:100px; }
  .score-side.me { color:#8ecfff; }
  .score-side.opp { color:#ffb0b0; }
  .score-side .num { font-size:32px; font-weight:900; line-height:1; }
  .score-side .lbl { font-size:11px; margin-top:4px; letter-spacing:2px; opacity:.75; }
  .score-vs { font-size:20px; font-weight:900; align-self:center; color:#ffd54d; }

  .container {
    flex:1; display:flex; flex-direction:column; padding:20px;
    max-width:520px; margin:0 auto; width:100%;
  }

  .qcard {
    background:rgba(30,40,70,.7); border:1px solid rgba(140,170,220,.2);
    border-radius:20px; padding:22px 20px 20px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
  }
  .qhead { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .qhead .qno { font-size:12px; color:#a8b8d8; letter-spacing:2px; }
  .qhead .qno strong { font-size:20px; color:#ffd54d; margin-right:2px; }

  .prompt {
    font-size:20px; font-weight:600; line-height:1.5;
    padding:16px; background:rgba(10,15,32,.4); border-radius:12px;
    margin-bottom:18px; color:#fff;
  }

  .choices { display:grid; gap:10px; }
  .choice {
    display:flex; align-items:center; gap:14px;
    padding:14px 18px;
    background:rgba(10,15,32,.5); border:2px solid rgba(140,170,220,.2);
    border-radius:14px; font-size:15px; cursor:pointer;
    transition: all .15s;
    color:#e6ecf7;
  }
  .choice:hover { border-color:#6e8fd0; background:rgba(30,50,90,.4); }
  .choice .label {
    display:flex; align-items:center; justify-content:center;
    width:32px; height:32px; border-radius:50%;
    background:linear-gradient(135deg,#4a7dd4,#6e5bd4);
    font-weight:800; color:#fff; flex-shrink:0;
  }
  .choice.correct { border-color:#3fbf6e; background:rgba(63,191,110,.15); }
  .choice.wrong   { border-color:#d24a4a; background:rgba(210,74,74,.15); }
  .choice:disabled, .choice.disabled { opacity:.6; cursor:not-allowed; pointer-events:none; }

  .waiting-view {
    text-align:center; padding:40px 20px;
    background:rgba(30,40,70,.7); border:1px solid rgba(140,170,220,.2);
    border-radius:20px;
  }
  .waiting-icon { font-size:56px; margin-bottom:12px; }
  .waiting-msg { font-size:17px; font-weight:600; margin-bottom:6px; }
  .waiting-sub { font-size:13px; color:#a8b8d8; }

  .result-view {
    text-align:center; padding:30px 24px;
    background:rgba(30,40,70,.7); border:1px solid rgba(140,170,220,.2);
    border-radius:20px;
  }
  .result-view.win { border-color:rgba(63,191,110,.5); background:linear-gradient(135deg, rgba(63,191,110,.15), rgba(63,191,110,.05)); }
  .result-view.lose { border-color:rgba(200,80,80,.4); background:linear-gradient(135deg, rgba(200,80,80,.12), rgba(200,80,80,.04)); }
  .result-icon { font-size:72px; margin-bottom:8px; }
  .result-msg { font-size:22px; font-weight:800; margin-bottom:8px; }
  .result-score { font-size:14px; color:#c7d5f0; margin-bottom:20px; }

  .btn {
    display:block; width:100%; padding:14px;
    background:linear-gradient(135deg, #4a7dd4, #6e5bd4);
    color:#fff; border:none; border-radius:24px;
    font-size:15px; font-weight:700; cursor:pointer;
  }
  .btn.ghost { background:transparent; border:1px solid rgba(180,200,240,.3); color:#c7d5f0; }

  .toast {
    position:fixed; bottom:40px; left:50%; transform:translateX(-50%);
    background:rgba(20,20,20,.92); color:#fff; padding:12px 22px;
    border-radius:22px; font-size:14px; opacity:0; transition:opacity .3s;
    pointer-events:none; z-index:9999;
  }
  .toast.show { opacity:1; }

  .spinner {
    display:inline-block; width:24px; height:24px;
    border:3px solid rgba(180,200,240,.2); border-top-color:#8ecfff;
    border-radius:50%; animation:spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="topbar">
  <div class="info">🏫 班級 PK · <strong>M<span id="mno">?</span></strong></div>
  <div class="info">CODE <strong id="code">—</strong></div>
</div>

<div class="score-strip" id="score-strip" style="display:none;">
  <div class="score-side me"><div class="num" id="me-score">0</div><div class="lbl">我</div></div>
  <div class="score-vs">VS</div>
  <div class="score-side opp"><div class="num" id="opp-score">0</div><div class="lbl" id="opp-name">對手</div></div>
</div>

<div class="container">
  <div id="root">
    <div class="waiting-view">
      <div class="waiting-icon"><div class="spinner" style="margin:0 auto;"></div></div>
      <div class="waiting-msg">載入中…</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  var API = window.EDU_API || "https://eduarena-tutoring-production.up.railway.app";
  var SID = new URLSearchParams(location.search).get("sid");
  var MNO = new URLSearchParams(location.search).get("mno") || "?";
  var CODE = new URLSearchParams(location.search).get("code") || "";

  document.getElementById("mno").textContent = MNO;
  document.getElementById("code").textContent = CODE || "—";

  if (!SID) {
    document.getElementById("root").innerHTML = '<div class="waiting-view"><div class="waiting-icon">⚠️</div><div class="waiting-msg">缺少 session_id</div></div>';
    throw 0;
  }

  var TIMER = null;
  var CUR_Q_IDX = 0;
  var LAST_ANSWER = null;
  var ANSWERED_IDS = new Set();

  function tokenGet(){ return localStorage.getItem("eduarena_demo_token") || ""; }
  function toast(msg){
    var el = document.getElementById("toast");
    el.textContent = msg; el.classList.add("show");
    clearTimeout(el._t); el._t = setTimeout(function(){ el.classList.remove("show"); }, 2400);
  }
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  async function api(path, opts){
    opts = opts || {};
    var headers = Object.assign({"Content-Type":"application/json"}, opts.headers || {});
    var t = tokenGet();
    if (t) headers["Authorization"] = "Bearer " + t;
    var r = await fetch(API + path, Object.assign({}, opts, { headers: headers }));
    var body = null; try { body = await r.json(); } catch(e){}
    if (!r.ok) {
      var err = new Error((body && body.detail) || ("HTTP " + r.status));
      err.status = r.status; throw err;
    }
    return body;
  }

  async function pollGame(){
    try {
      var d = await api("/api/pvp/state?session_id=" + encodeURIComponent(SID));
      renderGame(d);
    } catch (e) {
      if (e.status === 404) {
        // session 不見了 → 回 classroom.html
        toast("session 找不到，回主頁");
        setTimeout(function(){ location.href = "classroom.html"; }, 1200);
        return;
      }
      console.warn("[poll]", e);
    }
  }

  function renderGame(d){
    // 分數列
    if (d.me) {
      document.getElementById("score-strip").style.display = "flex";
      document.getElementById("me-score").textContent = d.me.correct_count || 0;
      document.getElementById("opp-score").textContent = d.opponent ? (d.opponent.correct_count || 0) : 0;
      if (d.opponent) {
        var oname = d.opponent.is_ai ? "AI" : "同學";
        document.getElementById("opp-name").textContent = oname;
      }
    }

    // 已結束 → 結算畫面
    if (d.status === "finished") {
      if (TIMER) { clearInterval(TIMER); TIMER = null; }
      renderResult(d);
      return;
    }

    var questions = d.questions || [];
    var meAnswered = (d.me && d.me.answered_count) || 0;

    // 我已答完 → 等對手
    if (meAnswered >= questions.length) {
      document.getElementById("root").innerHTML = ''
        + '<div class="waiting-view">'
          + '<div class="waiting-icon">⏳</div>'
          + '<div class="waiting-msg">你答完了，等對手…</div>'
          + '<div class="waiting-sub">結算完會自動進入下一場</div>'
        + '</div>';
      return;
    }

    // 顯示當前題（下一題未答的）
    var qidx = meAnswered;
    var q = questions[qidx];
    if (!q) return;

    if (LAST_ANSWER && ANSWERED_IDS.has(q.question_id)) {
      // 已答但 poll 還沒更新到下一題 — 保持鎖定
      return;
    }
    CUR_Q_IDX = qidx;
    LAST_ANSWER = null;
    renderQuestion(q, qidx, questions.length);
  }

  function renderQuestion(q, idx, total){
    var choices = q.choices || [];
    var labels = q.choice_labels || ["A","B","C","D","E","F"].slice(0, choices.length);
    var choicesHtml = choices.map(function(c, i){
      var lb = labels[i] || String.fromCharCode(65 + i);
      return '<button class="choice" data-ans="' + esc(lb) + '" onclick="pickAnswer(this)">'
        + '<span class="label">' + esc(lb) + '</span>'
        + '<span>' + esc(c) + '</span>'
      + '</button>';
    }).join("");

    document.getElementById("root").innerHTML = ''
      + '<div class="qcard">'
        + '<div class="qhead">'
          + '<div class="qno"><strong>' + (idx+1) + '</strong> / ' + total + '</div>'
          + '<div class="qno">' + (q.type === "choice" ? "選擇題" : esc(q.type)) + '</div>'
        + '</div>'
        + '<div class="prompt">' + esc(q.prompt || q.stem || "?") + '</div>'
        + '<div class="choices">' + choicesHtml + '</div>'
      + '</div>';
  }

  async function pickAnswer(btn){
    if (btn.disabled) return;
    var q = null;
    // 找當前題目
    var d;
    try { d = await api("/api/pvp/state?session_id=" + encodeURIComponent(SID)); }
    catch (e) { toast("讀取狀態失敗"); return; }
    var qs = d.questions || [];
    var meAnswered = (d.me && d.me.answered_count) || 0;
    q = qs[meAnswered];
    if (!q) { toast("等下一題…"); return; }

    var ans = btn.dataset.ans;
    LAST_ANSWER = ans;
    ANSWERED_IDS.add(q.question_id);

    // 鎖所有選項
    document.querySelectorAll(".choice").forEach(function(x){ x.classList.add("disabled"); });
    btn.classList.add("selected");

    try {
      var r = await api("/api/pvp/answer", {
        method: "POST",
        body: JSON.stringify({ session_id: parseInt(SID, 10), question_id: q.question_id, answer: ans })
      });
      // 視覺回饋
      if (r.correct === true) btn.classList.add("correct");
      else if (r.correct === false) {
        btn.classList.add("wrong");
        // 標示正解
        if (r.correct_answer) {
          document.querySelectorAll(".choice").forEach(function(x){
            if (x.dataset.ans === r.correct_answer) x.classList.add("correct");
          });
        }
      }
    } catch (e) {
      toast("送出失敗：" + e.message);
      // 解鎖讓學生再試
      document.querySelectorAll(".choice").forEach(function(x){ x.classList.remove("disabled"); });
      LAST_ANSWER = null;
      ANSWERED_IDS.delete(q.question_id);
      return;
    }
    // 0.9s 後由 poll 自動抓下一題
  }

  function renderResult(d){
    var meCorrect = (d.me && d.me.correct_count) || 0;
    var oppCorrect = (d.opponent && d.opponent.correct_count) || 0;
    var iWon = !!(d.me && d.me.is_winner);
    var cls = iWon ? "win" : "lose";
    var icon = iWon ? "🏆" : "💪";
    var msg = iWon ? "獲勝！晉級下一輪" : "這場輸了";
    var sub = iWon ? "等下個對手，準備再戰" : "回到 classroom 看比賽結果";

    document.getElementById("root").innerHTML = ''
      + '<div class="result-view ' + cls + '">'
        + '<div class="result-icon">' + icon + '</div>'
        + '<div class="result-msg">' + esc(msg) + '</div>'
        + '<div class="result-score">' + meCorrect + ' 對 ' + oppCorrect + '（我 vs 對手）</div>'
        + '<div class="result-score" style="margin-bottom:20px;">' + esc(sub) + '</div>'
        + '<button class="btn" onclick="location.href=\'classroom.html\'">回大廳</button>'
      + '</div>';
  }

  window.pickAnswer = pickAnswer;

  pollGame();
  TIMER = setInterval(pollGame, 2000);
</script>

</body>
</html>
