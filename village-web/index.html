<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script src="/no-zoom.js?v=2"></script>

<title>探索 Demo — Phaser 版</title>
<style>
  html, body {
    margin: 0; padding: 0;
    background: #1a2412;
    overflow: hidden;
    height: 100vh; /* fallback */
    height: 100dvh; /* iOS Safari 動態 viewport，扣掉 toolbar 高度 */
    width: 100vw;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    overscroll-behavior: none;
  }
  /* 鎖死頁面當固定圖層：防 LINE/Safari 內建瀏覽器把滑動當捲動 → 工具列展開收合害遊戲視窗跳 */
  body { position: fixed; inset: 0; }
  #game { width: 100vw; height: 100vh; height: 100dvh; }
  canvas { display: block; touch-action: none; }
  .hint {
    position: fixed; left: 12px; top: 12px;
    color: #fff; font-family: -apple-system, "PingFang TC", sans-serif; font-size: 14px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.85);
    z-index: 10; pointer-events: none;
    padding: 6px 10px; border-radius: 6px;
    background: rgba(0,0,0,0.25);
  }
  /* 手機 touch device 不顯示 WASD hint（沒鍵盤）*/
  @media (pointer: coarse) {
    .hint { display: none; }
  }
  /* 浮動搖桿（DOM，免疫相機 zoom）：平常隱藏，手指真的拖曳地圖才由 JS 定位到起點並加 .show 淡入 */
  #joystick {
    position: fixed; left: 20px; bottom: 24px;
    width: 116px; height: 116px; border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 3px solid rgba(255,255,255,0.45);
    box-shadow: 0 2px 12px rgba(0,0,0,0.28);
    z-index: 400; touch-action: none;
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .12s ease;
  }
  #joystick.show { opacity: 1; visibility: visible; }
  #joy-thumb {
    position: absolute; left: 50%; top: 50%;
    width: 52px; height: 52px; margin: -26px 0 0 -26px;
    border-radius: 50%;
    background: rgba(255,255,255,0.62);
    border: 2px solid rgba(110,80,45,0.55);
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    will-change: transform;
  }
</style>
<link rel="stylesheet" href="shop.css?v=56">
</head>
<body>
<div class="hint">左下搖桿 或 WASD 移動 / 滾輪縮放 / 雙指 pinch 縮放</div>

<div id="joystick"><div id="joy-thumb"></div></div>
<div id="map-fade"></div>
<script>
  // 攔截頁面層級的 touchmove：擋掉手勢被內建瀏覽器當頁面捲動 → 工具列展開/收合害遊戲視窗跳。
  // 規則：單指且起點落在真的可捲動元素(商店面板/題庫清單等 overflow-y:auto)內、且該容器在手勢方向還能捲 → 放行；
  // 其餘(遊戲畫布/空白/多指/捲到頂底還硬拉) → preventDefault，免漏出頁面手勢觸發工具列/rubber-band。
  (function () {
    function scrollableAncestor(el) {
      while (el && el !== document.body && el.nodeType === 1) {
        const s = getComputedStyle(el);
        if (/(auto|scroll)/.test(s.overflowY) && el.scrollHeight > el.clientHeight + 1) return el;
        el = el.parentElement;
      }
      return null;
    }
    let startY = 0, startEl = null;
    document.addEventListener("touchstart", function (e) {
      if (e.touches.length === 1) { startY = e.touches[0].clientY; startEl = scrollableAncestor(e.target); }
      else { startEl = null; }   // 多指(pinch)：不放行頁面捲動
    }, { passive: true });
    document.addEventListener("touchmove", function (e) {
      if (e.touches.length !== 1 || !startEl) { e.preventDefault(); return; }   // 多指或非可捲區 → 擋
      const dy = e.touches[0].clientY - startY;   // dy>0 手指往下拉(看上面內容)，dy<0 往上推
      const atTop = startEl.scrollTop <= 0;
      const atBottom = startEl.scrollTop + startEl.clientHeight >= startEl.scrollHeight - 1;
      // 到頂還想往下拉、或到底還想往上推 → 容器捲不動了，擋掉免觸發 rubber-band/工具列；否則放行讓容器自己捲
      if ((dy > 0 && atTop) || (dy < 0 && atBottom)) e.preventDefault();
    }, { passive: false });
  })();
</script>

<script src="explore.js?v=143"></script>
<!-- 活躍紀錄：進遊戲記一筆「開遊戲」+每5分鐘心跳，給後台 DAU/使用時長/留存用(後端 /api/activity/ping 60秒節流) -->
<script>
(function(){
  var API="https://eduarena-tutoring-production.up.railway.app";
  function ping(){
    var t; try{ t=localStorage.getItem("eduarena_demo_token"); }catch(e){}
    if(!t || document.hidden) return;
    fetch(API+"/api/activity/ping",{method:"POST",headers:{Authorization:"Bearer "+t}}).catch(function(){});
  }
  setTimeout(ping, 4000);                 // 等 login/onboarding 把 token 設好
  setInterval(ping, 5*60*1000);           // 每 5 分鐘心跳（量在線時長/打開次數）
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) ping(); });
})();
</script>
</body>
</html>
