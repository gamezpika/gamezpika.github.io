<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <script src="/no-zoom.js?v=2"></script>
    <meta name="theme-color" content="#8a5a2b">
    <!-- OG meta -->
    <meta property="og:title" content="名人九宮格 — EduArena Demo">
    <meta property="og:description" content="EduArena 技術展示">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://eduarena-skill-demo-production.up.railway.app/assets/images/world_bg.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="description" content="EduArena 名人九宮格遊戲 — 翻牌記憶遊戲，認識中外歷史偉人。">
    <title>名人九宮格</title>
    <link rel="stylesheet" href="arcade/base.css?v=2">
    <link rel="stylesheet" href="static/css/figures.css?v=8">
    <link rel="stylesheet" href="arcade/game-ui.css?v=2">
</head>
<body>

<div id="screen-figures" class="screen active">

    <header class="screen-header">
        <button class="btn-back" id="fg-back" title="關於這個 demo">←</button>
        <span class="screen-title"><img class="emo" src="arcade/img/icons/ui_temple.png?v=1" alt=""> 名人九宮格</span>
        <span class="fg-progress" id="fg-progress">第 1 / 5 題</span>
    </header>

    <div class="fg-question">
        <div class="fg-target">找出：<b id="fg-target-name">李白</b></div>
        <div class="fg-hints" id="fg-hints"></div>
        <div class="fg-status" id="fg-status">準備中…</div>
    </div>

    <div class="fg-grid-wrap">
        <div class="fg-grid" id="fg-grid">
            <!-- 9 張卡 by JS -->
        </div>
    </div>

    <div class="fg-controls" id="fg-controls" style="display:none;">
        <button class="fg-btn" id="fg-next">下一題 →</button>
        <!-- 再玩一輪/回遊樂場改由共用勝利頁（arcadeUI.victory）提供 -->
    </div>

</div>

<!-- ── 知識卡 Modal ───────────────────────────── -->
<div id="fg-modal" class="fg-modal">
    <div class="fg-modal-card">
        <div class="fg-modal-header">
            <div class="fg-modal-icon" id="fg-modal-icon"></div>
            <div>
                <div class="fg-modal-name" id="fg-modal-name"></div>
                <div class="fg-modal-title" id="fg-modal-title"></div>
            </div>
        </div>
        <div class="fg-modal-body">
            <div class="fg-modal-row">
                <span class="fg-modal-row-label">年代</span>
                <span id="fg-modal-era"></span>
            </div>
            <div class="fg-modal-row">
                <span class="fg-modal-row-label">領域</span>
                <span id="fg-modal-field"></span>
            </div>
            <div class="fg-modal-intro" id="fg-modal-intro"></div>
            <div class="fg-modal-quote" id="fg-modal-quote"></div>
        </div>
        <button class="fg-modal-close" id="fg-modal-close">關 閉</button>
    </div>
</div>

<script src="arcade/game-ui.js?v=3"></script>
<script src="static/js/figures.js?v=9"></script>
<script>
// 從遊樂場機台進來(?from=playground)：← 改為回遊樂場（capture 蓋掉原本的 about 彈窗）
(function () {
    if (new URLSearchParams(location.search).get("from") !== "playground") return;
    var b = document.getElementById("fg-back");
    if (b) {
        b.title = "回遊樂場";
        b.addEventListener("click", function (e) {
            e.stopImmediatePropagation();
            // 帶回機台前位置（back_spawn 來自 shop.js 跳轉時的玩家座標）
            var bs = new URLSearchParams(location.search).get("back_spawn") || "";
            location.href = "village-web/index.html?map=playground" + (/^0\.\d+,0\.\d+$/.test(bs) ? "&spawn=" + bs : "");
        }, true);
    }
})();
</script>

<script src="village-web/play_limit.js?v=5"></script>
</body>
</html>
