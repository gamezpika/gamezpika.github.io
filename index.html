<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<meta name="theme-color" content="#2a3e1f">
<title>小智學園 — 登入</title>
<!-- 分享預覽（LINE/社群傳給家長時的卡片）+ 桌面圖示 -->
<meta name="description" content="小智學園 EduArena — 兒童遊戲化學習，邊玩邊學國語、數學、自然、社會、英文。">
<meta property="og:title" content="小智學園 EduArena">
<meta property="og:description" content="兒童遊戲化學習平台，邊玩邊學～用 Google 登入就能開始！">

<meta property="og:url" content="https://eduarena-skill-demo-production.up.railway.app/">

<link rel="apple-touch-icon" href="assets/images/onboarding/school.png">

<!-- Google 登入（GIS）。放在根目錄(無 COEP)才能正常載入跨來源資源 -->
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; width: 100%; overflow: hidden; font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; }
  body { position: fixed; inset: 0; }
  .bg { position: absolute; inset: 0; background: url("village-web/village_ground.webp") center/cover no-repeat;
    filter: blur(5px) brightness(.62) saturate(1.05); transform: scale(1.08); }
  .bg-tint { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 30%, rgba(40,28,12,.15), rgba(30,20,8,.6)); }
  .wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 22px; overflow-y: auto; }

  .panel { position: relative; width: 100%; max-width: 360px; border-radius: 24px; padding: 26px 22px 18px;
    background:
      radial-gradient(circle at 16px 16px, #ffe48f 3px, rgba(120,80,40,.55) 4px, transparent 5px),
      radial-gradient(circle at calc(100% - 16px) 16px, #ffe48f 3px, rgba(120,80,40,.55) 4px, transparent 5px),
      radial-gradient(circle at 16px calc(100% - 16px), #ffe48f 3px, rgba(120,80,40,.55) 4px, transparent 5px),
      radial-gradient(circle at calc(100% - 16px) calc(100% - 16px), #ffe48f 3px, rgba(120,80,40,.55) 4px, transparent 5px),
      linear-gradient(170deg, #fff7e4, #fbe9c4);
    border: 4px solid #8a5a2b;
    box-shadow: 0 18px 50px rgba(0,0,0,.5), inset 0 2px 4px rgba(255,255,255,.6), inset 0 -3px 10px rgba(150,100,50,.18);
  }
  .logo { text-align: center; margin-bottom: 4px; }
  .logo .mk { font-size: 34px; line-height: 1; filter: drop-shadow(0 2px 2px rgba(120,80,30,.3)); }
  .logo .nm { font-size: 27px; font-weight: 900; color: #7a4715; letter-spacing: 3px; margin-top: 4px;
    text-shadow: 0 1px 0 #fff, 0 2px 4px rgba(150,100,40,.25); }
  .logo .sub { font-size: 12.5px; color: #a9803f; font-weight: 700; margin-top: 3px; letter-spacing: 1px; }
  .divider { display: flex; align-items: center; gap: 8px; color: #b58e54; font-size: 12px; font-weight: 700; margin: 16px 2px 12px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, transparent, #d9b577, transparent); }

  /* Google 官方按鈕容器（GIS 渲染進去；置中） */
  #g-signin { display: flex; justify-content: center; margin-bottom: 10px; min-height: 44px; }

  .sbtn { display: flex; align-items: center; gap: 12px; width: 100%; border: 2px solid #e6cf9d; border-radius: 14px;
    background: #fffdf6; padding: 12px 14px; margin-bottom: 10px; cursor: pointer; transition: transform .08s, box-shadow .12s;
    box-shadow: 0 3px 0 #e3c089, 0 5px 12px rgba(0,0,0,.12); }
  .sbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #e3c089, 0 2px 6px rgba(0,0,0,.12); }
  .sbtn .ic { width: 34px; height: 34px; flex: none; border-radius: 9px; display: flex; align-items: center; justify-content: center; }
  .sbtn .tx { font-size: 16px; font-weight: 800; color: #5a3a18; }
  .ic-fb { background: #1877f2; }
  .ic-line { background: #06c755; }
  .ic-apple { background: #111; }

  .play { width: 100%; border: 3px solid #6b3f12; border-radius: 16px; padding: 13px; margin-top: 6px; cursor: pointer;
    font-size: 19px; font-weight: 900; color: #fff7e6; letter-spacing: 4px; text-shadow: 0 1px 2px rgba(0,0,0,.45);
    background: linear-gradient(180deg, #f0a83e, #d4781f);
    box-shadow: 0 5px 0 #9a5414, 0 8px 16px rgba(0,0,0,.3), inset 0 2px 2px rgba(255,255,255,.4);
    animation: glow 1.6s ease-in-out infinite; }
  .play:active { transform: translateY(3px); box-shadow: 0 2px 0 #9a5414, 0 3px 8px rgba(0,0,0,.3), inset 0 2px 2px rgba(255,255,255,.4); animation: none; }
  @keyframes glow {
    0%, 100% { box-shadow: 0 5px 0 #9a5414, 0 8px 16px rgba(0,0,0,.3), inset 0 2px 2px rgba(255,255,255,.4); }
    50%      { box-shadow: 0 5px 0 #9a5414, 0 0 18px 4px rgba(255,200,110,.85), inset 0 2px 2px rgba(255,255,255,.4); }
  }
  .foot { text-align: center; margin-top: 14px; font-size: 12px; color: #b08a4e; font-weight: 600; }
  .foot a { color: #b08a4e; text-decoration: none; }
  .foot span { opacity: .5; margin: 0 7px; }

  .toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(20px);
    background: rgba(50,34,16,.94); color: #fff7e6; font-weight: 700; font-size: 14px; padding: 11px 20px; border-radius: 999px;
    border: 2px solid #c8945a; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 50; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="bg"></div>
<div class="bg-tint"></div>
<div class="wrap">
  <div class="panel">
    <div class="logo">
      <div class="mk">🎓</div>
      <div class="nm">小智學園</div>
      <div class="sub">EduArena · 一起快樂學習</div>
    </div>
    <div class="divider">選擇登入方式</div>

    <!-- App 內建瀏覽器提示（LINE/Telegram 等無法用 Google 登入）-->
    <div id="inapp-note" style="display:none; background:#fff3e0; border:2px solid #e6b566; border-radius:14px; padding:12px 14px; margin-bottom:10px;">
      <div style="font-size:13px; font-weight:800; color:#8a5a18; line-height:1.5;">在 App 內無法用 Google 登入<br><span style="font-weight:600; color:#a9803f;">請用手機瀏覽器開啟，才能用 Google 登入</span></div>
      <button id="open-ext" style="margin-top:8px; width:100%; border:2px solid #6b3f12; border-radius:12px; padding:10px; cursor:pointer; font-size:15px; font-weight:800; color:#fff7e6; background:linear-gradient(180deg,#5aa9e6,#2e7fd4);">🌐 用瀏覽器開啟</button>
    </div>

    <!-- Google 官方登入按鈕（GIS 渲染）；client id 未設定時 fallback 成「即將推出」自訂鈕 -->
    <div id="g-signin"></div>
    <button class="sbtn" id="g-fallback" data-prov="Google" style="display:none;">
      <span class="ic" style="background:#fff;border:1px solid #ececec;"><svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.76h3.56c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.56-2.76c-.98.66-2.23 1.06-3.72 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/></svg></span>
      <span class="tx">使用 Google 登入</span>
    </button>

    <!-- FB / LINE / Apple 先隱藏（目前只開放 Google）；之後要開再加回 -->

    <div class="foot"><a href="terms.html">服務條款</a><span>|</span><a href="privacy.html">隱私政策</a></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
  // ⚠️ 把下面換成你的 Google 用戶端 ID（xxxx.apps.googleusercontent.com）
  var GOOGLE_CLIENT_ID = "978002960103-ca65annj4hp40f92eo84hsgqhhlra5na.apps.googleusercontent.com";

  var toast = document.getElementById("toast"), tT;
  function showToast(msg) {
    toast.textContent = msg; toast.classList.add("show"); clearTimeout(tT);
    tT = setTimeout(function () { toast.classList.remove("show"); }, 2200);
  }

  // Google 登入成功 → 存 ID token → 去開場動畫(onboarding)用 Google 身分建角色
  function onGoogleCredential(resp) {
    if (!resp || !resp.credential) { showToast("Google 登入沒拿到憑證，再試一次"); return; }
    try { sessionStorage.setItem("eduarena_google_idtoken", resp.credential); } catch (e) {}
    location.href = "select.html";   // 角色選擇頁：選小朋友或新增(最多3)；沒小孩會自動轉去開場動畫
  }

  // 偵測 App 內建瀏覽器（Google 政策禁止在 webview 內登入 → 一定空白）
  function inAppBrowser() {
    var ua = navigator.userAgent || "";
    // ① 明確的 App webview 標記
    if (/\bLine\//i.test(ua)) return true;
    if (/FBAN|FBAV|FB_IAB|Instagram|Messenger|MicroMessenger|TikTok|musical_ly|BytedanceWebview|Snapchat|Twitter/i.test(ua)) return true;
    if (/\bTelegram\b/i.test(ua)) return true;
    if (/; wv\)/.test(ua)) return true;   // Android WebView
    // ② iOS 的 App 內建瀏覽器(WKWebView)常「沒有」app 標記、也沒有 'wv'（iOS 的 LINE/Telegram 多屬此類）。
    //    真 Safari 一定同時有 'Version/…' 和 'Safari'；Chrome/Firefox/Edge/Opera/DDG iOS 有各自標記。
    //    兩者都不符 → 判定為 App 內建瀏覽器。
    if (/iPhone|iPad|iPod/i.test(ua)) {
      var realSafari = /Version\/[\d.]+.*Safari/i.test(ua);
      var knownBrowser = /CriOS|FxiOS|EdgiOS|OPiOS|Mercury|DuckDuckGo/i.test(ua);
      if (!realSafari && !knownBrowser) return true;
    }
    return false;
  }
  function isLine() { return /\bLine\//i.test(navigator.userAgent || ""); }

  function fallbackCopy(text) {
    try {
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.top = "-1000px"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      var ok = document.execCommand("copy"); document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  }
  function setupInAppNotice() {
    document.getElementById("g-signin").style.display = "none";
    document.getElementById("g-fallback").style.display = "none";
    document.getElementById("inapp-note").style.display = "block";
    var btn = document.getElementById("open-ext");
    if (isLine()) {
      // LINE：加 openExternalBrowser=1 會跳到手機系統瀏覽器
      btn.addEventListener("click", function () {
        location.href = location.origin + location.pathname + "?openExternalBrowser=1";
      });
    } else {
      // Telegram 等沒有「強制外開」參數 → 複製連結讓使用者貼到 Safari/Chrome 開
      btn.textContent = "📋 複製遊戲連結";
      btn.addEventListener("click", function () {
        var u = location.origin + location.pathname;
        var done = function () { showToast("連結已複製！打開 Safari / Chrome 貼上開啟，就能用 Google 登入"); };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(u).then(done, function () { if (fallbackCopy(u)) done(); else showToast("請點右上角選單 →「用瀏覽器開啟」"); });
        } else if (fallbackCopy(u)) { done(); }
        else { showToast("請點右上角選單 →「用瀏覽器開啟」，才能用 Google 登入"); }
      });
    }
  }

  // 等 GIS 載入後初始化；client id 沒填好就用 fallback 鈕(即將推出)
  function initGoogle() {
    // App 內建瀏覽器 → 不初始化 GIS（會空白），改顯示「用瀏覽器開啟」
    if (inAppBrowser()) { setupInAppNotice(); return; }
    var ready = window.google && google.accounts && google.accounts.id;
    var hasCid = GOOGLE_CLIENT_ID && GOOGLE_CLIENT_ID.indexOf("apps.googleusercontent.com") > 0;
    if (!hasCid || !ready) {
      // 還沒設定 client id 或 GIS 沒載到 → 顯示 fallback 自訂鈕
      document.getElementById("g-fallback").style.display = "flex";
      return;
    }
    google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onGoogleCredential });
    google.accounts.id.renderButton(document.getElementById("g-signin"),
      { type: "standard", theme: "outline", size: "large", text: "signin_with", shape: "pill", locale: "zh_TW", width: 300 });
  }
  // GIS 是 async 載入，輪詢等它好（最多 ~4 秒）
  (function waitGIS(n) {
    if (window.google && google.accounts && google.accounts.id) return initGoogle();
    if (n <= 0) return initGoogle();   // 逾時 → fallback
    setTimeout(function () { waitGIS(n - 1); }, 200);
  })(20);

  // 其他社群鈕（含 Google fallback）：尚未接 OAuth → 即將推出
  document.querySelectorAll(".sbtn").forEach(function (b) {
    b.addEventListener("click", function () {
      showToast(b.dataset.prov + " 登入即將推出，敬請期待！");
    });
  });
</script>
</body>
</html>
