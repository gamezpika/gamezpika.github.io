<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>聽力重組小火車</title>
<link rel="stylesheet" href="arcade/base.css?v=2">
<link rel="stylesheet" href="arcade/english_puzzle.css?v=3">
<link rel="stylesheet" href="arcade/game-ui.css?v=2">
</head>
<body>

<!-- 句子/聽力重組 Screen（搬自正式版 app.html，路徑改 arcade/img/） -->
<div id="screen-en-puzzle" class="screen active">
    <header class="screen-header">
        <button class="btn-back" id="enp-back">←</button>
        <span class="screen-title"><img class="emo" src="arcade/img/icons/ui_train.png?v=1" alt=""> 聽力重組小火車</span>
        <!-- 🚩 回報這題：固定右上角，讀目前題號(english_puzzle 寫入 window.__qreportQid) -->
        <button id="enp-report" title="回報這題"
            style="position:fixed;top:10px;right:12px;z-index:30;width:36px;height:36px;border:none;border-radius:50%;background:rgba(0,0,0,0.28);color:#fff;font-size:17px;cursor:pointer;display:none;"
            onclick="window.QReport&&window.QReport.open(window.__qreportQid,{page:'聽力重組'})">🚩</button>
    </header>
    <div class="game-stats">
        <span class="streak-display" id="enp-streak"><img class="emo" src="arcade/img/icons/fire.png?s=6" alt=""> 0</span>
        <span class="coins-display" id="enp-coins"><img class="emo" src="arcade/img/icons/coin.png?s=6" alt=""> 0</span>
        <span class="progress-display" id="enp-progress">1/10</span>
    </div>
    <div class="enp-area">
        <div class="enp-prompt" id="enp-prompt">中文意思</div>
        <button class="enp-listen-btn" id="enp-listen-btn" style="display:none;">
            <img class="emo" src="arcade/img/icons/ui_speaker.png?v=1" alt=""> 播放英文錄音
        </button>
        <audio id="enp-audio" preload="auto"></audio>
        <div class="enp-answer-slots" id="enp-answer-slots"></div>
        <div class="enp-chip-pool" id="enp-chip-pool"></div>
        <div class="enp-feedback" id="enp-feedback"></div>
        <div class="enp-actions">
            <button class="enp-btn enp-btn-secondary" id="enp-clear">清空</button>
            <button class="enp-btn enp-btn-primary" id="enp-submit">送出</button>
        </div>
    </div>
    <!-- 🚂 聽力整句答對：小火車開過螢幕 -->
    <div id="enp-train-fx" aria-hidden="true">
        <div class="enp-train-run"></div>
    </div>
</div>

<!-- 字配圖 Screen（本頁不入口，但 JS 的 image IIFE 綁同一結算畫面，元素留著防 null） -->
<div id="screen-en-img-puzzle" class="screen">
    <header class="screen-header">
        <button class="btn-back" id="enip-back">←</button>
        <span class="screen-title">字配圖</span>
    </header>
    <div class="game-stats">
        <span class="streak-display" id="enip-streak"></span>
        <span class="coins-display" id="enip-coins"></span>
        <span class="progress-display" id="enip-progress">1/10</span>
    </div>
    <div class="enip-area">
        <div class="enip-word" id="enip-word">word</div>
        <div class="enip-sub">點下面正確的圖片</div>
        <div class="enip-grid" id="enip-grid"></div>
        <div class="enp-feedback" id="enip-feedback"></div>
    </div>
</div>

<!-- 結算改用共用勝利頁（arcadeUI.victory），舊結算 screen 已移除 -->

<!-- 給 init 綁的入口鈕（封面「開始遊戲」觸發聽力模式，不顯示） -->
<button id="en-listen-puzzle-entry" style="display:none"></button>

<script src="arcade/shim.js?v=1"></script>
<script src="arcade/game-ui.js?v=3"></script>
<script src="village-web/qreport.js?v=1"></script>  <!-- 🚩 題目回報元件 -->
<script src="arcade/english_puzzle.js?v=5"></script>
<script>
// 封面＋教學：按「開始遊戲」才開局（教學自動彈出、可略過）
(function boot() {
    function showIntro() {
        window.arcadeUI.intro({
            icon: "arcade/img/puzzle/_enp_loco.png",
            title: "聽力重組小火車",
            sub: "聽英文 · 拼句子 · 火車出發！",
            steps: [
                { ico: "arcade/img/icons/ui_speaker.png?v=1", text: "按「播放英文錄音」仔細聽（可以重聽好幾次）" },
                { ico: "arcade/img/icons/ui_puzzle.png?v=1", text: "點下方的單字車廂，照聽到的順序掛上鐵軌拼成句子" },
                { ico: "arcade/img/icons/check_circle.png?s=6", text: "拼好按「送出」！共 10 題，答對小火車就載著句子出發、還有金幣" },
            ],
            onStart: function () { document.getElementById("en-listen-puzzle-entry").click(); },
        });
    }
    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", showIntro);
    } else {
        showIntro();
    }
})();
</script>
<script src="village-web/play_limit.js?v=5"></script>
</body>
</html>
