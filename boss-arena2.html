<script>
// ===== 真實 EduArena 資料（從 JSON 載入） =====
let SUBJECTS_DATA = null;   // 5 科 + 題庫
let JOBS_DATA = [];         // 24 職業 list
let QUESTIONS = [];         // 當前 session 用題庫

const SUBJECT_META = {
    math:    { emoji: "📐", label: "數學" },
    chinese: { emoji: "📕", label: "國語" },
    english: { emoji: "🔤", label: "英文" },
    science: { emoji: "🔬", label: "自然" },
    social:  { emoji: "🌏", label: "社會" },
};

// 職業 → 武器對應規則（24 職業基於 attr_key + 個別覆蓋）
const JOB_WEAPON_OVERRIDE = {
    "math_detective": "book",      // 數學偵探用放大鏡
    "writer": "book",              // 文字大師用故事書
    "translator": "book",          // 翻譯員用辭典
    "inventor": "gauntlet",        // 發明家用工具箱
    "explorer": "sword",           // 探險家用劍
    "flight_attendant": "staff",   // 空服員 (魔法環遊)
    "doctor": "book",              // 醫生用聽診器/書
    "engineer": "gauntlet",        // 工程師用扳手
    "athlete": "gauntlet",         // 運動員用拳套
    "artist": "staff",             // 藝術家用畫筆 (魔法)
    "musician": "staff",           // 音樂家用音波
    "astronaut": "staff",          // 太空人用 (魔法感)
    "chef": "gauntlet",            // 廚師用菜刀/拳套
    "archaeologist": "sword",      // 考古學家
    "biologist": "book",
    "historian": "book",
    "ai_engineer": "gauntlet",
    "filmmaker": "staff",
    "lawyer": "book",
    "psychologist": "staff",
    "designer": "staff",
};
function pickWeaponByJob(job) {
    if (!job) return "sword";
    if (JOB_WEAPON_OVERRIDE[job.key]) return JOB_WEAPON_OVERRIDE[job.key];
    // fallback 依 attr_key
    const map = { math: "book", chinese_int: "book", english_int: "staff", science_int: "gauntlet", social_int: "sword" };
    return map[job.attr_key] || "sword";
}

/* P0 Grid Data Structure 升級成 5×5（派派 5/23）
   主角 (x,y) 2D，魔王固定 (4,4) 右上角
   攻擊範圍 = Chebyshev ≤ 1 */
const GRID = { cols: 5, rows: 5 };
const BOSS_POS = { x: 2, y: 4 };
// 嘍囉位置預留（demo 暫不啟用）
const ENEMY_SLOTS_RESERVED = [
    { x: 4, y: 3 },  // 魔王正下方
    { x: 3, y: 4 },  // 魔王正左方
    { x: 3, y: 3 },  // 魔王左下對角
    { x: 2, y: 4 },  // 魔王左 2 格
];
function chebyshev(a, b) {
    return Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y));
}
function inAttackRange(pos) {
    return chebyshev(pos, BOSS_POS) <= 1 && !(pos.x === BOSS_POS.x && pos.y === BOSS_POS.y);
}

/* 玩家設定（從 setup 面板填入） */
const playerSetup = {
    name: "派派",
    subject: "math",
    tier: "t3",       // 預設挑戰終極
    jobKey: null,
};

const state = {
    heroHP: 300, heroMaxHP: 300,
    heroMP: 50,  heroMaxMP: 50,
    bossHP: 1000, bossMaxHP: 1000,
    heroPos: { x: 2, y: 0 },   // 前排左側站位（對齊 PVP 開場對峙、不站中央）
    combo: 0,
    qIdx: 0,
    busy: false,
    finished: false,
    backend: false,     // true=接真後端 session（伺服器判題/真金幣），false=樣本題 client 判
    sessionId: null,
    _q: null,           // 目前題目物件
};

const $ = (id) => document.getElementById(id);
const stage = $("arena-stage");
const hero  = $("fighter-hero");
const heroWrap = $("fighter-hero-wrap");
const boss  = $("fighter-boss");
const bossWrap = $("fighter-boss-wrap");

function hpLevel(pct) {
    if (pct > 0.7) return "high";
    if (pct > 0.4) return "mid";
    if (pct > 0.2) return "low";
    if (pct > 0.1) return "critical";
    return "dying";
}
function updateBars() {
    $("hero-hp-num").textContent = `${state.heroHP} / ${state.heroMaxHP}`;
    $("hero-hp-fill").style.width = (state.heroHP / state.heroMaxHP * 100) + "%";
    // 5/25 派派 ABC：主角頭頂條 — 數字 + 漸變顏色
    const heroPct = state.heroHP / state.heroMaxHP;
    const floatHp = $("hero-floating-hp-fill");
    if (floatHp) floatHp.style.width = (heroPct * 100) + "%";
    const heroFloatBox = $("hero-floating-hp");
    if (heroFloatBox) heroFloatBox.dataset.hpLevel = hpLevel(heroPct);
    const heroOver = $("hero-hp-overlay");
    if (heroOver) heroOver.textContent = `${state.heroHP}/${state.heroMaxHP}`;
    // 魔王頭頂條 — 數字 + 漸變顏色
    const bossPct = state.bossHP / state.bossMaxHP;
    $("boss-hp-fill").style.width = (bossPct * 100) + "%";
    const bossFloatBox = $("boss-floating-hp");
    if (bossFloatBox) bossFloatBox.dataset.hpLevel = hpLevel(bossPct);
    const bossOver = $("boss-hp-overlay");
    if (bossOver) bossOver.textContent = `${state.bossHP}/${state.bossMaxHP}`;
    $("hero-mp-num").textContent = `${state.heroMP} / ${state.heroMaxMP}`;
    $("hero-mp-fill").style.width = (state.heroMP / state.heroMaxMP * 100) + "%";
}

function updateGridHighlight() {
    heroWrap.dataset.x = state.heroPos.x;
    heroWrap.dataset.y = state.heroPos.y;

    // 5×5 grid 動態高亮（清所有 class → 重算）
    document.querySelectorAll(".grid-tile").forEach(el => {
        el.classList.remove("hero-pos", "move-range", "attack-range", "boss-pos");
        const cx = parseInt(el.dataset.x, 10);
        const cy = parseInt(el.dataset.y, 10);

        // boss 格
        if (cx === BOSS_POS.x && cy === BOSS_POS.y) {
            el.classList.add("boss-pos");
            return;
        }

        // 攻擊範圍 = boss 周圍 Chebyshev = 1
        const distBoss = Math.max(Math.abs(cx - BOSS_POS.x), Math.abs(cy - BOSS_POS.y));
        if (distBoss === 1) el.classList.add("attack-range");

        // 移動範圍 = hero 周圍 Chebyshev = 1（之後可依技能調 range）
        const distHero = Math.max(Math.abs(cx - state.heroPos.x), Math.abs(cy - state.heroPos.y));
        if (distHero === 1) el.classList.add("move-range");

        // hero 當前格
        if (cx === state.heroPos.x && cy === state.heroPos.y) el.classList.add("hero-pos");
    });

    // 戰況 pill（合進主角卡的單行版）
    const statusPanel = $("combat-status");
    const dist = chebyshev(state.heroPos, BOSS_POS);

    if (inAttackRange(state.heroPos)) {
        statusPanel.classList.add("in-range");
        statusPanel.textContent = "⚔ 攻擊範圍！";
    } else {
        statusPanel.classList.remove("in-range");
        statusPanel.textContent = `📍 距離 ${dist} 格`;
    }
}

// 後端題前處理：去重複題(同 display+prompt) + 洗 choices。
// 答案是以「選項文字」送伺服器判分，洗牌不影響判分，只修正後端正解常落在 A 的問題。
function prepBackendQuestions(qs) {
    if (!Array.isArray(qs)) return [];
    // 正規化：去空白/標點/底線，只留字母數字中日文 → 抓「同文但底線數/標點不同」的近似重複題
    const norm = s => String(s || "").toLowerCase().replace(/[^\p{L}\p{N}]/gu, "");
    const seen = new Set(), out = [];
    qs.forEach(q => {
        const key = norm(q.display) + "│" + norm(q.prompt);
        if (key !== "│" && seen.has(key)) return;   // 同題去重
        if (key !== "│") seen.add(key);
        if (Array.isArray(q.choices) && q.choices.length > 1) {
            const c = q.choices.slice();
            for (let i = c.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [c[i], c[j]] = [c[j], c[i]]; }
            q.choices = c;
        }
        out.push(q);
    });
    return out;
}

function loadQuestion() {
    const q = QUESTIONS[state.qIdx % QUESTIONS.length];
    state._q = q;
    // 後端題：display/prompt/choices；樣本題：q/options
    const text = state.backend ? [q.display, q.prompt].filter(Boolean).join("　") : q.q;
    const choices = state.backend ? (q.choices || []) : q.options;
    $("arena-question").textContent = text || "";
    const btns = document.querySelectorAll(".opt-btn");
    btns.forEach((btn, i) => {
        const has = choices[i] != null && choices[i] !== "";
        btn.textContent = has ? "ABCD"[i] + ". " + choices[i] : "";
        btn.className = "opt-btn";
        btn.disabled = !has;
        btn.style.visibility = has ? "" : "hidden";
        btn.onclick = () => handleAnswer(i, btn);
    });
}

function popDamage(targetEl, text, miss) {
    const rect = targetEl.getBoundingClientRect();
    const stageRect = stage.getBoundingClientRect();
    const pop = document.createElement("div");
    pop.className = "dmg-pop" + (miss ? " miss" : "");
    pop.textContent = text;
    pop.style.left = (rect.left - stageRect.left + rect.width / 2) + "px";
    pop.style.top  = (rect.top  - stageRect.top  + 10) + "px";
    stage.appendChild(pop);
    setTimeout(() => pop.remove(), 1000);
}

async function handleAnswer(idx, btn) {
    if (state.busy || state.finished) return;
    state.busy = true;
    const q = state._q || QUESTIONS[state.qIdx % QUESTIONS.length];
    document.querySelectorAll(".opt-btn").forEach(b => b.disabled = true);

    if (state.backend && state.sessionId) {
        // ── 真後端：伺服器判對錯 + 回傳傷害/HP ──
        const choiceText = (q.choices || [])[idx];
        let d = null;
        try {
            const r = await window.eduApi("/api/boss/session/answer", {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ session_id: state.sessionId, question_id: q.id, answer: String(choiceText) }),
            });
            d = await r.json();
        } catch (e) { d = null; }
        if (!d || d.error) { state.busy = false; return arenaExit(); }   // 答題連線失敗 → 返回，絕不誤判勝負/推進塔

        if (d.correct) {
            btn.classList.add("correct");
            state.combo++; showComboIfDue();
            await attackBoss(d.damage, d.enemy_hp);
        } else {
            btn.classList.add("wrong");
            const ci = (q.choices || []).findIndex(c => String(c) === String(d.correct_answer));
            if (ci >= 0) { const cb = document.querySelectorAll(".opt-btn")[ci]; if (cb) cb.classList.add("correct"); }
            state.combo = 0;
            await getHitByBoss(d.damage, d.player_hp);
        }
        // 後端決定真勝負；題目用完也結算（不繞回重答同題 → 防重複/防後端重答錯誤）
        if (d.done || state.bossHP <= 0 || state.heroHP <= 0 || state.qIdx + 1 >= QUESTIONS.length) return endGame();
        await sleep(500);
        state.qIdx++; state.busy = false; loadQuestion();
        return;
    }

    // ── 樣本 fallback：client 判 ──
    if (idx === q.ans) {
        btn.classList.add("correct"); state.combo++; showComboIfDue();
        await attackBoss();
    } else {
        btn.classList.add("wrong");
        const cb = document.querySelectorAll(".opt-btn")[q.ans]; if (cb) cb.classList.add("correct");
        state.combo = 0; await getHitByBoss();
    }
    if (state.bossHP <= 0) return endGame("win");
    if (state.heroHP <= 0) return endGame("dead");
    await sleep(700);
    state.qIdx++; state.busy = false; loadQuestion();
}

// D. Combo 大字提示
function showComboIfDue() {
    let text, tier;
    if (state.combo === 3)       { text = "COMBO ×3!"; tier = "tier-1"; }
    else if (state.combo === 5)  { text = "COMBO ×5!!"; tier = "tier-2"; }
    else if (state.combo === 10) { text = "COMBO ×10!!!"; tier = "tier-3"; }
    else if (state.combo > 10 && state.combo % 5 === 0) { text = `COMBO ×${state.combo}!!!`; tier = "tier-3"; }
    else return;
    const pop = document.createElement("div");
    pop.className = "combo-pop " + tier;
    pop.textContent = text;
    stage.appendChild(pop);
    setTimeout(() => pop.remove(), 1200);
}

// D. 連擊傷害倍率
function getComboMultiplier() {
    if (state.combo >= 10) return 3.0;
    if (state.combo >= 5)  return 2.0;
    if (state.combo >= 3)  return 1.5;
    return 1.0;
}

// P4 武器專屬大畫面（4 武器各一套華麗 VFX）
function spawnBigImpact(weaponKey) {
    const rect = boss.getBoundingClientRect();
    const stageRect = stage.getBoundingClientRect();
    const cx = rect.left - stageRect.left + rect.width / 2;
    const cy = rect.top  - stageRect.top  + rect.height * 0.5;

    const wrap = document.createElement("div");
    wrap.className = `big-impact big-impact-${weaponKey}`;
    wrap.style.left = cx + "px";
    wrap.style.top  = cy + "px";

    if (weaponKey === "sword") {
        // 8 道交叉劍光（X 字 + 星形）
        for (let i = 0; i < 8; i++) {
            const ray = document.createElement("div");
            ray.className = "sword-ray";
            ray.style.transform = `translate(-50%, -50%) rotate(${i * 45}deg)`;
            ray.style.animationDelay = `${i * 20}ms`;
            wrap.appendChild(ray);
        }
    } else if (weaponKey === "book") {
        // 法陣（旋轉圓 + 8 道符文）
        const circle = document.createElement("div");
        circle.className = "book-circle";
        wrap.appendChild(circle);
        const runes = ["✦", "✧", "★", "☆", "✦", "✧", "★", "☆"];
        for (let i = 0; i < 8; i++) {
            const r = document.createElement("div");
            r.className = "book-rune";
            r.textContent = runes[i];
            r.style.transform = `translate(-50%, -50%) rotate(${i * 45}deg) translateY(-60px)`;
            r.style.animationDelay = `${i * 50}ms`;
            wrap.appendChild(r);
        }
    } else if (weaponKey === "staff") {
        // 12 個光點環繞 boss 匯聚 + 爆炸
        for (let i = 0; i < 12; i++) {
            const orb = document.createElement("div");
            orb.className = "staff-orb";
            const angle = (i / 12) * Math.PI * 2;
            const radius = 90;
            orb.style.setProperty("--sx", Math.cos(angle) * radius + "px");
            orb.style.setProperty("--sy", Math.sin(angle) * radius + "px");
            orb.style.animationDelay = `${i * 30}ms`;
            wrap.appendChild(orb);
        }
    } else if (weaponKey === "gauntlet") {
        // 大拳印 ✊ + 3 環衝擊波
        const fist = document.createElement("div");
        fist.className = "gauntlet-fist";
        fist.textContent = "✊";
        wrap.appendChild(fist);
        for (let i = 0; i < 3; i++) {
            const ring = document.createElement("div");
            ring.className = "gauntlet-ring";
            ring.style.animationDelay = `${i * 100}ms`;
            wrap.appendChild(ring);
        }
    }

    stage.appendChild(wrap);
    setTimeout(() => wrap.remove(), 900);
}

function spawnHitFX(targetEl, weaponKey) {
    const rect = targetEl.getBoundingClientRect();
    const stageRect = stage.getBoundingClientRect();
    const cx = rect.left - stageRect.left + rect.width / 2;
    const cy = rect.top  - stageRect.top  + rect.height / 2;

    // 中央閃光（武器專屬色彩 / 形狀）
    const flash = document.createElement("div");
    flash.className = "hit-flash" + (weaponKey ? ` weapon-${weaponKey}` : "");
    flash.style.left = cx + "px";
    flash.style.top  = cy + "px";
    stage.appendChild(flash);
    setTimeout(() => flash.remove(), 700);

    // 6 粒子四散
    for (let i = 0; i < 6; i++) {
        const angle = (i / 6) * Math.PI * 2 + Math.random() * 0.3;
        const dist = 50 + Math.random() * 30;
        const midDist = dist * 0.5;
        const p = document.createElement("div");
        p.className = "hit-particle";
        p.style.left = cx + "px";
        p.style.top  = cy + "px";
        p.style.setProperty("--px", Math.cos(angle) * dist + "px");
        p.style.setProperty("--py", Math.sin(angle) * dist + "px");
        p.style.setProperty("--px-mid", Math.cos(angle) * midDist + "px");
        p.style.setProperty("--py-mid", Math.sin(angle) * midDist + "px");
        stage.appendChild(p);
        setTimeout(() => p.remove(), 850);
    }
}

async function moveForward() {
    // 4×4：朝魔王方向走 1 格（誰偏差大優先走那軸）
    const dx = BOSS_POS.x - state.heroPos.x;
    const dy = BOSS_POS.y - state.heroPos.y;
    if (Math.abs(dx) >= Math.abs(dy) && dx !== 0) {
        state.heroPos.x += Math.sign(dx);
    } else if (dy !== 0) {
        state.heroPos.y += Math.sign(dy);
    }
    showToast("⬆ 前進！" + (inAttackRange(state.heroPos) ? " 進入攻擊範圍！" : ""));
    updateGridHighlight();
    await sleep(550);
}

async function moveBackward() {
    // 4×4：往反 boss 方向走 1 格（誰差距小優先退那軸）
    const dx = BOSS_POS.x - state.heroPos.x;
    const dy = BOSS_POS.y - state.heroPos.y;
    if (Math.abs(dx) <= Math.abs(dy) && dx !== 0) {
        state.heroPos.x -= Math.sign(dx);
    } else if (dy !== 0) {
        state.heroPos.y -= Math.sign(dy);
    } else {
        // 不在魔王同列同行（dx=dy=0 不可能因為魔王在 (3,3)），保險用 -x
        state.heroPos.x -= 1;
    }
    if (state.heroPos.x >= 0 && state.heroPos.y >= 0) {
        showToast("⬇ 被打退...");
        updateGridHighlight();
    }
    await sleep(550);
}

async function attackBoss(serverDmg, newBossHp) {
    // 後端模式：傷害/新 HP 由伺服器給；樣本模式：client 隨機算
    let dmg;
    if (typeof newBossHp === "number") {
        dmg = (serverDmg != null) ? serverDmg : Math.max(0, state.bossHP - newBossHp);
        state.bossHP = Math.max(0, newBossHp);
    } else {
        const mult = getComboMultiplier();
        dmg = Math.floor((80 + Math.floor(Math.random() * 41)) * mult);
        state.bossHP = Math.max(0, state.bossHP - dmg);
    }

    // 丟球分幀動畫：播 6 幀，出手幀(HERO_RELEASE_FRAME)放出能量球飛向魔王
    const frames = HERO_THROW[heroGender] || HERO_THROW.boy;
    const FT = 75;   // 每幀 ms
    let ballThrown = false;
    for (let i = 0; i < frames.length; i++) {
        hero.src = frames[i];
        if (i === HERO_RELEASE_FRAME && !ballThrown) { spawnHeroBall(); ballThrown = true; }
        await sleep(FT);
    }

    // 球飛行 → 命中魔王（接現有 boss hit 流程）
    await sleep(140);
    bossWrap.classList.add("hit");
    if (state.bossData && state.bossData.hit_sprite) {
        boss.src = `assets/images/${state.bossData.hit_sprite}?v=3`;
    }
    popDamage(boss, "-" + dmg, false);
    spawnHitFX(boss, "staff");        // 現有命中閃光特效
    spawnBigImpact("staff");          // 現有大畫面衝擊特效
    stage.classList.add("impact", "zoom-impact");
    setTimeout(() => stage.classList.remove("impact", "zoom-impact"), 500);
    if (navigator.vibrate) navigator.vibrate(40);
    updateBars();

    await sleep(360);
    bossWrap.classList.remove("hit");
    if (state.bossHP > 0 && state.bossData) {
        boss.src = `assets/images/${state.bossData.sprite}?v=3`;
    }
    hero.src = frames[0];   // 回 idle(預備幀)
}

// 主角丟出的能量球：反向重用 boss-proj 球(hero → 魔王)
function spawnHeroBall() {
    const pos = computeAttackPositions();
    const tierLevel = parseInt((playerSetup.tier || "t1").replace("t", ""), 10) || 1;
    const proj = document.createElement("div");
    proj.className = `boss-proj hero-ball tier-${tierLevel}`;
    proj.style.left = pos.hx + "px";
    proj.style.top  = pos.hy + "px";
    proj.style.setProperty("--tx", (pos.bx - pos.hx) + "px");
    proj.style.setProperty("--ty", (pos.by - pos.hy) + "px");
    stage.appendChild(proj);
    setTimeout(() => proj.remove(), 700);
}

// 武器軌跡：從 hero 中心 → boss 中心劃過去
function spawnWeaponTrail() {
    if (state.weapon === "fist") return;  // 拳頭不畫軌跡
    const heroRect = hero.getBoundingClientRect();
    const bossRect = boss.getBoundingClientRect();
    const stageRect = stage.getBoundingClientRect();
    const hx = heroRect.left - stageRect.left + heroRect.width / 2;
    const hy = heroRect.top  - stageRect.top  + heroRect.height * 0.45;
    const bx = bossRect.left - stageRect.left + bossRect.width / 2;
    const by = bossRect.top  - stageRect.top  + bossRect.height * 0.55;
    const midX = (hx + bx) / 2;
    const midY = (hy + by) / 2;

    const trail = document.createElement("div");
    trail.className = `weapon-trail trail-${state.weapon}`;

    if (state.weapon === "sword" || state.weapon === "pencil") {
        // 直/弧線：從 hero 拉到 boss
        const dx = bx - hx, dy = by - hy;
        const angle = Math.atan2(dy, dx) * 180 / Math.PI;
        const len = Math.sqrt(dx*dx + dy*dy);
        trail.style.left = hx + "px";
        trail.style.top  = hy + "px";
        trail.style.width = len + "px";
        trail.style.transform = `rotate(${angle}deg)`;
    } else {
        // 圓波：放魔王中心
        trail.style.left = bx + "px";
        trail.style.top  = by + "px";
        trail.style.transform = "translate(-50%, -50%)";
    }
    stage.appendChild(trail);
    setTimeout(() => trail.remove(), 700);
}

// 從 attack sprite 路徑推 charge/release 同 tier 路徑
function deriveBossFramePath(attackSprite, phase) {
    if (!attackSprite) return null;
    // e.g. "boss/v2/math/t1/attack.webp" → "boss/v2/math/t1/charge.webp"
    return attackSprite.replace(/\/attack\.(png|webp)$/, `/${phase}.webp`);
}

// 嘗試切換 boss sprite；圖不存在會在 img.onerror 回退
function swapBossSprite(spritePath, fallback) {
    if (!spritePath) return;
    boss.src = `assets/images/${spritePath}?v=3`;
    boss.onerror = () => {
        boss.onerror = null;
        if (fallback) boss.src = `assets/images/${fallback}?v=3`;
    };
}

async function getHitByBoss(serverDmg, newHeroHp) {
    // tier 等級 (t1/t2/t3 → 1/2/3)
    const tierLevel = parseInt((playerSetup.tier || "t1").replace("t", ""), 10) || 1;

    const attackSp = state.bossData && state.bossData.attack_sprite;
    const chargeSp = deriveBossFramePath(attackSp, "charge");
    const releaseSp = deriveBossFramePath(attackSp, "release");

    // B2 蓄力前搖 0.45s（魔王發光、scale 變大 + 切 charge.png）
    bossWrap.classList.add("charging");
    swapBossSprite(chargeSp, attackSp);  // charge 圖；不存在 fallback attack
    await sleep(450);
    bossWrap.classList.remove("charging");

    // B1 切到 attack sprite (peak attack pose) — 維持 0.45s 讓肉眼看得到
    if (attackSp) {
        boss.src = `assets/images/${attackSp}?v=3`;
    }

    await sleep(50);

    // B3 投射物：boss → hero，tier 越高越多
    spawnBossProjectile(tierLevel);

    // 0.4s 後切到 release（follow-through 跟進姿勢）
    setTimeout(() => swapBossSprite(releaseSp, attackSp), 400);

    // 飛行時間 0.5s
    await sleep(500);

    // 命中：扣血 + shake + vignette + damage popup（後端模式用伺服器傷害/HP）
    let dmg;
    if (typeof newHeroHp === "number") {
        dmg = (serverDmg != null) ? serverDmg : Math.max(0, state.heroHP - newHeroHp);
        state.heroHP = Math.max(0, newHeroHp);
    } else {
        dmg = 80 + Math.floor(Math.random() * 41);
        state.heroHP = Math.max(0, state.heroHP - dmg);
    }
    heroWrap.classList.add("hit");
    stage.classList.add("shake", "player-hit");
    popDamage(hero, "-" + dmg, true);

    // B5 tier 3 stage flash + 大震動
    if (tierLevel >= 3) {
        const flash = document.createElement("div");
        flash.className = "stage-mega-flash";
        stage.appendChild(flash);
        setTimeout(() => flash.remove(), 350);
    }

    if (navigator.vibrate) navigator.vibrate(tierLevel >= 3 ? 60 : (tierLevel >= 2 ? 40 : 30));
    updateBars();
    await sleep(500);

    heroWrap.classList.remove("hit");
    stage.classList.remove("shake", "player-hit");

    // B4 切回 idle sprite
    if (state.bossHP > 0 && state.bossData) {
        boss.src = `assets/images/${state.bossData.sprite}?v=3`;
    }
    // 原型：站原地不後退（移動先不做）
}

// ===== B3 魔王投射物：15 隻魔王各自的絕招（dispatcher → 8 primitive 組合）=====
function spawnBossProjectile(tierLevel) {
    const subjKey = playerSetup.subject;
    const pos = computeAttackPositions();
    const key = `${subjKey}-t${tierLevel}`;
    const handler = BOSS_ATTACKS[key] || ((p, s, t) => pStraightShot(p, s, t, 1));
    handler(pos, subjKey, tierLevel);
}

function computeAttackPositions() {
    const bossRect = boss.getBoundingClientRect();
    const heroRect = hero.getBoundingClientRect();
    const stageRect = stage.getBoundingClientRect();
    return {
        bx: bossRect.left - stageRect.left + bossRect.width / 2,
        by: bossRect.top  - stageRect.top  + bossRect.height * 0.5,
        hx: heroRect.left - stageRect.left + heroRect.width / 2,
        hy: heroRect.top  - stageRect.top  + heroRect.height * 0.4,
        stageW: stageRect.width,
        stageH: stageRect.height,
    };
}

// ----- 8 primitive 攻擊動畫 -----

// 1. 直線球（1+ 顆，可微 jitter）
function pStraightShot(pos, subj, tier, count = 1, jitterSpread = 12) {
    for (let i = 0; i < count; i++) {
        setTimeout(() => {
            const proj = document.createElement("div");
            proj.className = `boss-proj subj-${subj} tier-${tier}`;
            proj.style.left = pos.bx + "px";
            proj.style.top  = pos.by + "px";
            const jitter = (i - (count - 1) / 2) * jitterSpread;
            proj.style.setProperty("--tx", (pos.hx - pos.bx + jitter) + "px");
            proj.style.setProperty("--ty", (pos.hy - pos.by) + "px");
            stage.appendChild(proj);
            setTimeout(() => proj.remove(), 700);
        }, i * 60);
    }
}

// 2. 扇形散射
function pFanSpray(pos, subj, tier, count, spreadDeg = 40) {
    const dx = pos.hx - pos.bx;
    const dy = pos.hy - pos.by;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const baseAngle = Math.atan2(dy, dx);
    const half = (spreadDeg * Math.PI / 180) / 2;
    for (let i = 0; i < count; i++) {
        setTimeout(() => {
            const proj = document.createElement("div");
            proj.className = `boss-proj subj-${subj} tier-${tier}`;
            proj.style.left = pos.bx + "px";
            proj.style.top  = pos.by + "px";
            const ratio = count === 1 ? 0 : (i / (count - 1) - 0.5) * 2;  // -1 ~ 1
            const angle = baseAngle + half * ratio;
            proj.style.setProperty("--tx", Math.cos(angle) * dist + "px");
            proj.style.setProperty("--ty", Math.sin(angle) * dist + "px");
            stage.appendChild(proj);
            setTimeout(() => proj.remove(), 750);
        }, i * 50);
    }
}

// 3. 螺旋齊射（先繞 orbit 點再飛向 hero）
function pSpiralVolley(pos, subj, tier, count) {
    for (let i = 0; i < count; i++) {
        setTimeout(() => {
            const proj = document.createElement("div");
            proj.className = `boss-proj subj-${subj} tier-${tier} spiral`;
            proj.style.left = pos.bx + "px";
            proj.style.top  = pos.by + "px";
            const angle = (i / count) * Math.PI * 2;
            const orbitR = 70 + (i % 3) * 12;
            proj.style.setProperty("--orbit-x", Math.cos(angle) * orbitR + "px");
            proj.style.setProperty("--orbit-y", Math.sin(angle) * orbitR + "px");
            proj.style.setProperty("--tx", (pos.hx - pos.bx) + "px");
            proj.style.setProperty("--ty", (pos.hy - pos.by) + "px");
            stage.appendChild(proj);
            setTimeout(() => proj.remove(), 900);
        }, i * 45);
    }
}

// 4. 從天而降（從 hero 上方掉下來）
function pRainFromAbove(pos, subj, tier, count) {
    for (let i = 0; i < count; i++) {
        setTimeout(() => {
            const proj = document.createElement("div");
            proj.className = `boss-proj subj-${subj} tier-${tier}`;
            const startX = pos.hx + (Math.random() - 0.5) * 200;
            const startY = -50;
            proj.style.left = startX + "px";
            proj.style.top  = startY + "px";
            proj.style.setProperty("--tx", (pos.hx - startX) + "px");
            proj.style.setProperty("--ty", (pos.hy - startY) + "px");
            stage.appendChild(proj);
            setTimeout(() => proj.remove(), 700);
        }, i * 70);
    }
}

// 5. 雷電鋸齒直線（SVG path，boss → hero）
function pLightningLine(pos, subj, tier) {
    const svgNS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("class", `boss-lightning subj-${subj} tier-${tier}`);
    svg.style.position = "absolute";
    svg.style.left = "0";
    svg.style.top  = "0";
    svg.style.width  = pos.stageW + "px";
    svg.style.height = pos.stageH + "px";
    svg.style.pointerEvents = "none";
    svg.style.zIndex = "200";

    const dx = pos.hx - pos.bx;
    const dy = pos.hy - pos.by;
    const segs = 7;
    let d = `M ${pos.bx} ${pos.by}`;
    for (let i = 1; i < segs; i++) {
        const t = i / segs;
        const px = pos.bx + dx * t + (Math.random() - 0.5) * 35;
        const py = pos.by + dy * t + (Math.random() - 0.5) * 35;
        d += ` L ${px} ${py}`;
    }
    d += ` L ${pos.hx} ${pos.hy}`;

    const path = document.createElementNS(svgNS, "path");
    path.setAttribute("class", "lightning-path");
    path.setAttribute("d", d);
    svg.appendChild(path);

    // 第二條較細的內部閃光
    const path2 = document.createElementNS(svgNS, "path");
    path2.setAttribute("class", "lightning-core");
    path2.setAttribute("d", d);
    svg.appendChild(path2);

    stage.appendChild(svg);
    setTimeout(() => svg.remove(), 500);
}

// 6. 匯聚爆炸（12 小光點向中心匯聚 → 爆出大球）
function pConvergenceBlast(pos, subj, tier, count = 12) {
    const cx = pos.hx;
    const cy = pos.hy - 20;
    for (let i = 0; i < count; i++) {
        const orb = document.createElement("div");
        orb.className = `boss-converge subj-${subj}`;
        const angle = (i / count) * Math.PI * 2;
        const r = 110 + (i % 3) * 10;
        const startX = cx + Math.cos(angle) * r;
        const startY = cy + Math.sin(angle) * r * 0.7;
        orb.style.left = startX + "px";
        orb.style.top  = startY + "px";
        orb.style.setProperty("--tx", (cx - startX) + "px");
        orb.style.setProperty("--ty", (cy - startY) + "px");
        stage.appendChild(orb);
        setTimeout(() => orb.remove(), 320);
    }
    // 匯聚完爆炸大球（500ms 後命中時剛好爆開）
    setTimeout(() => {
        const big = document.createElement("div");
        big.className = `boss-proj subj-${subj} tier-${tier} big-blast`;
        big.style.left = cx + "px";
        big.style.top  = cy + "px";
        big.style.setProperty("--tx", "0px");
        big.style.setProperty("--ty", "0px");
        stage.appendChild(big);
        setTimeout(() => big.remove(), 500);
    }, 300);
}

// 7. 環繞主角後爆炸
function pOrbitBlast(pos, subj, tier, count) {
    for (let i = 0; i < count; i++) {
        const orb = document.createElement("div");
        orb.className = `boss-proj subj-${subj} tier-${tier} orbit`;
        orb.style.left = pos.hx + "px";
        orb.style.top  = pos.hy + "px";

        orb.style.setProperty("--orbit-start", (i / count * 360) + "deg");
        stage.appendChild(orb);
        setTimeout(() => orb.remove(), 950);
    }
}

// 8. 大印章從天蓋下（圓盤或星形落到 hero 上）
function pStampFromSky(pos, subj, tier, shape = "shape-disc") {

// ----- 楓之谷風 VFX primitive：直接顯示 vfx.webp 並套用 motion class -----
function pMapleVfx(pos, subj, tier, motion, opts = {}) {
    const url = `assets/images/boss/v2/${subj}/t${tier}/vfx.webp?v=3`;
    const count = opts.count || 1;
    const stagger = opts.stagger || 0;
    console.log(`[boss-vfx] ${subj}-t${tier} motion=${motion} count=${count} url=${url}`);

    for (let i = 0; i < count; i++) {
        setTimeout(() => {
            const img = document.createElement("img");
            img.className = `boss-vfx motion-${motion} tier-${tier}`;
            // onerror 必須在 src 之前綁定，404 才一定攔得到
            img.onerror = () => {
                console.warn(`[boss-vfx] onerror fired for ${url} → fallback aura`);
                img.classList.add("vfx-fallback", `subj-${subj}`);
                img.removeAttribute("src");
            };
            img.onload = () => {
                console.log(`[boss-vfx] loaded OK: ${url} (${img.naturalWidth}x${img.naturalHeight})`);
            };
            img.src = url;
            // 預設定位：hero 中心；rain motion 從上方隨機 x
            let x = pos.hx, y = pos.hy;
            if (opts.at === "boss")    { x = pos.bx; y = pos.by; }
            if (opts.at === "midpoint"){ x = (pos.bx + pos.hx) / 2; y = (pos.by + pos.hy) / 2; }
            if (motion === "rain")     { x = pos.hx + (Math.random() - 0.5) * 240; y = -60; }
            img.style.left = x + "px";
            img.style.top  = y + "px";
            if (opts.size) {
                img.style.width  = opts.size + "px";
                img.style.height = opts.size + "px";
            }
            stage.appendChild(img);
            setTimeout(() => img.remove(), opts.lifetime || 850);
        }, i * stagger);
    }
}

async function endGame(outcome) {
    if (state.finished) return;
    state.finished = true;
    let emoji, title, titleClass, sub;
    let overlayDelay = 600;
    let coinsLine = "", coinsEarned = 0;

    // 後端模式：結束 session 拿真金幣 + 真勝負
    if (state.backend && state.sessionId) {
        try {
            const r = await window.eduApi("/api/boss/session/end", {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ session_id: state.sessionId }),
            });
            const d = await r.json();
            state.sessionId = null;
            if (d && !d.error) {
                if (typeof d.victory === "boolean") outcome = d.victory ? "win" : "dead";
                if (d.coins_earned != null) { coinsEarned = d.coins_earned; coinsLine = `　🪙 +${d.coins_earned} 金幣`; }
            }
        } catch (e) {}
    }
    if (!outcome) outcome = state.bossHP <= 0 ? "win" : "dead";

    // 鎮魔塔：累積金幣；中間波勝利 → 不結算、直接下一波
    if (TOWER.active) {
        TOWER.coins += coinsEarned;
        if (outcome === "win" && TOWER.waveIdx + 1 < TOWER.waveCount) {
            TOWER.waveIdx++;
            return nextTowerWave();
        }
    }

    if (outcome === "win") {
        // H. 勝利 cinematic（拿掉光柱、拿掉 combo 顯示）
        bossWrap.classList.add("defeated");
        // 切到 tier 的 death sprite
        if (state.bossData && state.bossData.defeat_sprite) {
            boss.src = `assets/images/${state.bossData.defeat_sprite}?v=3`;
        }
        stage.classList.add("slow-mo");
        heroWrap.classList.remove("attacking");
        heroWrap.classList.add("victory");
        emoji = "🎉"; title = "勝利！"; titleClass = "";
        sub = `擊敗魔王！剩餘 HP：${state.heroHP} · 答對 ${state.qIdx + 1} 題`;
        overlayDelay = 2200;
    } else if (outcome === "retreat") {
        // H. 失敗 cinematic
        const vig = document.createElement("div");
        vig.className = "lose-vignette";
        stage.appendChild(vig);
        emoji = "🏳"; title = "撤退失敗..."; titleClass = "lose";
        sub = "被打出戰場！魔王還剩 HP " + state.bossHP;
        overlayDelay = 1200;
    } else {
        // H. 失敗 cinematic
        const vig = document.createElement("div");
        vig.className = "lose-vignette";
        stage.appendChild(vig);
        emoji = "💀"; title = "失敗..."; titleClass = "lose";
        sub = "魔王還剩 HP " + state.bossHP;
        overlayDelay = 1200;
    }
    // 鎮魔塔：演完 win/lose 視覺後用塔專屬結算（過層/失敗雙鈕）
    if (TOWER.active) {
        setTimeout(() => { outcome === "win" ? towerFloorCleared() : towerFailed(); }, overlayDelay);
        return;
    }
    setTimeout(() => {
        const fromMap = /^[a-z0-9_]+$/.test(new URLSearchParams(location.search).get("map") || "");
        // 新手任務(onboarding)導進來的魔王戰：打贏 → 回 onboarding 結尾領大獎
        const fromOnb = new URLSearchParams(location.search).get("from") === "onboarding";
        const onbWin = fromOnb && outcome === "win";
        // onboarding 退路：打贏→寫一次性 flag 回結尾領獎；打輸→回新手任務(重來)。供 arcadeUI + fallback 共用
        const onbExit = () => {
            try { if (onbWin) localStorage.setItem("onboarding_boss_cleared", "1"); } catch (e) {}
            location.href = "onboarding.html" + (onbWin ? "?scene=end" : "");
        };
        window.__onbExit = onbExit;
        // 統一用小遊戲那套結算頁 arcadeUI.victory（同款好看），不再用 emoji overlay
        if (window.arcadeUI && window.arcadeUI.victory) {
            const rewards = [{ key: "coins", icon: "arcade/img/icons/coin.png?s=6", label: `+${coinsEarned} 金幣` }];
            rewards.push(outcome === "win"
                ? { key: "hp", icon: "arcade/img/icons/hundred.png?s=6", label: `剩餘 HP ${state.heroHP}` }
                : { key: "q",  icon: "arcade/img/icons/hundred.png?s=6", label: `答對 ${state.qIdx} 題` });
            window.arcadeUI.victory({
                win: outcome === "win",
                title: outcome === "win" ? "勝利" : "失敗",
                sub: outcome === "win" ? "擊敗魔王！" : "再接再厲！",
                rewards,
                replayLabel: "再戰一次",
                exitLabel: fromOnb ? (onbWin ? "完成新手任務 →" : "回新手任務") : "回地圖",
                exitIcon: "assets/images/icons/sword.png?s=6",
                onReplay: () => location.reload(),
                onExit: fromOnb ? onbExit : (fromMap ? arenaExit : null),
            });
            return;
        }
        const overlay = document.createElement("div");
        overlay.className = "arena-overlay";
        overlay.innerHTML =
            `<div class="overlay-emoji">${emoji}</div>
             <div class="overlay-title ${titleClass}">${title}</div>
             <div class="overlay-sub">${sub}${coinsLine}</div>
             <button class="overlay-btn" onclick="location.reload()">再戰一次</button>`
            + (fromOnb ? `<button class="overlay-btn" style="margin-left:8px;background:linear-gradient(135deg,#9b8bbf,#6f5e9c)" onclick="window.__onbExit&&window.__onbExit()">${onbWin ? "完成新手任務 →" : "回新手任務"}</button>`
               : fromMap ? `<button class="overlay-btn" style="margin-left:8px;background:linear-gradient(135deg,#9b8bbf,#6f5e9c)" onclick="arenaExit()">回地圖</button>` : '');
        stage.appendChild(overlay);
    }, overlayDelay);
}

async function startArena() {
    // 名字已由呼叫端設定（in-game=playerName()綁定；standalone=setup-start 按鈕讀輸入）
    if (!playerSetup.name) playerSetup.name = "派派";

    // 套用題庫
    const subj = SUBJECTS_DATA[playerSetup.subject];
    QUESTIONS = subj.questions.slice();
    for (let i = QUESTIONS.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [QUESTIONS[i], QUESTIONS[j]] = [QUESTIONS[j], QUESTIONS[i]];
    }

    // 套用 tier 對應的 boss + bg
    const tierData = subj.tiers[playerSetup.tier];
    state.bossData = tierData;
    state.bossMaxHP = tierData.hp;
    state.bossHP = tierData.hp;
    boss.src = `assets/images/${tierData.sprite}?v=3`;
    document.getElementById("boss-name-display").textContent = `★ ${tierData.name} ★`;
    document.getElementById("boss-name-mini").textContent = `★ ${tierData.name} ★`;

    // 預載連續動作幀 + 楓之谷 VFX 圖 — await 等載入完成（派派 5/24：戰鬥內絕對流暢）
    const tierKey = playerSetup.tier;  // "t1"/"t2"/"t3"
    const framesToPreload = [
        `${tierData.sprite}?v=3`,
        `${tierData.hit_sprite}?v=3`,
        `${tierData.attack_sprite}?v=3`,
        `${tierData.defeat_sprite}?v=3`,
        `${deriveBossFramePath(tierData.attack_sprite, "charge")}?v=3`,
        `${deriveBossFramePath(tierData.attack_sprite, "release")}?v=3`,
        `boss/v2/${playerSetup.subject}/${tierKey}/vfx.webp?v=3`,
    ].filter(Boolean);
    // 預載主角丟球 6 幀（避免第一次出招卡頓）
    for (let i = 0; i < 6; i++) framesToPreload.push(`arena/throw/${heroGender}_${i}.webp?v=1`);

    // setup 畫面顯示「準備戰場中…」spinner，等所有圖載完才切戰場
    showSetupSpinner();
    await Promise.all(framesToPreload.map(p => preloadImage(`assets/images/${p}`)));
    hideSetupSpinner();

    // 戰場用 tier 的 bg（15 張 boss 各自背景），5×5 棋盤是 CSS overlay 疊在上面
    stage.style.backgroundImage = `url("assets/images/${tierData.bg}?v=1")`;
    // 6/17 派派：上方列改浮在戰場上方(CSS position:absolute)，背景=戰場同一張連續，
    // 不再給它另一塊 center top 裁切的 bg（原本跟戰場 center 對不上→上半部與背景不符）

    // 套用 UI 文字
    document.getElementById("hero-name-display").textContent = playerSetup.name;
    const _gl = gradeLabel(playerGrade);
    const _chip = document.getElementById("hero-lv-chip"); if (_chip) _chip.textContent = _gl;
    document.getElementById("info-subject-name").textContent = `${subj.emoji} ${subj.label}·${_gl}·${tierData.label}`;

    // 套用職業 buff + 主角造型 sprite + 對應武器動畫
    applyJobBuff();
    const job = JOBS_DATA.find(j => j.key === playerSetup.jobKey);
    setHeroSpriteFromJob(job);

    // ── 接真後端 session（真題/伺服器判/真金幣/HP）；失敗則用上面的樣本題(client 判) ──
    state.backend = false; state.sessionId = null;
    showSetupSpinner();
    try {
        const r = await window.eduApi("/api/boss/session/start", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ subject: playerSetup.subject, tier: parseInt(tierKey.replace("t", ""), 10) || 1 }),
        });
        const d = await r.json();
        if (d && !d.error && !d.detail && d.session_id && Array.isArray(d.questions) && d.questions.length) {
            state.backend = true;
            state.sessionId = d.session_id;
            QUESTIONS = prepBackendQuestions(d.questions);   // 去重複題 + 洗 choices(正解不再都 A)
            state.qIdx = 0;
            state.bossMaxHP = d.enemy_max_hp ?? d.enemy_hp ?? d.boss_hp ?? state.bossMaxHP;
            state.bossHP    = d.enemy_hp ?? d.boss_hp ?? state.bossHP;
            state.heroMaxHP = d.player_max_hp ?? d.player_hp ?? state.heroMaxHP;
            state.heroHP    = d.player_hp ?? state.heroHP;
        }
    } catch (e) { /* 後端失敗 → 用樣本題 fallback */ }
    hideSetupSpinner();

    // localStorage 存
    try {
        localStorage.setItem("eduarena_demo_setup", JSON.stringify(playerSetup));
    } catch (e) { /* ignore */ }

    // 切到戰場
    document.getElementById("screen-setup").style.display = "none";
    document.getElementById("screen-arena").style.display = "flex";

    // 開場進場動畫
    updateBars();
    updateGridHighlight();
    heroWrap.classList.add("entering");
    setTimeout(() => heroWrap.classList.remove("entering"), 1100);

    // 初始化 CombatEngine + 註冊單位 + 綁示範技能按鈕
    initCombatEngine();
    registerCombatUnits();
    bindSkillButtons();

    state.busy = true;
    loadQuestion();
    setTimeout(() => { state.busy = false; }, 1100);
}

// ===== CombatEngine 整合（神餓！）=====
let engine = null;

function initCombatEngine() {
    engine = new CombatEngine(stage);

    // 註冊 4 武器 → 4 個 skill（接現有 CSS keyframes + VFX class）
    engine.registerSkill('sword_basic',    { dashAnim: 'attacking-sword',    impactVfx: 'vfx_sword',    dashMs: 320, impactMs: 500, damageMul: 1.0 });

    engine.registerSkill('staff_basic',    { dashAnim: 'attacking-staff',    impactVfx: 'vfx_staff',    dashMs: 320, impactMs: 700, damageMul: 1.0 });
    engine.registerSkill('gauntlet_basic', { dashAnim: 'attacking-gauntlet', impactVfx: 'vfx_gauntlet', dashMs: 320, impactMs: 500, damageMul: 1.0 });

    // 註冊 5 個示範技能（展示擴展性）
    engine.registerSkill('quick_slash', {
        dashAnim: 'attacking-sword', impactVfx: 'vfx_sword',
        dashMs: 180, impactMs: 300, damageMul: 0.7,
    });
    engine.registerSkill('triple_slash', {
        dashAnim: 'attacking-sword', impactVfx: 'vfx_sword',
        dashMs: 280, impactMs: 250, damageMul: 1.5,
        repeats: 3, repeatInterval: 150,
    });
    engine.registerSkill('meteor', {
        dashAnim: 'attacking-staff', impactVfx: 'vfx_meteor',
        dashMs: 400, impactMs: 900, damageMul: 1.8,
        screenShake: true, costMp: 15,
    });
    engine.registerSkill('heal', {
        impactVfx: 'vfx_heal',
        dashMs: 100, impactMs: 700, resetMs: 100,
        damageMul: 0.6,             // 治療量 = atk × 0.6
        heal: true, targetSelf: true, costMp: 20,
        impactAnim: null,           // 不加 hit class
    });
    engine.registerSkill('mega_strike', {
        dashAnim: 'attacking-gauntlet', impactVfx: 'vfx_mega',
        dashMs: 350, impactMs: 1000, damageMul: 3.0,
        screenShake: true, costMp: 30,
    });

    // VFX 庫
    engine.registerVfx('vfx_sword',    { class: 'hit-flash weapon-sword',    duration: 700, particles: 6, particleClass: 'hit-particle' });
    engine.registerVfx('vfx_book',     { class: 'hit-flash weapon-book',     duration: 700, particles: 8, particleClass: 'hit-particle' });
    engine.registerVfx('vfx_staff',    { class: 'hit-flash weapon-staff',    duration: 700, particles: 6, particleClass: 'hit-particle' });
    engine.registerVfx('vfx_gauntlet', { class: 'hit-flash weapon-gauntlet', duration: 700, particles: 6, particleClass: 'hit-particle' });
    engine.registerVfx('vfx_meteor',   { class: 'hit-flash vfx-meteor',      duration: 900, particles: 14, particleClass: 'particle-fire' });
    engine.registerVfx('vfx_heal',     { class: 'hit-flash vfx-heal',        duration: 600, particles: 4, particleClass: 'hit-particle' });
    engine.registerVfx('vfx_mega',     { class: 'stage-mega-flash',          duration: 700, particles: 20, particleClass: 'particle-fire' });

    // 事件鉤子：同步 UI（HP bar、傷害飄字、結局判定）
    engine.on('hit_landed', ({ source, target, dmg }) => {
        popDamage(target.el, '-' + dmg, target.id !== 'boss');
        if (target.id === 'boss')      state.bossHP = target.hp;
        else if (target.id === 'hero') state.heroHP = target.hp;
        updateBars();
    });
    engine.on('heal_landed', ({ target, amount }) => {
        // 綠色飄字
        const rect = target.el.getBoundingClientRect();
        const stageRect = stage.getBoundingClientRect();
        const pop = document.createElement('div');
        pop.className = 'heal-plus';
        pop.textContent = '+' + amount;
        pop.style.left = (rect.left - stageRect.left + rect.width / 2) + 'px';
        pop.style.top  = (rect.top  - stageRect.top  + 10) + 'px';
        stage.appendChild(pop);
        setTimeout(() => pop.remove(), 1000);
        if (target.id === 'hero') state.heroHP = target.hp;
        updateBars();
    });
    engine.on('skill_blocked', ({ reason }) => {
        showToast('⚠ 技能無法施放');
    });
    engine.on('unit_defeated', ({ unit }) => {
        if (unit.id === 'boss') {
            if (state.bossData && state.bossData.defeat_sprite) {
                boss.src = `assets/images/${state.bossData.defeat_sprite}?v=3`;
            }
        }
    });

    return engine;
}

// 示範技能 button handler
function bindSkillButtons() {
    document.querySelectorAll('.skill-btn').forEach(b => {
        b.onclick = async () => {
            if (state.busy || state.finished) return;
            state.busy = true;
            document.querySelectorAll('.skill-btn').forEach(x => x.disabled = true);
            const skill = b.dataset.skill;
            const isHeal = skill === 'heal';
            // engine 內 targetSelf 已處理，但我們明確傳
            await engine.executeAction({
                sourceId: 'hero',
                targetId: isHeal ? 'hero' : 'boss',
                skillKey: skill,
            });
            document.querySelectorAll('.skill-btn').forEach(x => x.disabled = false);
            state.busy = false;
            // 檢查勝負
            if (state.bossHP <= 0) endGame('win');
            if (state.heroHP <= 0) endGame('dead');
        };
    });
}

// ───────── 鎮魔塔分波模式（移植自 arcade-boss，適配 boss-arena2 的 startArena/endGame 流程）─────────
const TOWER = { active: false, floor: 1, waveCount: 1, waveIdx: 0, subject: "math", coins: 0, backMap: "tower", backSpawn: "" };
function towerWavesFor(f) { return Math.max(1, Math.min(5, 1 + Math.floor((f - 1) / 2))); }   // 與 shop.js 同步
function towerFloorTier(f) { return Math.min(1 + Math.floor((f - 1) / 3), 3); }
function waveTierKey(idx) {  // 最後一波=該層魔王(floorTier)、前面是小兵(floorTier-1 最低1)
    const ft = towerFloorTier(TOWER.floor);
    const t = (idx >= TOWER.waveCount - 1) ? ft : Math.max(1, ft - 1);
    return "t" + t;
}
function towerSplash(text, sub) {
    let s = document.getElementById("tower-splash");
    if (!s) {
        s = document.createElement("div");
        s.id = "tower-splash";
        s.style.cssText = "position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;"
            + "justify-content:center;text-align:center;gap:10px;color:#fff;"
            + "background:radial-gradient(ellipse at 50% 40%,#3a1a5e 0%,#120827 75%);";
        s.innerHTML = '<div id="tw-splash-t" style="font-size:30px;font-weight:900"></div>'
            + '<div id="tw-splash-s" style="font-size:16px;color:#d8c8f0"></div>';
        document.body.appendChild(s);
    }
    s.querySelector("#tw-splash-t").textContent = text;
    s.querySelector("#tw-splash-s").textContent = sub || "";
    s.style.display = "flex";
}
function hideTowerSplash() { const s = document.getElementById("tower-splash"); if (s) s.style.display = "none"; }
function towerExit() {
    const bs = TOWER.backSpawn;
    location.href = "village-web/index.html?map=" + TOWER.backMap + (/^0\.\d+,0\.\d+$/.test(bs) ? "&spawn=" + bs : "");
}
// 返回：從地圖(?map)進來的回該地圖原位；獨立測試回標準頁
function arenaExit() {
    const qp = new URLSearchParams(location.search);
    const map = /^[a-z0-9_]+$/.test(qp.get("map") || "") ? qp.get("map") : "";
    const bs = qp.get("back_spawn") || "";
    if (map) location.href = "village-web/index.html?map=" + map + (/^0\.\d+,0\.\d+$/.test(bs) ? "&spawn=" + bs : "");
    else location.href = "index.html";
}
window.arenaExit = arenaExit;
async function nextTowerWave() {
    towerSplash("第 " + TOWER.floor + " 層", "第 " + (TOWER.waveIdx + 1) + " / " + TOWER.waveCount + " 波　魔物來襲！");
    bossWrap.classList.remove("defeated", "hit", "charging");
    heroWrap.classList.remove("victory", "hit", "entering");

function towerOverlay(emoji, title, sub, btns) {

function towerFloorCleared() {
    const nf = TOWER.floor + 1;
    try { const cur = parseInt(localStorage.getItem("tower_floor_" + TOWER.subject) || "1", 10) || 1; localStorage.setItem("tower_floor_" + TOWER.subject, String(Math.max(cur, nf))); } catch (e) {}
    towerOverlay("🏆", "通過第 " + TOWER.floor + " 層！", "本層共獲得 🪙 " + TOWER.coins + " 金幣", [
        { label: "挑戰第 " + nf + " 層", action: () => {
            const bs = TOWER.backSpawn;
            let q = "?tower=1&subject=" + encodeURIComponent(TOWER.subject) + "&floor=" + nf + "&waves=" + towerWavesFor(nf) + "&map=" + TOWER.backMap + (/^0\.\d+,0\.\d+$/.test(bs) ? "&back_spawn=" + bs : "");
            location.href = "boss-arena2.html" + q;
        } },
        { label: "回鎮魔塔", action: towerExit },
    ]);
}
function towerFailed() {

        { label: "重試第 " + TOWER.floor + " 層", action: () => location.reload() },
        { label: "回鎮魔塔", action: towerExit },
    ]);
}

    applyTheme(urlTheme || savedTheme || "sandstone");

    await loadData();

    if (_urlHero === "girl" || _urlHero === "boy") heroGender = _urlHero;
    else { try { heroGender = localStorage.getItem("village_gender") === "female" ? "girl" : "boy"; } catch (e) { heroGender = "boy"; } }
    // 年級：?grade= 覆蓋優先，否則讀 village_grade（onboarding 建角存的）
    const _urlGrade = parseInt(qp.get("grade") || "", 10);
    if (_urlGrade >= 1 && _urlGrade <= 6) playerGrade = _urlGrade;
    else { try { const g = parseInt(localStorage.getItem("village_grade") || "", 10); if (g >= 1 && g <= 6) playerGrade = g; } catch (e) {} }

    // 鎮魔塔分波模式：?tower=1&subject&floor&waves&map&back_spawn
    if (qp.get("tower") === "1") {
        TOWER.active = true;
        TOWER.subject = SUBJECTS_DATA[qp.get("subject")] ? qp.get("subject") : "math";
        TOWER.floor = Math.max(1, parseInt(qp.get("floor") || "1", 10) || 1);
        TOWER.waveCount = Math.max(1, Math.min(5, parseInt(qp.get("waves") || "1", 10) || 1));
        TOWER.waveIdx = 0; TOWER.coins = 0;
        TOWER.backMap = /^[a-z0-9_]+$/.test(qp.get("map") || "") ? qp.get("map") : "tower";
        TOWER.backSpawn = qp.get("back_spawn") || "";
        playerSetup.subject = TOWER.subject;
        playerSetup.tier = waveTierKey(0);
        playerSetup.jobKey = null; playerSetup.name = playerName();
        await startArena();
        return;
    }

    const urlSubj = qp.get("subject");
    if (urlSubj && SUBJECTS_DATA[urlSubj]) {
        playerSetup.subject = urlSubj;
        let t = qp.get("tier");
        if (/^[123]$/.test(t)) t = "t" + t;   // 兼容 bossfight 入口傳的 numeric tier(1/2/3)
        playerSetup.tier = ["t1", "t2", "t3"].includes(t) ? t : "t3";
        playerSetup.jobKey = null;
        playerSetup.name = playerName();
        await startArena();
        return;
    }

    restoreSetup();
    renderSubjectPicker();
    renderJobPicker();
    renderTierPicker();
    // 套上恢復的職業
    const savedJob = JOBS_DATA.find(j => j.key === playerSetup.jobKey);
    selectJob(savedJob);
    document.getElementById("setup-start").onclick = () => {
        playerSetup.name = document.getElementById("setup-name").value.trim() || playerName();
        startArena();
    };
    // 主題按鈕綁定
    document.querySelectorAll("#setup-theme .theme-btn").forEach(b => {
        b.onclick = () => applyTheme(b.dataset.theme);
    });
})();
</script>
