<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script src="/no-zoom.js?v=2"></script>
<meta name="theme-color" content="#2a3e1f">
<title>小智學園 — 選擇小朋友</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; width: 100%; overflow: hidden; font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; }
  body { position: fixed; inset: 0; }
  .bg { position: absolute; inset: 0; background: url("village-web/village_ground.webp") center/cover no-repeat;
    filter: blur(5px) brightness(.62) saturate(1.05); transform: scale(1.08); }
  .bg-tint { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 30%, rgba(40,28,12,.15), rgba(30,20,8,.6)); }
  .wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 22px; overflow-y: auto; }
  .panel { position: relative; width: 100%; max-width: 360px; border-radius: 24px; padding: 24px 22px 18px;
    background: linear-gradient(170deg, #fff7e4, #fbe9c4); border: 4px solid #8a5a2b;
    box-shadow: 0 18px 50px rgba(0,0,0,.5), inset 0 2px 4px rgba(255,255,255,.6); }
  .logo { text-align: center; margin-bottom: 14px; }
  .logo .mk { font-size: 30px; }
  .logo .nm { font-size: 22px; font-weight: 900; color: #7a4715; letter-spacing: 2px; margin-top: 2px; text-shadow: 0 1px 0 #fff; }
  .logo .sub { font-size: 13px; color: #a9803f; font-weight: 700; margin-top: 4px; }

  .kid { display: flex; align-items: center; gap: 14px; width: 100%; border: 2px solid #e6cf9d; border-radius: 16px;
    background: #fffdf6; padding: 14px; margin-bottom: 11px; cursor: pointer; transition: transform .08s, box-shadow .12s;
    box-shadow: 0 3px 0 #e3c089, 0 5px 12px rgba(0,0,0,.12); }
  .kid:active { transform: translateY(2px); box-shadow: 0 1px 0 #e3c089; }
  .kid .ava { width: 50px; height: 50px; flex: none; border-radius: 12px; background: #f3e6c8; display: flex; align-items: center; justify-content: center; font-size: 28px; }
  .kid .info { flex: 1; min-width: 0; }
  .kid .nm { font-size: 18px; font-weight: 900; color: #5a3a18; }
  .kid .meta { font-size: 12.5px; color: #a9803f; font-weight: 700; margin-top: 2px; }
  .kid .go { font-size: 20px; color: #d4781f; }

  .add { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 2px dashed #cBA468;
    border-radius: 16px; background: rgba(255,255,255,.4); padding: 14px; margin-bottom: 6px; cursor: pointer;
    font-size: 16px; font-weight: 800; color: #8a5a18; }
  .add:active { background: rgba(255,255,255,.7); }
  .full { text-align: center; font-size: 12.5px; color: #a9803f; font-weight: 700; margin: 4px 0 8px; }

  .msg { text-align: center; color: #8a6d3b; font-size: 14px; padding: 18px 0; }
  .foot { text-align: center; margin-top: 12px; }
  .foot a { color: #b08a4e; text-decoration: none; font-size: 12.5px; font-weight: 700; }

  .toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(20px);
    background: rgba(50,34,16,.94); color: #fff7e6; font-weight: 700; font-size: 14px; padding: 11px 20px; border-radius: 999px;
    border: 2px solid #c8945a; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 50; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="bg"></div>
<div class="bg-tint"></div>
<div class="wrap">
  <div class="panel">
    <div class="logo">
      <div class="mk">🎓</div>
      <div class="nm">選擇小朋友</div>
      <div class="sub" id="sub">一個帳號最多 3 位小朋友</div>
    </div>
    <div id="list"><div class="msg">載入中…</div></div>
    <div class="foot"><a href="index.html">← 換 Google 帳號</a></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
  var DEMO_API = "https://eduarena-tutoring-production.up.railway.app";
  var toast = document.getElementById("toast"), tT;
  function showToast(m){ toast.textContent=m; toast.classList.add("show"); clearTimeout(tT); tT=setTimeout(function(){toast.classList.remove("show");},2200); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];}); }

  var GIDT = ""; try { GIDT = sessionStorage.getItem("eduarena_google_idtoken") || ""; } catch(e){}
  var ACCT = null;   // {platform, platformUserId}

  if (!GIDT) { location.replace("index.html"); }

  async function load(){
    try {
      var r = await fetch(DEMO_API+"/api/auth", {method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({type:"google", idToken:GIDT})});
      var d = await r.json();
      if (!d || !d.account) { showToast("登入逾時，請重新登入"); setTimeout(function(){location.replace("index.html");},1500); return; }
      ACCT = d.account;
      var kids = d.children || [];
      var max = d.max_children || 3;
      // 還沒有小孩 → 直接去開場動畫建第一個
      if (!kids.length) { location.replace("onboarding.html"); return; }
      render(kids, max);
    } catch(e){ showToast("載入失敗，請重新登入"); setTimeout(function(){location.replace("index.html");},1500); }
  }

  function render(kids, max){
    var html = "";
    kids.forEach(function(k){
      html += '<div class="kid" data-id="'+k.id+'" data-name="'+esc(k.name)+'" data-grade="'+(k.grade||"")+'">'
        + '<div class="ava">🧒</div>'
        + '<div class="info"><div class="nm">'+esc(k.name)+'</div>'
        + '<div class="meta">'+(k.grade?("國小 "+k.grade+" 年級"):"")+(k.level?("　Lv."+k.level):"")+'</div></div>'
        + '<div class="go">▶</div></div>';
    });
    if (kids.length < max) {
      html += '<div class="add" id="add">＋ 新增小朋友（還可建 '+(max-kids.length)+' 位）</div>';
    } else {
      html += '<div class="full">已達上限（最多 '+max+' 位）</div>';
    }
    document.getElementById("list").innerHTML = html;
    document.querySelectorAll(".kid").forEach(function(el){
      el.addEventListener("click", function(){ play(el.dataset.id, el.dataset.name, el.dataset.grade); });
    });
    var add = document.getElementById("add");
    if (add) add.addEventListener("click", function(){ location.href = "onboarding.html"; });
  }

  async function play(cid, name, grade){
    try {
      var r = await fetch(DEMO_API+"/api/auth/child/select", {method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({platform:"google", platform_user_id:ACCT.platformUserId, child_id:Number(cid)})});
      var d = await r.json();
      if (!d || !d.token) { showToast("進入失敗，再試一次"); return; }
      localStorage.setItem("eduarena_demo_token", d.token);
      localStorage.setItem("eduarena_demo_uid", ACCT.platformUserId);
      localStorage.setItem("eduarena_demo_child_id", String(cid));
      try { localStorage.setItem("village_name", name); localStorage.setItem("village_player_name", name);
            if (grade) localStorage.setItem("village_grade", String(grade)); } catch(e){}
      try { sessionStorage.removeItem("eduarena_google_idtoken"); } catch(e){}
      location.href = "village-web/index.html";
    } catch(e){ showToast("進入失敗，再試一次"); }
  }

  load();
</script>
</body>
</html>
