<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🔨 打地鼠：九九挑戰</title>
<link rel="stylesheet" href="arcade/base.css?v=2">
<link rel="stylesheet" href="arcade/whack.css?v=2">
<link rel="stylesheet" href="arcade/game-ui.css?v=1">
</head>
<body>

<!-- Whack Game Screen（搬自正式版 app.html，路徑改 arcade/img/） -->
<div id="screen-whack-game" class="screen active">
    <header class="screen-header">
        <button class="btn-back" id="whack-game-back">←</button>
        <span class="screen-title"><img class="emo" src="arcade/img/whack/hammer.png" alt=""> 打地鼠：九九挑戰</span>
    </header>
    <div class="whack-stats">
        <span class="whack-time" id="whack-time">⏱ 60</span>
        <span class="whack-score" id="whack-score"><img class="emo" src="arcade/img/icons/hundred.png?s=6" alt=""> 0</span>
        <span class="whack-combo" id="whack-combo"><img class="emo" src="arcade/img/icons/fire.png?s=6" alt=""> 0</span>
    </div>
    <div class="whack-question" id="whack-question">準備...</div>
    <div class="whack-stage">
        <div class="whack-grid" id="whack-grid"></div>
        <div class="whack-countdown" id="whack-countdown" style="display:none">
            <div class="whack-loading" id="whack-loading"><img class="emo" src="arcade/img/icons/box.png?s=6" alt=""> 準備中…</div>
        </div>
    </div>
</div>

<!-- 結算改用共用勝利頁（arcadeUI.victory），舊結算 screen 已移除 -->

<!-- 給 game_whack.js init 綁的入口鈕（封面「開始遊戲」觸發，不顯示） -->
<button id="whack-entry-btn" style="display:none"></button>

<script src="arcade/shim.js?v=1"></script>
<script src="arcade/game-ui.js?v=1"></script>
<script src="arcade/game_whack.js?v=2"></script>
<script>
// 封面＋教學：按「開始遊戲」才開局（教學自動彈出、可略過）
(function boot() {
    function showIntro() {
        window.arcadeUI.intro({
            icon: "arcade/img/whack/mole_idle.png?v=4",
            title: "打地鼠：九九挑戰",
            sub: "60 秒乘法大亂鬥",
            steps: [
                { ico: "🔢", text: "看上方的乘法題目（例：7 × 6 = ?），地鼠會頂著數字冒出來" },
                { ico: "🔨", text: "點「答案正確」的地鼠！答對 +10 分還有連擊加分，打錯 −5 分" },
                { ico: "⏱", text: "限時 60 秒盡量得分；漏掉的地鼠不扣分，放心瞄準" },
            ],
            onStart: function () { document.getElementById("whack-entry-btn").click(); },
        });
    }
    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", showIntro);
    } else {
        showIntro();
    }
})();
</script>
</body>
</html>
