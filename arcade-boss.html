<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<script src="/no-zoom.js?v=1"></script>
<title>魔王戰</title>
<link rel="stylesheet" href="arcade/base.css?v=2">
<link rel="stylesheet" href="arcade/boss/boss-phaser.css?v=3">
<style>
/* 獨立頁殼：app.html 的 .phaser-mode/#screen-boss-game 由 style.css 提供，這裡自帶等價樣式 */
body { background: #120827; }
#screen-boss-game { position: fixed; inset: 0; }
#boss-phaser-root { position: absolute; inset: 0; }
#screen-boss-result {
    min-height: 100vh;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 30%, #2a1545 0%, #120827 70%);
    color: #fff; text-align: center; padding: 24px;
}
#screen-boss-result.active { display: flex; }
.boss-result-content { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.boss-sprite-end { width: 180px; height: 180px; object-fit: contain; }
.boss-result-title { font-size: 26px; font-weight: 900; margin: 0; }
.boss-result-sub { font-size: 15px; color: #d8c8f0; }
.boss-result-coins { font-size: 20px; font-weight: 800; color: #ffd24a; }
.boss-result-bonus { font-size: 14px; color: #ffd24a; }
.btn-primary {
    margin-top: 14px; border: none; border-radius: 14px;
    padding: 13px 30px; font-size: 16px; font-weight: 900;
    background: linear-gradient(135deg, #ff9a40, #ff5e3a); color: #fff; cursor: pointer;
}
.emo { width: 20px; height: 20px; vertical-align: -4px; }
</style>
</head>
<body class="phaser-mode">

<div id="screen-boss-game" class="screen active">
    <!-- Phaser 版 host（markup 同 app.html 新版） -->
    <div id="boss-phaser-root">
        <div class="bf-loading-overlay" id="boss-phaser-loading">
            <div class="bf-load-box">
                <div class="bf-load-text" id="boss-phaser-loadtext">載入魔王中…</div>
                <div class="bf-load-bar"><div class="bf-load-fill" id="boss-phaser-loadbar"></div></div>
                <div class="bf-load-pct" id="boss-phaser-loadpct">0%</div>
            </div>
        </div>
        <div class="bh-overlay" id="bh-overlay" hidden>
            <div class="bh-topbar">
                <button class="bh-back" id="bh-back" aria-label="退出">✕</button>
                <span class="bh-title" id="bh-title"></span>
                <span class="bh-progress" id="bh-progress">1/10</span>
            </div>
            <div class="bh-hpbar">
                <div class="bh-ehearts" id="bh-ehearts"></div>
                <span class="bh-hp-label" id="bh-hp-label"></span>
            </div>
            <div class="bh-mid"></div>
            <div class="bh-quiz">
                <div class="bh-stats">
                    <div class="bh-hearts" id="bh-hearts"></div>
                    <span class="bh-php-label" id="bh-php-label"></span>
                    <span class="bh-combo" id="bh-combo" style="display:none"></span>
                </div>
                <div class="bh-card">
                    <div class="bh-display" id="bh-display"></div>
                    <div class="bh-prompt" id="bh-prompt"></div>
                </div>
                <div class="bh-choices" id="bh-choices">
                    <button class="bh-choice" data-idx="0"></button>
                    <button class="bh-choice" data-idx="1"></button>
                    <button class="bh-choice" data-idx="2"></button>
                    <button class="bh-choice" data-idx="3"></button>
                </div>
            </div>
            <div class="bh-damage" id="bh-damage"></div>
        </div>
    </div>
</div>

<!-- 結算畫面（同 app.html 結構） -->
<div id="screen-boss-result" class="screen">
    <div class="boss-result-content">
        <img class="boss-sprite boss-sprite-end" id="boss-sprite-end" src="" alt="魔王">
        <h1 class="boss-result-title" id="boss-result-title">結果</h1>
        <div class="boss-result-sub" id="boss-result-sub"></div>
        <div class="boss-result-coins" id="boss-result-coins"></div>
        <div class="boss-result-bonus" id="boss-result-bonus" style="display:none"></div>
        <button class="btn-primary" id="boss-result-back">回禁忌森林深處</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script src="arcade/shim.js?v=2"></script>
<script src="arcade/boss/bopomofo.js?v=1"></script>
<script src="arcade/boss/boss-phaser.js?v=4"></script>
<script>
// 啟動：?subject=math&tier=1（地圖怪物 NPC 跳轉帶入）；返回回原機台前
// 鎮魔塔模式：?tower=1&subject=X&floor=N&waves=W → 分波串接多場 boss session、無限爬塔、過層存檔
(function () {
    const qp = new URLSearchParams(location.search);
    const SUBJECTS = ["math", "chinese", "english", "science", "social"];
    const subject = SUBJECTS.includes(qp.get("subject")) ? qp.get("subject") : "math";
    const tier = Math.max(1, Math.min(3, parseInt(qp.get("tier") || "1", 10) || 1));
    const backMap = /^[a-z0-9_]+$/.test(qp.get("map") || "") ? qp.get("map") : "forest_deep";

    // ── 鎮魔塔分波 ──
    const TOWER = qp.get("tower") === "1";
    const towerFloor = Math.max(1, parseInt(qp.get("floor") || "1", 10) || 1);
    const towerWaveCount = Math.max(1, Math.min(5, parseInt(qp.get("waves") || "1", 10) || 1));
    const towerWavesFor = (f) => Math.max(1, Math.min(5, 1 + Math.floor((f - 1) / 2)));   // 與 shop.js towerWaves 同步
    const towerFloorTier = (f) => Math.min(1 + Math.floor((f - 1) / 3), 3);               // 與 shop.js towerTierOf 同步
    const waveTier = (idx) => {  // 最後一波＝該層魔王(floorTier)、前面是小兵(floorTier-1，最低1)
        const ft = towerFloorTier(towerFloor);
        return (idx >= towerWaveCount - 1) ? ft : Math.max(1, ft - 1);
    };
    const SUBJ_LABEL = { math: "數學", chinese: "國語", english: "英語", science: "自然", social: "社會" };
    let towerWaveIdx = 0;   // 0-based 目前波次
    let towerCoins = 0;     // 本層累積金幣

    window.__bossExit = function () {
        const bs = qp.get("back_spawn") || "";
        location.href = "village-web/index.html?map=" + backMap
            + (/^0\.\d+,0\.\d+$/.test(bs) ? "&spawn=" + bs : "");
    };

    function towerSplash(text, sub) {
        let s = document.getElementById("tower-splash");
        if (!s) {
            s = document.createElement("div");
            s.id = "tower-splash";
            s.style.cssText = "position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;"
                + "justify-content:center;text-align:center;gap:10px;color:#fff;"
                + "background:radial-gradient(ellipse at 50% 40%,#3a1a5e 0%,#120827 75%);";
            s.innerHTML = '<div id="tower-splash-t" style="font-size:30px;font-weight:900"></div>'
                + '<div id="tower-splash-s" style="font-size:16px;color:#d8c8f0"></div>';
            document.body.appendChild(s);
        }
        s.querySelector("#tower-splash-t").textContent = text;
        s.querySelector("#tower-splash-s").textContent = sub || "";
        s.style.display = "flex";
    }
    function hideTowerSplash() { const s = document.getElementById("tower-splash"); if (s) s.style.display = "none"; }

    function startTowerWave() {
        towerSplash("第 " + towerFloor + " 層",
            "第 " + (towerWaveIdx + 1) + " / " + towerWaveCount + " 波　" + (SUBJ_LABEL[subject] || "") + "魔物來襲！");
        setTimeout(function () { hideTowerSplash(); window.bossIsland.start(subject, waveTier(towerWaveIdx)); }, 1100);
    }

    // 自訂結算雙鈕（隱藏預設 back 鈕）
    function towerResultBtns(html) {
        const old = document.getElementById("boss-result-back"); if (old) old.style.display = "none";
        let box = document.getElementById("tower-result-btns");
        if (!box) {
            box = document.createElement("div"); box.id = "tower-result-btns";
            box.style.cssText = "display:flex;flex-direction:column;gap:10px;margin-top:14px;width:min(86vw,320px)";
            document.querySelector("#screen-boss-result .boss-result-content").appendChild(box);
        }
        box.innerHTML = html; return box;
    }
    function towerFloorCleared() {
        const nf = towerFloor + 1;
        // 用 Math.max 防進度倒退（舊 floor URL/分頁通關不該蓋掉更高樓層）
        try {
            const cur = parseInt(localStorage.getItem("tower_floor_" + subject) || "1", 10) || 1;
            localStorage.setItem("tower_floor_" + subject, String(Math.max(cur, nf)));
        } catch (e) {}
        const t = document.getElementById("boss-result-title");
        const sub = document.getElementById("boss-result-sub");
        const coins = document.getElementById("boss-result-coins");
        if (t) t.textContent = "🏆 通過第 " + towerFloor + " 層！";
        if (sub) sub.textContent = (SUBJ_LABEL[subject] || "") + "之塔　下一關：第 " + nf + " 層";
        if (coins) coins.textContent = "🪙 本層共獲得 +" + towerCoins + " 金幣";
        const box = towerResultBtns(
            '<button class="btn-primary" id="tw-next" style="margin:0">挑戰第 ' + nf + ' 層</button>'
          + '<button class="btn-primary" id="tw-back" style="margin:0;background:linear-gradient(135deg,#9b8bbf,#6f5e9c)">回鎮魔塔</button>');
        box.querySelector("#tw-next").addEventListener("click", function () {
            const bs = qp.get("back_spawn") || "";
            let q = "?tower=1&subject=" + encodeURIComponent(subject) + "&floor=" + nf + "&waves=" + towerWavesFor(nf) + "&map=" + backMap;
            if (/^0\.\d+,0\.\d+$/.test(bs)) q += "&back_spawn=" + bs;
            location.href = "arcade-boss.html" + q;
        });
        box.querySelector("#tw-back").addEventListener("click", function () { window.__bossExit(); });
    }
    function towerResultEnded(victory) {
        const sub = document.getElementById("boss-result-sub");
        const coins = document.getElementById("boss-result-coins");
        if (victory === false && sub) sub.textContent = "止步於第 " + towerFloor + " 層 · 第 " + (towerWaveIdx + 1) + " 波　再接再厲！";
        if (coins && towerCoins > 0) coins.textContent = "🪙 本層獲得 +" + towerCoins + " 金幣";
        const box = towerResultBtns(
            (victory === false ? '<button class="btn-primary" id="tw-retry" style="margin:0">重試第 ' + towerFloor + ' 層</button>' : '')
          + '<button class="btn-primary" id="tw-back" style="margin:0;background:linear-gradient(135deg,#9b8bbf,#6f5e9c)">回鎮魔塔</button>');
        const rt = box.querySelector("#tw-retry"); if (rt) rt.addEventListener("click", function () { location.reload(); });
        box.querySelector("#tw-back").addEventListener("click", function () { window.__bossExit(); });
    }

    if (TOWER) {
        // 攔 boss session/end 取勝負 + 金幣（給串波判斷）
        const _api = window.eduApi;
        window.eduApi = async function (path, opts) {
            const r = await _api(path, opts);
            if (typeof path === "string" && path.indexOf("/api/boss/session/end") === 0) {
                // 只在後端明確回勝負(無 error 且 victory 是 boolean)才採信；end 失敗/未知 → null(當結束本層、不誤判戰敗)
                try {
                    const d = await r.clone().json();
                    window.__towerLastEnd = (!d.error && typeof d.victory === "boolean")
                        ? { victory: d.victory, coins: d.coins_earned || 0 } : null;
                } catch (e) { window.__towerLastEnd = null; }
            }
            return r;
        };
        // 包 showScreen：boss-result 時依勝負 → 下一波 / 過層 / 失敗
        const _show = window.eduApp.showScreen;
        window.eduApp.showScreen = function (id) {
            if (id === "boss-result") {
                const end = window.__towerLastEnd; window.__towerLastEnd = null;
                const victory = end ? end.victory : null;
                if (end) towerCoins += end.coins;
                if (victory === true && towerWaveIdx + 1 < towerWaveCount) {
                    towerWaveIdx++; startTowerWave();   // 還有下一波 → 不結算、直接續打（splash 立即蓋畫面）
                    return;
                }
                const ret = _show.call(window.eduApp, "boss-result");
                if (victory === true) towerFloorCleared();
                else towerResultEnded(victory);   // false=失敗、null=session/end 失敗無法判定 → 結束本層
                return ret;
            }
            return _show.call(window.eduApp, id);
        };
    }

    function boot() {
        if (!window.bossIsland || typeof Phaser === "undefined") {
            document.getElementById("boss-phaser-loadtext").textContent = "引擎沒載到，請重新整理";
            return;
        }
        if (TOWER) startTowerWave();
        else window.bossIsland.start(subject, tier);
    }
    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", boot);
    } else {
        boot();
    }
})();
</script>
<script src="village-web/play_limit.js?v=5"></script>
</body>
</html>
