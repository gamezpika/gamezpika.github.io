<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>三路答題攻防（原型）</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #0e1630; font-family: "PingFang TC", "Noto Sans TC", sans-serif; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #game { flex: 1 1 auto; position: relative; min-height: 0; }
  #game canvas { display: block; }

  #quiz { flex: 0 0 auto; background: rgba(12,20,48,0.96); border-top: 2px solid #2a3a6a;
    padding: 10px 12px calc(12px + env(safe-area-inset-bottom, 0px)); color: #fff; }
  #q-text { font-size: 15px; font-weight: 600; text-align: center; min-height: 22px; margin-bottom: 8px; line-height: 1.35; }
  #q-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .q-btn { background: #fff; color: #1a2240; border: none; border-radius: 10px; padding: 12px 8px;
    font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .q-btn:active { transform: scale(0.97); }
  .q-btn.correct { background: #27ae60; color: #fff; }
  .q-btn.wrong { background: #e74c3c; color: #fff; }
  #q-hint { text-align: center; font-size: 13px; color: #ffd24a; min-height: 18px; margin-top: 6px; font-weight: 700; }

  #lanepick { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; background: rgba(8,12,30,0.55); z-index: 20; }
  #lanepick.on { display: flex; }
  #lanepick .lp-title { color: #ffd24a; font-size: 17px; font-weight: 900; text-shadow: 0 1px 4px #000; }
  .lp-btn { width: 64%; padding: 14px; border: none; border-radius: 12px; font-size: 16px; font-weight: 800;
    background: linear-gradient(135deg, #4a9fff, #2d6fd6); color: #fff; cursor: pointer; box-shadow: 0 3px 10px rgba(0,0,0,0.4); }
  .lp-btn:active { transform: scale(0.97); }

  .ov { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; background: rgba(8,12,30,0.92); z-index: 40; color: #fff; text-align: center; padding: 26px; }
  .ov h1 { margin: 0; font-size: 24px; font-weight: 900; }
  .ov .card { background: rgba(255,255,255,0.06); border: 1px solid #2a3a6a; border-radius: 14px; padding: 18px 18px;
    text-align: left; font-size: 14.5px; line-height: 1.7; max-width: 340px; }
  .ov .card b { color: #ffd24a; }
  .ov button { margin-top: 6px; border: none; border-radius: 14px; padding: 13px 36px; font-size: 17px; font-weight: 900;
    background: linear-gradient(135deg, #ff9a40, #ff5e3a); color: #fff; cursor: pointer; }
  .ov button:active { transform: scale(0.97); }
  #result { display: none; }
  #result.on { display: flex; }
</style>
</head>
<body>
<div id="wrap">
  <div id="game">
    <div id="lanepick">
      <div class="lp-title">答對！派強援去哪一路？</div>
      <button class="lp-btn" data-lane="0">↖ 上路</button>
      <button class="lp-btn" data-lane="1">⤢ 中路</button>
      <button class="lp-btn" data-lane="2">↘ 下路</button>
    </div>
    <div id="intro" class="ov">
      <h1>⚔️ 三路答題攻防</h1>
      <div class="card">
        🔵 你是<b>藍隊</b>（左下），🔴 電腦是<b>紅隊</b>（右上）。<br>
        • 三路（上路繞邊、中路走對角、下路繞邊）<b>自動出小兵</b>往敵方基地推、遇敵就打。<br>
        • 下方<b>答題</b>：答對 → 選一路<b>派強援</b>；答錯 → 電腦增援。<br>
        • 推掉對面的<b>塔</b>、再推爆<b>基地水晶</b> = <b>獲勝</b>！<br>
        <br>📚 <b>讀書 = 戰力</b>：答得又快又準，三路就壓著打。
      </div>
      <button id="startBtn">開始對戰</button>
    </div>
    <div id="result" class="ov">
      <h1 id="result-title"></h1>
      <div id="result-sub" style="font-size:15px;color:#d8c8f0"></div>
      <button id="againBtn">再玩一次</button>
    </div>
  </div>
  <div id="quiz">
    <div id="q-text">準備開始…</div>
    <div id="q-choices"></div>
    <div id="q-hint"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script>
(function () {
  const QUESTIONS = [
    { q: "8 × 7 = ?", choices: ["54", "56", "63", "49"], a: 1 },
    { q: "「蘋果」的英文是？", choices: ["apple", "banana", "orange", "grape"], a: 0 },
    { q: "15 + 27 = ?", choices: ["42", "32", "41", "52"], a: 0 },
    { q: "一年有幾個月？", choices: ["10", "11", "12", "13"], a: 2 },
    { q: "「天空」的英文是？", choices: ["sea", "sky", "star", "snow"], a: 1 },
    { q: "72 ÷ 8 = ?", choices: ["8", "7", "9", "6"], a: 2 },
    { q: "水的化學式是？", choices: ["CO2", "O2", "H2O", "NaCl"], a: 2 },
    { q: "「謝謝」的英文是？", choices: ["sorry", "hello", "please", "thanks"], a: 3 },
  ];

  let game;

  class Battle extends Phaser.Scene {
    constructor() { super("Battle"); }

    create() {
      const W = this.scale.width, H = this.scale.height;
      this.W = W; this.H = H;
      this.running = false; this.over = false;
      this.minions = [];
      this.combo = 0;

      // 正方形地圖區（置中，留 letterbox）
      const S = Math.min(W, H);
      this.S = S;
      this.ox = (W - S) / 2;
      this.oy = (H - S) / 2;
      const P = (rx, ry) => ({ x: this.ox + rx * S, y: this.oy + ry * S });
      this.P = P;

      // 角落 + 中央
      const BL = P(0.12, 0.88);   // 藍基地 左下
      const TR = P(0.88, 0.12);   // 紅基地 右上
      const TL = P(0.12, 0.12);   // 左上
      const BR = P(0.88, 0.88);   // 右下
      const C  = P(0.5, 0.5);     // 中央
      this.bases = {
        blue: { x: BL.x, y: BL.y, hp: 120, max: 120, side: "blue" },
        red:  { x: TR.x, y: TR.y, hp: 120, max: 120, side: "red" },
      };
      // 三路 waypoint（藍→紅方向）：上路繞上邊、中路對角、下路繞下邊
      this.lanePaths = [
        [BL, TL, TR],   // 0 上路
        [BL, C, TR],    // 1 中路
        [BL, BR, TR],   // 2 下路
      ];

      this._drawMap();

      // 塔：每路 藍塔(靠藍端) + 紅塔(靠紅端)，放路徑中段
      this.towers = [];
      const towerSpots = [
        // [rx, ry, side, lane]
        [0.12, 0.5, "blue", 0], [0.5, 0.12, "red", 0],   // 上路
        [0.31, 0.69, "blue", 1], [0.69, 0.31, "red", 1], // 中路
        [0.5, 0.88, "blue", 2], [0.88, 0.5, "red", 2],   // 下路
      ];
      towerSpots.forEach(([rx, ry, side, lane]) => {
        const p = P(rx, ry);
        const col = side === "blue" ? 0x3f7fd0 : 0xd05f5f;
        const obj = this.add.rectangle(p.x, p.y, 20, 26, col).setStrokeStyle(2, 0xffffff, 0.5).setDepth(4);
        this.towers.push({ x: p.x, y: p.y, side, lane, hp: 70, max: 70, range: 64, atk: 9, cd: 0, obj, alive: true });
      });

      // 基地水晶圖示 + 血條
      this.blueCrystal = this.add.star(BL.x, BL.y, 6, 13, 26, 0x4a9fff).setStrokeStyle(2, 0xffffff, 0.6).setDepth(6);
      this.redCrystal  = this.add.star(TR.x, TR.y, 6, 13, 26, 0xff5e5e).setStrokeStyle(2, 0xffffff, 0.6).setDepth(6);
      this.barG = this.add.graphics().setDepth(8);
      this._drawBars();

      this._bindDOM();

      // 基礎兵流：雙方三路每 3.8s 各出 1 兵
      this.time.addEvent({ delay: 3800, loop: true, callback: () => {
        if (!this.running || this.over) return;
        for (let l = 0; l < 3; l++) { this._spawn("blue", l, false); this._spawn("red", l, false); }
      }});
      // AI 每 6s 隨機補一路
      this.time.addEvent({ delay: 6000, loop: true, callback: () => {
        if (!this.running || this.over) return;
        this._wave("red", Phaser.Math.Between(0, 2));
      }});
    }

    _drawMap() {
      const g = this.add.graphics().setDepth(0);
      const S = this.S, ox = this.ox, oy = this.oy;
      // 底（地圖外深色 + 地圖區草綠）
      g.fillStyle(0x0e1630, 1).fillRect(0, 0, this.W, this.H);
      g.fillStyle(0x3a4a2c, 1).fillRoundedRect(ox + S * 0.04, oy + S * 0.04, S * 0.92, S * 0.92, 18);
      // 河道：左上↔右下 斜帶（垂直於中路對角）
      g.lineStyle(S * 0.13, 0x2c6e7a, 0.55);
      g.beginPath(); g.moveTo(this.P(0.12, 0.12).x, this.P(0.12, 0.12).y); g.lineTo(this.P(0.88, 0.88).x, this.P(0.88, 0.88).y); g.strokePath();
      // 三路：畫 waypoint 連線（土色寬路）
      this.lanePaths.forEach(path => {
        g.lineStyle(20, 0x6b5a3a, 0.9);
        g.beginPath(); g.moveTo(path[0].x, path[0].y);
        for (let i = 1; i < path.length; i++) g.lineTo(path[i].x, path[i].y);
        g.strokePath();
      });
      // 基地圈
      g.lineStyle(3, 0x4a9fff, 0.8).strokeCircle(this.bases.blue.x, this.bases.blue.y, S * 0.10);
      g.lineStyle(3, 0xff5e5e, 0.8).strokeCircle(this.bases.red.x, this.bases.red.y, S * 0.10);
    }

    _spawn(side, lane, strong, boost) {
      const b = boost || 1;
      const path = side === "blue" ? this.lanePaths[lane] : this.lanePaths[lane].slice().reverse();
      const start = path[0];
      const col = side === "blue" ? 0x6fc0ff : 0xff8a8a;
      const rad = strong ? 9 : 6;
      const obj = this.add.circle(start.x, start.y, rad, col).setDepth(7);
      if (strong) obj.setStrokeStyle(2, 0xffd24a);
      const hp = Math.round((strong ? 28 : 13) * b);
      this.minions.push({
        side, lane, x: start.x, y: start.y, obj, path, wpIdx: 1,
        hp, max: hp,
        atk: Math.round((strong ? 7 : 3) * b), speed: strong ? 48 : 38, range: 20, cd: 0,
      });
    }

    _wave(side, lane, combo) {
      const c = Math.min(combo || 0, 5);
      const n = 4 + c;                       // 連對越多兵越多
      const boost = 1 + c * 0.18;            // 連對越強兵越猛
      this._laneFlash(lane, side);
      const path = this.lanePaths[lane], mid = path[1];
      const label = ["上路", "中路", "下路"][lane];
      if (side === "blue") {
        this._floatText(mid.x, mid.y, "⚡" + label + "強襲！", "#7fc4ff");
        if (combo >= 2) this._floatText(mid.x, mid.y - 26, "連對 COMBO ×" + combo, "#ffd24a");
      } else {
        this._floatText(mid.x, mid.y, "🔴 " + label + "反攻", "#ff8a8a");
      }
      for (let i = 0; i < n; i++) this.time.delayedCall(i * 110, () => { if (!this.over) this._spawn(side, lane, true, boost); });
    }

    update(time, dt) {
      if (!this.running || this.over) return;
      const d = dt / 1000;

      for (const m of this.minions) {
        if (m.dead) continue;
        m.cd -= dt;
        const tgt = this._nearestEnemy(m);
        if (tgt && Math.hypot(tgt.x - m.x, tgt.y - m.y) <= m.range + (tgt.r || 6)) {
          if (m.cd <= 0) { this._damage(tgt, m.atk); m.cd = 600; this._flash(m.obj); }
        } else {
          this._advance(m, d);
        }
      }

      for (const t of this.towers) {
        if (!t.alive) continue;
        t.cd -= dt;
        if (t.cd > 0) continue;
        const e = this.minions.find(m => !m.dead && m.side !== t.side && Math.hypot(m.x - t.x, m.y - t.y) <= t.range);
        if (e) { this._damage(e, t.atk); t.cd = 700; this._flash(t.obj); }
      }

      this.minions = this.minions.filter(m => { if (m.dead) { m.obj.destroy(); return false; } return true; });

      if (this.bases.blue.hp <= 0) this._end(false);
      else if (this.bases.red.hp <= 0) this._end(true);
    }

    _advance(m, d) {
      const tgt = m.path[m.wpIdx];
      if (!tgt) return;
      const dx = tgt.x - m.x, dy = tgt.y - m.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 6) {
        if (m.wpIdx < m.path.length - 1) m.wpIdx++;
      } else {
        m.x += dx / dist * m.speed * d;
        m.y += dy / dist * m.speed * d;
        m.obj.x = m.x; m.obj.y = m.y;
      }
    }

    _nearestEnemy(m) {
      let best = null, bestD = Infinity;
      for (const e of this.minions) {
        if (e.dead || e.side === m.side || e.lane !== m.lane) continue;
        const dd = Math.hypot(e.x - m.x, e.y - m.y);
        if (dd < bestD) { best = e; bestD = dd; e.r = 6; }
      }
      for (const t of this.towers) {
        if (!t.alive || t.side === m.side || t.lane !== m.lane) continue;
        const dd = Math.hypot(t.x - m.x, t.y - m.y);
        if (dd < bestD) { best = t; bestD = dd; t.r = 11; }
      }
      const base = m.side === "blue" ? this.bases.red : this.bases.blue;
      const bd = Math.hypot(base.x - m.x, base.y - m.y);
      if (bd < bestD) { best = base; base.r = 22; }
      return best;
    }

    _damage(target, amt) {
      target.hp -= amt;
      if (target.alive !== undefined) { // tower
        if (target.hp <= 0) { target.alive = false; this._floatText(target.x, target.y, "塔被推掉！", "#ffd24a"); target.obj.destroy(); }
      } else if (target.dead !== undefined) { // minion
        if (target.hp <= 0) target.dead = true;
      } else { // crystal
        if (target.hp < 0) target.hp = 0;
        this._drawBars();
        this._floatText(target.x, target.y - 24, "-" + amt, target.side === "blue" ? "#ff8a8a" : "#7fc4ff");
        this._flash(target.side === "blue" ? this.blueCrystal : this.redCrystal);
      }
    }

    _flash(obj) { if (obj && obj.scene) this.tweens.add({ targets: obj, alpha: 0.4, duration: 70, yoyo: true }); }

    _laneFlash(lane, side) {
      const path = this.lanePaths[lane];
      const col = side === "blue" ? 0x7fc4ff : 0xff8a8a;
      const g = this.add.graphics().setDepth(9);
      g.lineStyle(22, col, 0.9);
      g.beginPath(); g.moveTo(path[0].x, path[0].y);
      for (let i = 1; i < path.length; i++) g.lineTo(path[i].x, path[i].y);
      g.strokePath();
      this.tweens.add({ targets: g, alpha: 0, duration: 600, onComplete: () => g.destroy() });
    }

    _floatText(x, y, text, color) {
      const t = this.add.text(x, y, text, { fontFamily: "sans-serif", fontSize: "16px", fontStyle: "bold", color: color || "#fff", stroke: "#000", strokeThickness: 3 }).setOrigin(0.5).setDepth(50);
      this.tweens.add({ targets: t, y: y - 34, alpha: 0, duration: 900, ease: "Cubic.easeOut", onComplete: () => t.destroy() });
    }

    _drawBars() {
      const g = this.barG; g.clear();
      const bw = this.W * 0.30, h = 8;
      const b = this.bases.blue, r = this.bases.red;
      g.fillStyle(0x000000, 0.5).fillRect(10, 8, bw, h);
      g.fillStyle(0x4a9fff, 1).fillRect(10, 8, bw * Math.max(0, b.hp) / b.max, h);
      g.fillStyle(0x000000, 0.5).fillRect(this.W - 10 - bw, 8, bw, h);
      g.fillStyle(0xff5e5e, 1).fillRect(this.W - 10 - bw, 8, bw * Math.max(0, r.hp) / r.max, h);
    }

    _bindDOM() {
      this.qText = document.getElementById("q-text");
      this.qChoices = document.getElementById("q-choices");
      this.qHint = document.getElementById("q-hint");
      this.lanepick = document.getElementById("lanepick");
      this.qIdx = 0; this.locked = false;
      this.lanepick.querySelectorAll(".lp-btn").forEach(b => {
        b.addEventListener("click", () => {
          this._wave("blue", parseInt(b.dataset.lane, 10), this.combo);
          this.lanepick.classList.remove("on");
          this._nextQuestion();
        });
      });
    }

    startGame() { this.running = true; this._nextQuestion(); }

    _nextQuestion() {
      if (this.over) return;
      this.locked = false;
      const item = QUESTIONS[this.qIdx % QUESTIONS.length];
      this.qIdx++;
      this.qText.textContent = item.q;
      this.qHint.textContent = "";
      this.qChoices.innerHTML = "";
      item.choices.forEach((c, i) => {
        const btn = document.createElement("button");
        btn.className = "q-btn"; btn.textContent = c;
        btn.addEventListener("click", () => this._answer(i, item, btn));
        this.qChoices.appendChild(btn);
      });
    }

    _answer(i, item, btn) {
      if (this.locked) return;
      this.locked = true;
      const correct = i === item.a;
      btn.classList.add(correct ? "correct" : "wrong");
      if (correct) {
        this.combo++;
        this.qHint.textContent = this.combo >= 2 ? ("✓ 連對 ×" + this.combo + "！選一路派強援") : "✓ 答對！選一路派強援";
        this.lanepick.classList.add("on");
      } else {
        this.combo = 0;
        const right = this.qChoices.children[item.a];
        if (right) right.classList.add("correct");
        this.qHint.textContent = "✗ 答錯！電腦趁機反攻";
        this._wave("red", Phaser.Math.Between(0, 2), 0);
        this.time.delayedCall(1200, () => this._nextQuestion());
      }
    }

    _end(win) {
      if (this.over) return;
      this.over = true; this.running = false;
      document.getElementById("result-title").textContent = win ? "🏆 獲勝！" : "💀 戰敗";
      document.getElementById("result-sub").textContent = win ? "讀書就是戰力，你壓制了全場！" : "再讀熟一點，下次贏回來！";
      document.getElementById("result").classList.add("on");
    }
  }

  function boot() {
    const host = document.getElementById("game");
    game = new Phaser.Game({
      type: Phaser.AUTO,
      width: host.clientWidth, height: host.clientHeight,
      parent: "game",
      backgroundColor: "#0e1630",
      scale: { mode: Phaser.Scale.RESIZE, autoCenter: Phaser.Scale.CENTER_BOTH },
      scene: Battle,
    });
    window.__moba = game;
    document.getElementById("startBtn").addEventListener("click", () => {
      document.getElementById("intro").style.display = "none";
      game.scene.getScene("Battle").startGame();
    });
    document.getElementById("againBtn").addEventListener("click", () => location.reload());
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
</body>
</html>
