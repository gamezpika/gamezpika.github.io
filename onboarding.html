<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16213E">
<title>小智學園 · 新手任務</title>
<style>
  :root{
    --orange:#FF8C42; --blue:#00D4FF; --yellow:#FFD54F; --teal:#26C6DA;
    --bg:#16213E; --bg2:#0d1530; --ink:#2a1c08; --red:#FF5252;
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; overflow:hidden; background:#000;
    font-family:"Noto Sans TC","PingFang TC","Apple Color Emoji","Segoe UI Emoji",sans-serif;
    color:#fff; -webkit-user-select:none; user-select:none; -webkit-font-smoothing:antialiased; }

  /* ── 舞台（直式手機優先，桌面置中加殼）── */
  #stage{ position:fixed; inset:0; overflow:hidden;
    background:radial-gradient(120% 100% at 50% 0%, #1f2f57 0%, var(--bg) 55%, var(--bg2) 100%);
    max-width:480px; margin:0 auto; }
  @media(min-width:520px){
    body{ background:#0b0f1a; display:flex; align-items:center; justify-content:center; }
    #stage{ position:relative; width:393px; height:852px; max-height:96vh; border-radius:38px;
      box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 0 11px #11151f, 0 0 0 13px #2a3142; }
  }

  /* ── 場景層 ── */
  .scene{ position:absolute; inset:0; opacity:0; visibility:hidden; transition:opacity .55s ease;
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; }
  .scene.on{ opacity:1; visibility:visible; }
  .scene-bg{ position:absolute; inset:0; background-size:cover; background-position:center; }
  .dim{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,.55)); }

  /* ── HUD 任務進度 ── */
  #hud{ position:absolute; top:0; left:0; right:0; z-index:40; padding:14px 16px calc(14px + env(safe-area-inset-top));
    display:flex; align-items:center; gap:10px; opacity:0; transform:translateY(-12px);
    transition:opacity .4s, transform .4s; pointer-events:none;
    background:linear-gradient(180deg, rgba(13,21,48,.85), rgba(13,21,48,0)); }
  #hud.on{ opacity:1; transform:none; }
  #hud .label{ font-size:13px; font-weight:800; color:var(--yellow); white-space:nowrap; }
  #hud .bar{ flex:1; height:9px; border-radius:999px; background:rgba(255,255,255,.14); overflow:hidden; }
  #hud .fill{ height:100%; width:0; border-radius:999px; transition:width .6s cubic-bezier(.2,.8,.2,1);
    background:linear-gradient(90deg, var(--orange), var(--yellow)); }
  #hud .count{ font-size:13px; font-weight:800; color:#fff; min-width:34px; text-align:right; }

  /* ── 系統精靈 ── */
  #fairy{ position:absolute; z-index:30; width:150px; left:50%; bottom:210px;
    transform:translateX(-50%); transition:left .6s ease, bottom .6s ease, width .6s ease, opacity .4s;
    filter:drop-shadow(0 10px 18px rgba(0,0,0,.45)); pointer-events:none; opacity:0; }
  #fairy.show{ opacity:1; }
  #fairy img{ width:100%; display:block; animation:floaty 3.2s ease-in-out infinite; }
  #fairy .halo{ position:absolute; left:50%; top:55%; width:170%; height:60%; transform:translate(-50%,-50%);
    background:radial-gradient(closest-side, var(--blue-glow,rgba(0,212,255,.35)), transparent 70%);
    border-radius:50%; z-index:-1; animation:pulse 3.2s ease-in-out infinite; }
  @keyframes floaty{ 0%,100%{ transform:translateY(0) scale(1); } 50%{ transform:translateY(-16px) scale(1.015,.985); } }
  @keyframes pulse{ 0%,100%{ opacity:.5; transform:translate(-50%,-50%) scale(.9); } 50%{ opacity:.85; transform:translate(-50%,-50%) scale(1.05); } }

  /* ── 對話泡泡（打字機）── */
  #bubble{ position:absolute; z-index:35; left:18px; right:18px; bottom:calc(40px + env(safe-area-inset-bottom));
    background:#fff; color:var(--ink); border-radius:18px; padding:16px 18px 18px; line-height:1.6; font-size:16px;
    box-shadow:0 12px 30px rgba(0,0,0,.4); opacity:0; transform:translateY(16px); transition:opacity .35s, transform .35s;
    pointer-events:none; }
  #bubble.on{ opacity:1; transform:none; pointer-events:auto; }
  #bubble .who{ font-size:12px; font-weight:900; color:var(--orange); margin-bottom:4px; }
  #bubble .tap{ margin-top:10px; text-align:right; font-size:12px; color:#9aa; font-weight:700; animation:blink 1.2s infinite; }
  @keyframes blink{ 50%{ opacity:.3; } }
  #bubble:after{ content:""; position:absolute; top:-12px; left:40px; border:7px solid transparent; border-bottom-color:#fff; }

  /* ── 通用按鈕 ── */
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; border:none;
    font-family:inherit; font-weight:900; color:var(--ink); background:linear-gradient(135deg, var(--yellow), var(--orange));
    padding:14px 28px; border-radius:999px; font-size:16px; box-shadow:0 8px 22px rgba(255,140,66,.45);
    transition:transform .12s; }
  .btn:active{ transform:scale(.95); }
  .btn.ghost{ background:rgba(255,255,255,.1); color:#cfe0ff; box-shadow:none; border:1px solid rgba(255,255,255,.22); }

  /* ── S0 Logo ── */
  #s0 .logo{ text-align:center; }
  #s0 .logo h1{ font-size:46px; font-weight:900; line-height:1.15; letter-spacing:2px;
    background:linear-gradient(135deg,#fff,var(--yellow) 45%,var(--orange)); -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 40px rgba(255,213,79,.25); animation:logoIn 1s cubic-bezier(.2,.9,.2,1) both; }
  #s0 .logo .en{ margin-top:6px; font-size:14px; letter-spacing:6px; color:var(--blue); font-weight:800;
    animation:logoIn 1s .25s cubic-bezier(.2,.9,.2,1) both; }
  #s0 .logo .tag{ margin-top:18px; font-size:14px; color:#bcd0f0; animation:logoIn 1s .5s ease both; }
  #s0 .start{ margin-top:42px; animation:logoIn 1s .8s ease both; }
  @keyframes logoIn{ from{ opacity:0; transform:translateY(18px) scale(.94); } to{ opacity:1; transform:none; } }
  .sparkles span{ position:absolute; font-size:18px; animation:twk 2.4s ease-in-out infinite; opacity:.0; }
  @keyframes twk{ 0%,100%{ opacity:0; transform:scale(.6); } 50%{ opacity:1; transform:scale(1.1); } }

  /* ── S1 上學路（校園場景）── */
  #s1 .student{ position:absolute; z-index:6; bottom:31%; left:14%; width:146px;
    filter:drop-shadow(0 10px 16px rgba(0,0,0,.4)); }
  .phone-pickup{ position:absolute; bottom:28%; left:50%; transform:translateX(-50%); cursor:pointer; z-index:7;
    animation:phoneGlow 1.6s ease-in-out infinite; }
  @keyframes phoneGlow{ 0%,100%{ filter:drop-shadow(0 0 6px var(--blue)); transform:translateX(-50%) translateY(0) scale(1); }
    50%{ filter:drop-shadow(0 0 26px var(--blue)) drop-shadow(0 0 50px var(--blue)); transform:translateX(-50%) translateY(-6px) scale(1.08); } }

  /* ── S2 發光轉場 ── */
  .glow-burst{ position:absolute; width:50px; height:50px; border-radius:50%; transform:translate(-50%,-50%) scale(0);
    z-index:48; pointer-events:none;
    background:radial-gradient(circle, #ffffff 0%, #d6fbff 28%, rgba(0,212,255,0.75) 52%, rgba(0,212,255,0) 75%); }
  .glow-burst.go{ animation:glowBurst 1.1s ease-out forwards; }
  @keyframes glowBurst{ 0%{ transform:translate(-50%,-50%) scale(0); opacity:.85; }
    55%{ opacity:1; } 100%{ transform:translate(-50%,-50%) scale(32); opacity:1; } }
  #flash{ position:absolute; inset:0; background:#fff; opacity:0; z-index:50; pointer-events:none; }
  #flash.go{ animation:fl 1.4s ease forwards; }
  @keyframes fl{ 0%{ opacity:0; } 55%{ opacity:1; } 100%{ opacity:0; } }

  /* ── 任務舞台中央卡 ── */
  .panel{ position:absolute; left:18px; right:18px; top:50%; transform:translateY(-54%);
    background:rgba(15,22,46,.92); border:1px solid rgba(255,255,255,.14); border-radius:22px; padding:20px 18px 22px;
    box-shadow:0 18px 50px rgba(0,0,0,.5); z-index:25; }
  .panel h3{ font-size:17px; margin-bottom:14px; text-align:center; color:#fff; }
  .panel .q{ font-size:18px; font-weight:800; text-align:center; margin-bottom:16px; line-height:1.5; }
  .opts{ display:grid; gap:10px; }
  .opt{ background:rgba(255,255,255,.07); border:1.5px solid rgba(255,255,255,.16); border-radius:14px; padding:14px;
    font-size:16px; font-weight:700; text-align:center; cursor:pointer; transition:.15s; }
  .opt:active{ transform:scale(.97); }
  .opt.right{ background:rgba(38,198,124,.25); border-color:#26C67c; }
  .opt.wrong{ background:rgba(255,82,82,.2); border-color:var(--red); }

  /* 圖鑑卡 / 開箱 */
  .card-reward{ display:flex; flex-direction:column; align-items:center; gap:10px; }
  .chest{ font-size:74px; animation:chestShake .5s ease 3; }
  @keyframes chestShake{ 0%,100%{ transform:rotate(0); } 25%{ transform:rotate(-9deg); } 75%{ transform:rotate(9deg); } }
  .gacha{ width:160px; height:210px; border-radius:18px; perspective:900px; }
  .gacha .inner{ position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .8s; transform:rotateY(180deg); }
  .gacha.flip .inner{ transform:rotateY(0); }
  .gacha .face{ position:absolute; inset:0; backface-visibility:hidden; border-radius:18px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:6px; }
  .gacha .back{ background:linear-gradient(135deg,#3a2f6b,#6b4ea0); transform:rotateY(180deg); font-size:48px;
    border:2px solid rgba(255,255,255,.3); }
  .gacha .front{ background:linear-gradient(160deg,#fff6e6,#ffe2b0); color:var(--ink); border:3px solid var(--yellow);
    box-shadow:0 0 30px var(--yellow); }
  .gacha .front .ic{ font-size:58px; } .gacha .front .nm{ font-weight:900; font-size:16px; }
  .gacha .front .buff{ font-size:12px; font-weight:800; color:#b5651d; }

  /* coin burst */
  .coin{ position:absolute; font-size:24px; z-index:60; pointer-events:none; animation:coinUp 1s ease forwards; }
  @keyframes coinUp{ 0%{ opacity:1; transform:translateY(0) scale(.6); } 100%{ opacity:0; transform:translateY(-130px) scale(1.2); } }

  /* 升階徽章 */
  .badge-up{ display:flex; align-items:center; justify-content:center; gap:14px; font-weight:900; font-size:18px; }
  .badge-up .old{ opacity:.5; } .badge-up .arrow{ color:var(--yellow); font-size:24px; animation:nudge 1s infinite; }
  .badge-up .new{ color:var(--yellow); text-shadow:0 0 18px var(--yellow); animation:popNew .6s ease both; }
  @keyframes popNew{ 0%{ transform:scale(.4); opacity:0; } 70%{ transform:scale(1.2); } 100%{ transform:scale(1); opacity:1; } }
  @keyframes nudge{ 50%{ transform:translateX(4px); } }

  /* PK */
  .pk{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:16px; }
  .pk .side{ flex:1; text-align:center; }
  .pk .who2{ font-size:13px; font-weight:800; color:#bcd0f0; } .pk .ava{ font-size:40px; }
  .pk .scr{ font-size:26px; font-weight:900; } .pk .vs{ font-size:18px; color:var(--orange); font-weight:900; }
  .pk .you .scr{ color:var(--blue); } .pk .cpu .scr{ color:var(--red); }

  /* 蛋孵化 */
  .egg{ font-size:90px; animation:eggShake 0.45s ease 4; }
  @keyframes eggShake{ 0%,100%{ transform:rotate(0); } 25%{ transform:rotate(-12deg); } 75%{ transform:rotate(12deg); } }
  .hatched{ font-size:80px; animation:popNew .7s ease both; }

  /* 選科 */
  .subjects{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  .subj{ background:rgba(255,255,255,.08); border:1.5px solid rgba(255,255,255,.18); border-radius:14px; padding:14px 4px;
    text-align:center; cursor:pointer; transition:.15s; } .subj:active{ transform:scale(.94); }
  .subj .e{ font-size:26px; display:block; } .subj .n{ font-size:12px; font-weight:800; margin-top:4px; }

  /* 魔王 */
  .boss{ text-align:center; }
  .boss .b{ font-size:88px; animation:bossFloat 2s ease-in-out infinite; display:inline-block; }
  @keyframes bossFloat{ 50%{ transform:translateY(-10px); } }
  .hpbar{ height:14px; border-radius:999px; background:rgba(255,255,255,.15); overflow:hidden; margin:14px 0 6px; }
  .hpfill{ height:100%; width:100%; background:linear-gradient(90deg,var(--red),#ff8a8a); transition:width .5s; }

  /* finale */
  .finale{ text-align:center; }
  .finale h2{ font-size:26px; font-weight:900; margin-bottom:8px;
    background:linear-gradient(135deg,#fff,var(--yellow),var(--orange)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .finale .rewards{ display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin:18px 0 6px; }
  .finale .rw{ background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); border-radius:14px; padding:10px 14px;
    font-size:13px; font-weight:800; } .finale .rw .e{ font-size:22px; display:block; margin-bottom:2px; }

  .hidden{ display:none !important; }
  .gi{ display:inline-block; width:auto; vertical-align:middle; object-fit:contain; }
  .gib{ display:block; margin:0 auto; }
  .confetti{ position:absolute; top:-20px; font-size:18px; z-index:55; pointer-events:none; animation:fall linear forwards; }
  @keyframes fall{ to{ transform:translateY(120vh) rotate(540deg); opacity:.2; } }
</style>
</head>
<body>
<div id="stage">

  <!-- HUD -->
  <div id="hud">
    <span class="label">新手任務</span>
    <div class="bar"><div class="fill" id="hudfill"></div></div>
    <span class="count" id="hudcount">0/5</span>
  </div>

  <!-- S0 Logo -->
  <section class="scene" id="s0" data-tap="next">
    <div class="sparkles" id="sp0"></div>
    <div class="logo">
      <h1>小智學園</h1>
      <div class="en">XIAOZHI ACADEMY</div>
      <div class="tag">撿到一支發光的手機，你的冒險即將開始…</div>
    </div>
    <div class="start"><button class="btn" onclick="next()">▶ 開始</button></div>
  </section>

  <!-- S1 上學路撿手機 -->
  <section class="scene" id="s1">
    <div class="scene-bg" id="streetbg"></div>
    <img class="student" src="assets/images/onboarding/student_pickup.png?v=1" alt="小學生">
    <div class="phone-pickup" id="phonePick" onclick="pickPhone()"><img class="gi" style="height:60px" src="assets/images/onboarding/phone.png?v=1" alt=""></div>
  </section>

  <!-- S2 穿越漩渦 -->
  <section class="scene" id="s2"></section>

  <!-- S3 小屋（精靈自介在這裡用 bubble） -->
  <section class="scene" id="s3">
    <div class="scene-bg" id="cabinbg"></div>
    <div class="dim"></div>
  </section>

  <!-- 任務場景共用容器 -->
  <section class="scene" id="task">
    <div class="scene-bg" id="taskbg"></div>
    <div class="dim"></div>
    <div class="panel" id="panel"></div>
  </section>

  <!-- 結尾 -->
  <section class="scene" id="end">
    <div class="scene-bg" id="endbg"></div>
    <div class="dim"></div>
    <div class="finale panel" style="top:50%;">
      <h2><img class="gi" style="height:28px" src="assets/images/onboarding/icon_party.png?v=1" alt=""> 新手任務完成！</h2>
      <div style="font-size:14px;color:#cfe0ff;line-height:1.6;">你打倒了初始魔王，<br>正式成為小智學園的一員！</div>
      <div class="rewards">
        <div class="rw"><span class="e"><img class="gi gib" style="height:30px" src="assets/images/onboarding/coin.png?v=1" alt=""></span>2000+ 金幣</div>
        <div class="rw"><span class="e"><img class="gi gib" style="height:30px" src="assets/images/onboarding/badge_student.png?v=1" alt=""></span>正式學員</div>
        <div class="rw"><span class="e"><img class="gi gib" style="height:30px" src="assets/images/onboarding/knife.png?v=1" alt=""></span>美工刀</div>
        <div class="rw"><span class="e"><img class="gi gib" style="height:30px" src="assets/images/onboarding/backpack.png?v=1" alt=""></span>帽 + 書包</div>
        <div class="rw"><span class="e"><img class="gi gib" style="height:30px" src="assets/images/onboarding/pet_chick.png?v=1" alt=""></span>初始寵物</div>
        <div class="rw"><span class="e"><img class="gi gib" style="height:30px" src="assets/images/onboarding/scroll.png?v=1" alt=""></span>轉職道具</div>
      </div>
      <div style="margin-top:18px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
        <button class="btn" onclick="restart()"><img class="gi" style="height:20px" src="assets/images/onboarding/icon_replay.png?v=1" alt=""> 重看一次</button>
        <a class="btn ghost" href="/ocean.html">▶ 看完整技術版</a>
      </div>
    </div>
  </section>

  <!-- 精靈 + 泡泡（跨場景持續） -->
  <div id="fairy"><div class="halo"></div><img src="assets/images/onboarding/sprite_main.png?v=1" alt="系統精靈"></div>
  <div id="bubble"><div class="who">系統精靈 · 小智</div><div class="txt" id="btxt"></div><div class="tap" id="btap">輕觸繼續 ▼</div></div>

</div>

<script>
const SPRITE_NAME = "小智";
const AST='assets/images/onboarding/';
function gi(name,h,b){ return '<img class="gi'+(b?' gib':'')+'" style="height:'+h+'px" src="'+AST+name+'.png?v=1" alt="">'; }

// ── DOM refs ──
const $ = s => document.querySelector(s);
const scenes = { s0:$('#s0'), s1:$('#s1'), s2:$('#s2'), s3:$('#s3'), task:$('#task'), end:$('#end') };
const fairy = $('#fairy'), bubble = $('#bubble'), btxt = $('#btxt'), btap = $('#btap');
const hud = $('#hud'), hudfill = $('#hudfill'), hudcount = $('#hudcount');
const panel = $('#panel');

// 小屋 / 任務背景：找不到圖時用漸層 fallback（cover）
const CABIN = "assets/images/onboarding/cabin_interior.jpg?v=1";
const GRAD = "linear-gradient(180deg,#3a2a55,#1d1733)";
function setBg(el, url){
  const img = new Image();
  img.onload = ()=>{ el.style.backgroundImage = `url('${url}')`; };
  img.onerror = ()=>{ el.style.backgroundImage = GRAD; };
  img.src = url;
}
const STREET = "assets/images/onboarding/street_school_bg.jpg?v=1";
setBg($('#cabinbg'), CABIN); setBg($('#taskbg'), CABIN); setBg($('#endbg'), CABIN);
setBg($('#streetbg'), STREET);

function showScene(key){
  Object.values(scenes).forEach(s=>s.classList.remove('on'));
  scenes[key].classList.add('on');
}

// ── 對話泡泡（打字機）──
let typing = null, onBubbleTap = null;
function say(text, cb, opts={}){
  clearInterval(typing);
  bubble.querySelector('.who').textContent = (opts.who || ('系統精靈 · ' + SPRITE_NAME));
  bubble.classList.add('on'); btxt.textContent=''; btap.style.display='none';
  btxt._full = text.length;
  let i=0;
  typing = setInterval(()=>{
    btxt.textContent = text.slice(0, ++i);
    if(i>=text.length){ clearInterval(typing); typing=null; btap.style.display = cb?'block':'none'; onBubbleTap = cb||null; }
  }, 32);
}
bubble.addEventListener('click', ()=>{
  if(typing && btxt.textContent.length < (btxt._full||0)) return;
  if(onBubbleTap){ const f=onBubbleTap; onBubbleTap=null; btap.style.display='none'; f(); }
});
function hideBubble(){ bubble.classList.remove('on'); onBubbleTap=null; }

// ── 精靈定位 ──
function fairyShow(show){ fairy.classList.toggle('show', show); }
function fairyAt(left, bottom, w){ // px / %
  if(left!=null) fairy.style.left = left;
  if(bottom!=null) fairy.style.bottom = bottom;
  if(w!=null) fairy.style.width = w;
}

// ── HUD ──
let step = 0;
function setHud(n){ step=n; hud.classList.add('on'); hudcount.textContent = n+'/5'; hudfill.style.width = (n/5*100)+'%'; }

// ── 小工具：金幣噴發 / 彩帶 ──
function coinBurst(x,y,n=8){
  for(let k=0;k<n;k++){ const c=document.createElement('div'); c.className='coin'; c.innerHTML=gi('coin',24);
    c.style.left=(x+(Math.random()*60-30))+'px'; c.style.top=y+'px'; c.style.animationDelay=(k*40)+'ms';
    $('#stage').appendChild(c); setTimeout(()=>c.remove(),1100); }
}
function confetti(n=40){
  for(let k=0;k<n;k++){ const c=document.createElement('div'); c.className='confetti';
    c.innerHTML=gi(['icon_party','star','sparkle','confetti','heart'][k%5],18); c.style.left=Math.random()*100+'%';
    c.style.animationDuration=(1.6+Math.random()*1.6)+'s'; c.style.animationDelay=(Math.random()*0.6)+'s';
    $('#stage').appendChild(c); setTimeout(()=>c.remove(),3600); }
}

// 加 logo sparkles
(function(){ const sp=$('#sp0'); for(let k=0;k<8;k++){ const s=document.createElement('span'); s.innerHTML=gi('spark_logo',16);
  s.style.left=Math.random()*90+5+'%'; s.style.top=Math.random()*70+10+'%';
  s.style.animationDelay=(Math.random()*2)+'s'; s.style.color=k%2?'#FFD54F':'#00D4FF'; sp.appendChild(s);} })();

// ═══════════════ 流程 ═══════════════
let stage = 0;
function next(){ stage++; run(); }
function run(){
  switch(stage){
    case 1: // 撿手機
      showScene('s1'); fairyShow(false); hideBubble();
      setTimeout(()=>say('放學路上，你撿到一支發光的手機…\n（輕觸手機）', null, {who:'旁白'}), 400);
      break;
    case 2: break; // 由 pickPhone() 推進
    case 3: // 小屋 + 精靈登場 + 自介
      showScene('s3');
      fairyAt('50%','42%','40px'); fairyShow(true);
      // 手機放大→變精靈
      setTimeout(()=>{ fairyAt('50%','230px','170px'); }, 250);
      setTimeout(()=> say('哇！你終於醒了！我是被困在手機裡的系統精靈——「'+SPRITE_NAME+'」！', step1Intro), 1100);
      break;
  }
}
function pickPhone(){
  if(stage!==1) return;
  const ph=$('#phonePick');
  ph.style.transition='transform .45s, filter .45s';
  ph.style.transform='translateX(-50%) scale(1.7)';
  ph.style.filter='drop-shadow(0 0 45px #00D4FF) drop-shadow(0 0 90px #ffffff)';
  hideBubble();
  setTimeout(()=>{
    // 從手機位置爆出發光圈 + 白閃 → 進小屋
    const r=ph.getBoundingClientRect(), st=$('#stage').getBoundingClientRect();
    const burst=document.createElement('div'); burst.className='glow-burst';
    burst.style.left=(r.left+r.width/2-st.left)+'px';
    burst.style.top=(r.top+r.height/2-st.top)+'px';
    $('#stage').appendChild(burst);
    requestAnimationFrame(()=>burst.classList.add('go'));
    const fl=document.createElement('div'); fl.id='flash'; fl.className='go'; $('#stage').appendChild(fl);
    setTimeout(()=>{ stage=3; run(); }, 850);
    setTimeout(()=>{ burst.remove(); fl.remove(); }, 1500);
  }, 450);
}

// 精靈自介 → 發任務總覽 → 進步驟 1
function step1Intro(){
  say('這裡是「小智學園島」！只要完成 5 個新手任務、打倒初始魔王，你就能回到現實世界～', ()=>{
    say('準備好了嗎？我會全程陪著你！我們開始第一個任務吧！', ()=>{
      setHud(0); startTask(1);
    });
  });
}

// ═══════════════ 5 步任務 ═══════════════
function startTask(n){

  fairy.style.left='78%'; fairy.style.bottom='120px'; fairy.style.width='110px';
  ({1:task1,2:task2,3:task3,4:task4,5:task5})[n]();
}

// 開箱 + 圖鑑卡翻牌
function openGacha(ic,nm,buff,done){
  const ov=document.createElement('div'); ov.className='panel'; ov.style.zIndex=70; ov.style.top='50%';
  ov.innerHTML=`<div class="card-reward">
      <div class="chest"><img class="gi" style="height:84px" src="assets/images/onboarding/chest.png?v=1" alt=""></div>
      <div class="gacha"><div class="inner">
        <div class="face back"><img class="gi" style="height:90px" src="assets/images/onboarding/card_back.png?v=1" alt=""></div>
        <div class="face front"><div class="ic">${gi(ic,64)}</div><div class="nm">${nm}</div><div class="buff">${buff}</div></div>
      </div></div>
      <button class="btn" style="margin-top:6px;">收下！</button>
    </div>`;
  $('#stage').appendChild(ov);
  const chest=ov.querySelector('.chest'), gacha=ov.querySelector('.gacha');
  gacha.style.display='none';
  setTimeout(()=>{ chest.style.display='none'; gacha.style.display='block'; confetti(20);
    setTimeout(()=>gacha.classList.add('flip'),80); }, 1500);
  ov.querySelector('.btn').onclick=()=>{ ov.remove(); done&&done(); };
}

  $('#atk').onclick=function(){

function finale(){
  hideBubble(); fairyShow(false); showScene('end'); confetti(60);

function restart(){ stage=0; step=0; hud.classList.remove('on'); fairyShow(false); hideBubble();
  document.querySelectorAll('.glow-burst,#flash').forEach(e=>e.remove()); $('#phonePick').style=''; showScene('s0'); }

// 啟動
showScene('s0');
