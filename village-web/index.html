<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a3e1f">
<title>探索 Demo — Phaser 版</title>
<style>
  html, body {
    margin: 0; padding: 0;
    background: #1a2412;
    overflow: hidden;
    height: 100vh; /* fallback */
    height: 100dvh; /* iOS Safari 動態 viewport，扣掉 toolbar 高度 */
    width: 100vw;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    overscroll-behavior: none;
  }
  #game { width: 100vw; height: 100vh; height: 100dvh; }
  canvas { display: block; touch-action: none; }
  .hint {
    position: fixed; left: 12px; top: 12px;
    color: #fff; font-family: -apple-system, "PingFang TC", sans-serif; font-size: 14px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.85);
    z-index: 10; pointer-events: none;
    padding: 6px 10px; border-radius: 6px;
    background: rgba(0,0,0,0.25);
  }
  /* 手機 touch device 不顯示 WASD hint（沒鍵盤）*/
  @media (pointer: coarse) {
    .hint { display: none; }
  }
  /* 左下虛擬搖桿（DOM，免疫相機 zoom；取代點地圖移動）*/
  #joystick {
    position: fixed; left: 20px; bottom: 24px;
    width: 116px; height: 116px; border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 3px solid rgba(255,255,255,0.45);
    box-shadow: 0 2px 12px rgba(0,0,0,0.28);
    z-index: 400; touch-action: none;
  }
  #joy-thumb {
    position: absolute; left: 50%; top: 50%;
    width: 52px; height: 52px; margin: -26px 0 0 -26px;
    border-radius: 50%;
    background: rgba(255,255,255,0.62);
    border: 2px solid rgba(110,80,45,0.55);
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    will-change: transform;
  }
</style>
<link rel="stylesheet" href="shop.css?v=42">
</head>
<body>
<div class="hint">左下搖桿 或 WASD 移動 / 滾輪縮放 / 雙指 pinch 縮放</div>
<div id="game"></div>
<button id="equip-btn" onclick="window.openEquip&&window.openEquip()">🎒 裝備</button>
<button id="enter-shop">🛒 進入</button>
<button id="enter-portal">前往 →</button>
<div id="joystick"><div id="joy-thumb"></div></div>
<div id="map-fade"></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/phaser3-rex-plugins@1.1.84/dist/rexvirtualjoystickplugin.min.js"></script>
<script src="shop.js?v=96"></script>
<script src="farm.js?v=13"></script>
<!-- 多人整合（feature flag）：?mp=1 才載 colyseus + mp.js，否則完全是原本單機 demo -->
<script>if(new URLSearchParams(location.search).get("mp")==="1"){document.write('<script src="colyseus.bundle.js"><\/script><script src="mp.js?v=28"><\/script>');}</script>
<script src="explore.js?v=117"></script>
</body>
</html>
