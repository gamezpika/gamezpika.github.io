<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="/no-zoom.js?v=2"></script>
<title>找不到頁面 — 小智學園</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; }
  body { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 22px;
    background: url("village-web/village_ground.webp") center/cover no-repeat; }
  .tint { position: fixed; inset: 0; background: radial-gradient(120% 90% at 50% 30%, rgba(40,28,12,.25), rgba(30,20,8,.7)); }
  .panel { position: relative; text-align: center; width: 100%; max-width: 340px; border-radius: 22px; padding: 30px 24px 26px;
    background: linear-gradient(170deg, #fff7e4, #fbe9c4); border: 4px solid #8a5a2b;
    box-shadow: 0 18px 50px rgba(0,0,0,.5), inset 0 2px 4px rgba(255,255,255,.6); }
  .mk { font-size: 52px; line-height: 1; }
  h1 { font-size: 26px; color: #7a4715; margin: 10px 0 6px; letter-spacing: 1px; }
  p { font-size: 14.5px; color: #a9803f; font-weight: 600; line-height: 1.7; margin-bottom: 20px; }
  a { display: block; border: 3px solid #6b3f12; border-radius: 14px; padding: 12px; text-decoration: none;
    font-size: 17px; font-weight: 900; color: #fff7e6; letter-spacing: 3px; text-shadow: 0 1px 2px rgba(0,0,0,.4);
    background: linear-gradient(180deg, #f0a83e, #d4781f); box-shadow: 0 4px 0 #9a5414, 0 7px 14px rgba(0,0,0,.3); }
  a:active { transform: translateY(3px); box-shadow: 0 1px 0 #9a5414; }
</style>
</head>
<body>
<div class="tint"></div>
<div class="panel">
  <div class="mk">🧭</div>
  <h1>找不到這個頁面</h1>
  <p>看來你走到了地圖外面～<br>回到入口重新開始吧！</p>
  <a href="/">← 回小智學園</a>
</div>
</body>
</html>
