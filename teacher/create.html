<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新增班級 PK</title>
<script src="../config.js"></script>
<script src="common.js"></script>
<link rel="stylesheet" href="common.css">
<style>
  .topic-list {
    max-height: 320px; overflow-y: auto;
    padding:8px; border:1px solid rgba(140,170,220,.15); border-radius:10px;
    background:rgba(10,15,32,.4);
  }
  .topic-row {
    display:flex; align-items:center; gap:10px; padding:8px 10px;
    border-radius:6px; cursor:pointer; font-size:13px;
  }
  .topic-row:hover { background:rgba(110,143,208,.12); }
  .topic-row input { width:auto; margin:0; }
  .topic-meta { color:#7f8fb0; font-size:11px; margin-left:6px; }
  .toolbar { display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  .toolbar select { padding:6px 10px; font-size:12px; }
  .footer-actions { display:flex; gap:12px; justify-content:flex-end; margin-top:20px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="logo">🎓</span> 班級 PK 後台</div>
  <div class="me">
    <a href="dashboard.html" class="btn ghost small">← 返回</a>
  </div>
</div>

<div class="container">
  <div class="page-title">新增班級 PK</div>
  <div class="page-sub">選章節、設題數、給 code → 建賽後分享給學生加入</div>

  <div class="card">
    <div class="grid cols-2">
      <div class="field">
        <label>年級</label>
        <select id="f-grade">
          <option value="1">一年級</option>
          <option value="2">二年級</option>
          <option value="3" selected>三年級</option>
          <option value="4">四年級</option>
          <option value="5">五年級</option>
          <option value="6">六年級</option>
        </select>
      </div>
      <div class="field">
        <label>科目</label>
        <select id="f-subject">
          <option value="math">數學</option>
          <option value="chinese">國語</option>
          <option value="english">英語</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label>每場題數（老師發起 PK 時選）</label>
      <div class="pill-group" id="qpm-group">
        <div class="pill" data-v="5">5 題（快閃）</div>
        <div class="pill selected" data-v="10">10 題（標準）</div>
        <div class="pill" data-v="15">15 題（完整）</div>
      </div>
    </div>

    <div class="grid cols-2">
      <div class="field">
        <label>參與上限</label>
        <input type="number" id="f-max" value="20" min="2" max="50">
        <div class="hint">最少 2 人、最多 50 人</div>
      </div>
      <div class="field">
        <label>加入 code（可自訂）</label>
        <input type="text" id="f-code" placeholder="留空系統自動生 6 碼" maxlength="12">
        <div class="hint">只保留 A–Z 0–9，如 CLASS01</div>
      </div>
    </div>

    <div class="field">
      <label>
        <input type="checkbox" id="f-lb" style="width:auto;margin-right:6px;">
        計入排行榜（未勾＝純練習不影響戰績）
      </label>
    </div>
  </div>

  <div class="card">
    <h3>📚 本節章節（主要題目 90%）</h3>
    <div class="toolbar">
      <select id="filter-pub"><option value="">全部版本</option></select>
      <select id="filter-vol"><option value="">全部冊別</option></select>
    </div>
    <div class="topic-list" id="topics-main"></div>
    <div class="hint" id="hint-main">已選 0 個</div>
  </div>

  <div class="card">
    <h3>🔮 下一節章節（預習題 10%，可省略）</h3>
    <div class="topic-list" id="topics-next"></div>
    <div class="hint" id="hint-next">已選 0 個</div>
  </div>

  <div class="footer-actions">
    <a href="dashboard.html" class="btn ghost">取消</a>
    <button class="btn primary" id="btn-create" onclick="createPk()">建立班級 PK</button>
  </div>
</div>

<script>
  if (!T.requireLogin()) throw 0;

  var TOPICS = [];
  var Qpm = 10;

  document.querySelectorAll("#qpm-group .pill").forEach(function(p){
    p.addEventListener("click", function(){
      document.querySelectorAll("#qpm-group .pill").forEach(function(x){ x.classList.remove("selected"); });
      p.classList.add("selected");
      Qpm = parseInt(p.dataset.v, 10);
    });
  });

  ["f-grade","f-subject"].forEach(function(id){
    document.getElementById(id).addEventListener("change", loadTopics);
  });
  document.getElementById("filter-pub").addEventListener("change", renderTopics);
  document.getElementById("filter-vol").addEventListener("change", renderTopics);

  loadTopics();

  async function loadTopics(){
    var grade = parseInt(document.getElementById("f-grade").value, 10);
    try {
      var d = await T.api("/api/teacher/topics?grade=" + grade);
      TOPICS = d.topics || [];
      populateFilters();
      renderTopics();
    } catch(e) {
      T.toast("讀章節失敗：" + e.message);
    }
  }

  function populateFilters(){
    var pubs = {}, vols = {};
    TOPICS.forEach(function(t){ if (t.publisher) pubs[t.publisher] = t.publisher_name || t.publisher; if (t.volume) vols[t.volume] = t.volume; });
    var ep = document.getElementById("filter-pub"); ep.innerHTML = '<option value="">全部版本</option>';
    Object.keys(pubs).forEach(function(k){ ep.innerHTML += '<option value="' + esc(k) + '">' + esc(pubs[k]) + '</option>'; });
    var ev = document.getElementById("filter-vol"); ev.innerHTML = '<option value="">全部冊別</option>';
    Object.keys(vols).forEach(function(k){ ev.innerHTML += '<option value="' + esc(k) + '">' + esc(k) + '</option>'; });
  }

  function renderTopics(){
    var pub = document.getElementById("filter-pub").value;
    var vol = document.getElementById("filter-vol").value;
    var filtered = TOPICS.filter(function(t){
      return (!pub || t.publisher === pub) && (!vol || t.volume === vol);
    });
    renderList("topics-main", "main", filtered);
    renderList("topics-next", "next", filtered);
    updateHints();
  }

  function renderList(elId, group, list){
    var el = document.getElementById(elId);
    if (!list.length){ el.innerHTML = '<div class="empty" style="padding:20px;font-size:13px;">沒有符合的章節</div>'; return; }
    el.innerHTML = list.map(function(t){
      return '<label class="topic-row">'
        + '<input type="checkbox" data-group="' + group + '" data-id="' + t.id + '" onchange="updateHints()">'
        + '<span>' + esc(t.name) + '</span>'
        + '<span class="topic-meta">' + esc(t.publisher_name || t.publisher) + ' · ' + esc(t.volume || "-") + '</span>'
      + '</label>';
    }).join("");
  }

  function collectSelected(group){
    var out = [];
    document.querySelectorAll('input[data-group="' + group + '"]:checked').forEach(function(el){
      out.push(parseInt(el.dataset.id, 10));
    });
    return out;
  }

  function updateHints(){
    document.getElementById("hint-main").textContent = "已選 " + collectSelected("main").length + " 個";
    document.getElementById("hint-next").textContent = "已選 " + collectSelected("next").length + " 個";
  }

  async function createPk(){
    var mainIds = collectSelected("main");
    if (!mainIds.length){ T.toast("請至少選 1 個本節章節"); return; }
    var payload = {
      grade: parseInt(document.getElementById("f-grade").value, 10),
      subject_key: document.getElementById("f-subject").value,
      topic_ids: mainIds,
      next_topic_ids: collectSelected("next"),
      max_players: parseInt(document.getElementById("f-max").value, 10) || 20,
      questions_per_match: Qpm,
      count_toward_leaderboard: document.getElementById("f-lb").checked,
      code: (document.getElementById("f-code").value || "").trim() || null
    };
    var btn = document.getElementById("btn-create");
    btn.disabled = true;
    try {
      var d = await T.api("/api/teacher/classroom/create", {
        method: "POST", body: JSON.stringify(payload)
      });
      T.toast("建立成功！code = " + d.code);
      setTimeout(function(){ location.href = "live.html?id=" + d.id; }, 800);
    } catch (e) {
      T.toast("建立失敗：" + e.message);
      btn.disabled = false;
    }
  }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  window.updateHints = updateHints;
</script>

</body>
</html>
