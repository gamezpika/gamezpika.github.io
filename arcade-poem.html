<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script src="/no-zoom.js?v=1"></script>
<title>詩詞接龍：唐詩三百首</title>
<link rel="stylesheet" href="arcade/base.css?v=2">
<link rel="stylesheet" href="arcade/poem.css?v=23">
<link rel="stylesheet" href="arcade/game-ui.css?v=2">
</head>
<body>

<div id="screen-poem-game" class="screen active">
    <header class="screen-header">
        <button class="btn-back" id="poem-game-back">←</button>
        <span class="screen-title">📜 詩詞接龍：唐詩三百首</span>
    </header>
    <div class="poem-stage" id="poem-stage">
        <div class="poem-world" id="poem-world">
            <div class="poem-far" id="poem-far"><div class="poem-far-l a"></div><div class="poem-far-l b"></div></div>
            <div class="poem-walls" id="poem-walls">
                <div class="poem-wall" id="poem-wall-l"><div class="poem-wall-tex" id="poem-wall-tex-l"></div></div>
                <div class="poem-wall" id="poem-wall-r"><div class="poem-wall-tex" id="poem-wall-tex-r"></div></div>
            </div>
            <div class="poem-floor" id="poem-floor"><div class="poem-floor-plane"><div class="poem-floor-tex" id="poem-floor-tex"></div></div></div>
            <div class="poem-fog" id="poem-fog"></div>
            <div id="poem-runner"><img src="arcade/img/poem/runner.webp?v=1" alt="" draggable="false"></div>
        </div>
        <div class="poem-top">
            <span class="poem-pill" id="poem-score">答對 0 題</span>
            <span class="poem-pill" id="poem-best">最高 0 題</span>
        </div>
        <div class="poem-scroll" id="poem-scroll">
            <div class="poem-q" id="poem-question"></div>
            <div class="poem-hint">跑進「下一句」正確的那座門！</div>
        </div>
        <div class="poem-hearts" id="poem-hearts">❤️❤️❤️</div>
        <div class="poem-countdown" id="poem-countdown" style="display:none"></div>
    </div>
</div>

<!-- 封面「開始遊戲」觸發（不顯示） -->
<button id="poem-entry-btn" style="display:none"></button>

<script src="arcade/shim.js?v=1"></script>
<script src="arcade/game-ui.js?v=3"></script>
<script src="arcade/game_poem.js?v=31"></script>
<script>
// 封面＋玩法說明卡（鐵律：淨新玩法必備說明卡），按「開始遊戲」才開局
(function boot() {
    function showIntro() {
        window.arcadeUI.intro({
            icon: "arcade/img/poem/gate.webp?v=1",
            title: "詩詞接龍：唐詩三百首",
            sub: "接出下一句，挑戰最高紀錄",
            steps: [
                { ico: "arcade/img/poem/gate.webp?v=1", text: "上方出現詩的上半句，兩座牌樓門帶著「下一句」慢慢靠近" },
                { ico: "arcade/img/poem/runner.webp?v=1", text: "任意拖曳進行左右移動，跑進你覺得正確的那座門" },
                { ico: "arcade/img/icons/fire.png?s=6", text: "答對 +1 題、越跑越快；答錯 −1 顆心，3 顆心用完結算！" },
            ],
            onStart: function () { document.getElementById("poem-entry-btn").click(); },
        });
    }
    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", showIntro);
    } else {
        showIntro();
    }
})();
</script>
<script src="village-web/play_limit.js?v=5"></script>
</body>
</html>
