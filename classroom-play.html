<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>班級 PK · 對戰（重新導向中…）</title>
<script>
  // 舊入口保留當 redirect wrapper：直接把 classroom-play.html?sid=xxx 轉到 pvp-demo2.html?session=xxx
  // 讓「原本 OK 的完整 PVP 遊戲畫面」（含倒數/arena/動畫/結算）統一由 pvp-demo2 提供。
  (function () {
    var qp = new URLSearchParams(location.search);
    var sid = qp.get("sid") || qp.get("session") || "";
    if (sid) {
      location.replace(
        "pvp-demo2.html?session=" + encodeURIComponent(sid) + "&back_url=classroom.html"
      );
    } else {
      location.replace("classroom.html");
    }
  })();
</script>
</head>
<body style="background:#12182b;color:#c7d5f0;font-family:-apple-system,sans-serif;text-align:center;padding:80px 20px;">
  重新導向中…
</body>
</html>
