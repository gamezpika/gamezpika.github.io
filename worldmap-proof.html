<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>分層動畫地圖 · proof</title>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; background:#0b1a2b; overflow:hidden;
    font-family:"Noto Sans TC",system-ui,sans-serif; color:#cfe0ff; }
  #wrap{ width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; }
  .cap{ font-size:13px; color:#9fb3d1; text-align:center; padding:0 16px; }
  #fit{ position:relative; }
  /* 固定內部座標 720x480，整塊縮放適配 */
  #stage{ position:relative; width:720px; height:480px; transform-origin:top left;
    background:url('assets/images/worldmap_proof/base_island.jpg?v=1') center/cover no-repeat;
    border-radius:14px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.55); }

  .sprite{ position:absolute; background-repeat:no-repeat; image-rendering:auto;
    transform-origin:bottom center; will-change:background-position; }

  /* 樹（158x150，24 幀，搖幅調小） */
  .tree{ width:158px; height:150px;
    background-image:url('assets/images/worldmap_proof/tree_sway_sheet.png?v=2');
    background-size:auto 150px;
    animation:treePlay 3.4s steps(24) infinite; }
  @keyframes treePlay{ to{ background-position-x:-3792px; } }

  /* 船（201x200，24 幀） */
  .ferry{ width:201px; height:200px;
    background-image:url('assets/images/worldmap_proof/ferry_bob_sheet.png?v=1');
    background-size:auto 200px;
    animation:ferryPlay 2.4s steps(24) infinite; }
  @keyframes ferryPlay{ to{ background-position-x:-4824px; } }

  /* 水面光：斜向掃光 + 海岸泡沫脈動 */
  .shimmer{ position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen; opacity:.22;
    background:linear-gradient(115deg, transparent 36%, rgba(190,240,255,.2) 48%, rgba(255,255,255,.28) 50%, rgba(190,240,255,.2) 52%, transparent 64%);
    background-size:260% 260%; animation:sweep 8s linear infinite; }
  @keyframes sweep{ 0%{ background-position:120% 0; } 100%{ background-position:-60% 0; } }
  .foam{ position:absolute; left:50%; top:54%; width:430px; height:300px; transform:translate(-50%,-50%);
    border-radius:50%; pointer-events:none;
    box-shadow:0 0 0 2px rgba(255,255,255,.1), 0 0 18px 6px rgba(255,255,255,.08) inset;
    animation:foam 4.6s ease-in-out infinite; }
  @keyframes foam{ 0%,100%{ transform:translate(-50%,-50%) scale(1); opacity:.28; } 50%{ transform:translate(-50%,-50%) scale(1.03); opacity:.45; } }
  /* 海面點點波光（弱） */
  .glint{ position:absolute; width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.6);
    pointer-events:none; animation:glint 3.2s ease-in-out infinite; filter:blur(.5px); }
  @keyframes glint{ 0%,100%{ opacity:0; transform:scale(.4); } 50%{ opacity:.5; transform:scale(.9); } }

  /* 方向鍵 */
  #dpad{ display:grid; grid-template-columns:repeat(3,52px); grid-template-rows:repeat(3,52px);
    gap:6px; justify-content:center; }
  .db{ border:none; border-radius:12px; background:rgba(255,255,255,.12); color:#cfe0ff; font-size:20px;
    cursor:pointer; -webkit-user-select:none; user-select:none; touch-action:none;
    box-shadow:0 2px 8px rgba(0,0,0,.3); transition:background .1s, transform .06s; }
  .db:active{ background:var(--blue,#00D4FF); color:#062033; transform:scale(.92); }
  .db.up{ grid-area:1/2; } .db.left{ grid-area:2/1; } .db.down{ grid-area:3/2; } .db.right{ grid-area:2/3; }
</style>
</head>
<body>
<div id="wrap">
  <div class="cap">🏝 分層動畫 proof — 用下方方向鍵（或鍵盤方向鍵/WASD）開船上下左右移動 ⛵</div>
  <div id="fit">
    <div id="stage">
      <div class="shimmer"></div>
      <div class="foam"></div>
      <!-- 海面波光 -->
      <div class="glint" style="left:18%; top:74%; animation-delay:.2s"></div>
      <div class="glint" style="left:80%; top:66%; animation-delay:1.1s"></div>
      <div class="glint" style="left:64%; top:86%; animation-delay:1.8s"></div>
      <div class="glint" style="left:30%; top:88%; animation-delay:.7s"></div>
      <!-- 樹（bottom 錨定：top = 目標y - 150） -->
      <div class="sprite tree" style="left:60px;  top:62px;  transform:scale(.82)"></div>
      <div class="sprite tree" style="left:476px; top:54px;  transform:scale(.9); animation-delay:-1.0s"></div>
      <div class="sprite tree" style="left:250px; top:150px; transform:scale(.62); animation-delay:-.5s"></div>
      <!-- 船：可由玩家控制移動 -->
      <div class="sprite ferry" id="ferry"></div>
    </div>
  </div>
  <!-- 方向鍵 -->
  <div id="dpad">
    <button class="db up"    data-d="up">▲</button>
    <button class="db left"  data-d="left">◀</button>
    <button class="db down"  data-d="down">▼</button>
    <button class="db right" data-d="right">▶</button>
  </div>
</div>
<script>
  // 整塊舞台等比縮放，置中適配
  const stage=document.getElementById('stage'), fit=document.getElementById('fit'), wrap=document.getElementById('wrap');
  const BW=720, BH=480;
  function resize(){
    const availW=Math.min(window.innerWidth-16, 760);
    const availH=window.innerHeight-70;
    const s=Math.min(availW/BW, availH/BH);
    stage.style.transform='scale('+s+')';
    fit.style.width=(BW*s)+'px'; fit.style.height=(BH*s)+'px';
  }
  window.addEventListener('resize',resize); resize();

  // ── 船控制：上下左右移動 ──
  const ferry=document.getElementById('ferry');
  const SC=0.92, FW=201, FH=200, SPEED=3.4;
  let fx=300, fy=258, facing=1;
  const MINX=-30, MAXX=BW-160, MINY=10, MAXY=BH-200;   // 720x480 內活動範圍
  const held={up:false,down:false,left:false,right:false};
  function apply(){ ferry.style.left=fx+'px'; ferry.style.top=fy+'px';
    ferry.style.transform='scale('+(facing*SC)+','+SC+')'; }
  apply();
  function tick(){
    let dx=(held.right?1:0)-(held.left?1:0), dy=(held.down?1:0)-(held.up?1:0);
    if(dx||dy){
      if(dx&&dy){ dx*=0.7071; dy*=0.7071; }     // 斜向不加速
      fx=Math.max(MINX,Math.min(MAXX, fx+dx*SPEED));
      fy=Math.max(MINY,Math.min(MAXY, fy+dy*SPEED));
      if(dx<0) facing=-1; else if(dx>0) facing=1;
      apply();
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // 鍵盤
  const KEY={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
  addEventListener('keydown',e=>{ const k=KEY[e.key]; if(k){ held[k]=true; e.preventDefault(); } });
  addEventListener('keyup',  e=>{ const k=KEY[e.key]; if(k){ held[k]=false; e.preventDefault(); } });
  // 螢幕方向鍵（按住持續）
  document.querySelectorAll('.db').forEach(btn=>{
    const d=btn.dataset.d;
    const on =e=>{ e.preventDefault(); held[d]=true; };
    const off=e=>{ e.preventDefault(); held[d]=false; };
    btn.addEventListener('pointerdown',on);
    btn.addEventListener('pointerup',off);
    btn.addEventListener('pointerleave',off);
    btn.addEventListener('pointercancel',off);
  });
</script>
</body>
</html>
