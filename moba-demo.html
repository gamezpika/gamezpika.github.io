<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>3V3 三路答題對戰（原型）</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #0e1630; font-family: "PingFang TC", "Noto Sans TC", sans-serif; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #game { flex: 1 1 auto; position: relative; min-height: 0; }
  #game canvas { display: block; }

  #quiz { flex: 0 0 auto; background: rgba(12,20,48,0.96); border-top: 2px solid #2a3a6a;
    padding: 10px 12px calc(12px + env(safe-area-inset-bottom, 0px)); color: #fff; }
  #q-role { text-align: center; font-size: 12px; color: #7fc4ff; font-weight: 700; margin-bottom: 4px; }
  #q-text { font-size: 15px; font-weight: 600; text-align: center; min-height: 22px; margin-bottom: 8px; line-height: 1.35; }
  #q-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .q-btn { background: #fff; color: #1a2240; border: none; border-radius: 10px; padding: 12px 8px;
    font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .q-btn:active { transform: scale(0.97); }
  .q-btn.correct { background: #27ae60; color: #fff; }
  .q-btn.wrong { background: #e74c3c; color: #fff; }
  #q-hint { text-align: center; font-size: 13px; color: #ffd24a; min-height: 18px; margin-top: 6px; font-weight: 700; }

  .ov { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; background: rgba(8,12,30,0.92); z-index: 40; color: #fff; text-align: center; padding: 26px; }
  .ov h1 { margin: 0; font-size: 23px; font-weight: 900; }
  .ov .card { background: rgba(255,255,255,0.06); border: 1px solid #2a3a6a; border-radius: 14px; padding: 18px;
    text-align: left; font-size: 14.5px; line-height: 1.7; max-width: 340px; }
  .ov .card b { color: #ffd24a; }
  .ov button { margin-top: 6px; border: none; border-radius: 14px; padding: 13px 36px; font-size: 17px; font-weight: 900;
    background: linear-gradient(135deg, #ff9a40, #ff5e3a); color: #fff; cursor: pointer; }
  .ov button:active { transform: scale(0.97); }
  #result { display: none; }
  #result.on { display: flex; }
</style>
</head>
<body>
<div id="wrap">
  <div id="game">
    <div id="intro" class="ov">
      <h1>⚔️ 3V3 三路答題對戰</h1>
      <div class="card">
        🔵 <b>藍隊</b>(你+2隊友) vs 🔴 <b>紅隊</b>，一隊 3 人、<b>每人守一路</b>(沒有小兵，人就是戰力)。<br>
        • <b>你守中路</b>。答對 → 你那路英雄往前推、把紅方逼退；答錯 → 被逼退。<br>
        • 上路、下路是你的 AI 隊友；紅隊 3 路也是 AI(電腦答題)。<br>
        • 哪隊先把<b>任一路</b>的對面逼到底、推爆<b>對面基地</b> = 贏！<br>
        <br>📚 <b>讀書 = 戰力</b>：你答得又快又準，中路就壓著打。<br>
        <span style="color:#9fb3d8;font-size:12.5px">(單機驗玩法版：其餘 5 人先用電腦，未來才做真人 6 人連線)</span>
      </div>
      <button id="startBtn">開始對戰</button>
    </div>
    <div id="result" class="ov">
      <h1 id="result-title"></h1>
      <div id="result-sub" style="font-size:15px;color:#d8c8f0"></div>
      <button id="againBtn">再玩一次</button>
    </div>
  </div>
  <div id="quiz">
    <div id="q-role">⤢ 你守中路</div>
    <div id="q-text">準備開始…</div>
    <div id="q-choices"></div>
    <div id="q-hint"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script>
(function () {
  const QUESTIONS = [
    { q: "8 × 7 = ?", choices: ["54", "56", "63", "49"], a: 1 },
    { q: "「蘋果」的英文是？", choices: ["apple", "banana", "orange", "grape"], a: 0 },
    { q: "15 + 27 = ?", choices: ["42", "32", "41", "52"], a: 0 },
    { q: "一年有幾個月？", choices: ["10", "11", "12", "13"], a: 2 },
    { q: "「天空」的英文是？", choices: ["sea", "sky", "star", "snow"], a: 1 },
    { q: "72 ÷ 8 = ?", choices: ["8", "7", "9", "6"], a: 2 },
    { q: "水的化學式是？", choices: ["CO2", "O2", "H2O", "NaCl"], a: 2 },
    { q: "「謝謝」的英文是？", choices: ["sorry", "hello", "please", "thanks"], a: 3 },
  ];
  const PLAYER_LANE = 1;   // 玩家守中路
  let game;

  class Battle extends Phaser.Scene {
    constructor() { super("Battle"); }

    preload() {
      const B = "assets/moba/";
      if (!this.textures.exists("moba_map")) this.load.image("moba_map", B + "map_iso.webp?v=1");
      ["minion_blue", "minion_red", "tower_blue", "tower_red"].forEach(k => {
        if (!this.textures.exists(k)) this.load.image(k, B + k + ".webp?v=1");
      });
    }

    create() {
      const W = this.scale.width, H = this.scale.height;
      this.W = W; this.H = H;
      this.running = false; this.over = false;
      const S = Math.min(W, H); this.S = S; this.ox = (W - S) / 2; this.oy = (H - S) / 2;
      const P = (rx, ry) => ({ x: this.ox + rx * S, y: this.oy + ry * S }); this.P = P;

      const BL = P(0.17, 0.69), TR = P(0.82, 0.19), C = P(0.50, 0.44), TOP = P(0.33, 0.30), BOT = P(0.64, 0.70);
      this.lanePaths = [[BL, TOP, TR], [BL, C, TR], [BL, BOT, TR]];   // 上 中 下（藍→紅，對齊斜角底圖）
      // 每路一個拔河進度 prog：0=紅推爆藍基地(紅贏該路)，1=藍推爆紅基地(藍贏該路)，0.5 中點
      this.lanes = [0.5, 0.5, 0.5].map(p => ({ prog: p }));

      this._drawMap();

      // 塔（放路徑上 0.3藍/0.7紅 + 陰影 + y-sort 遠近遮擋）
      for (let l = 0; l < 3; l++) {
        [["blue", 0.3], ["red", 0.7]].forEach(([side, t]) => {
          const p = this._posOnLane(l, t), tk = side === "blue" ? "tower_blue" : "tower_red";
          this.add.ellipse(p.x, p.y + 16, 26, 10, 0x000000, 0.25).setDepth(p.y - 1);
          const o = this.textures.exists(tk) ? this.add.image(p.x, p.y, tk).setDisplaySize(32, 38)
            : this.add.rectangle(p.x, p.y, 18, 24, side === "blue" ? 0x3f7fd0 : 0xd05f5f);
          o.setDepth(p.y);
        });
      }

      // 6 英雄（每路 藍 vs 紅），中路藍英雄是玩家(加光圈)
      this.heroes = [];
      for (let l = 0; l < 3; l++) {
        const blue = this._mkHero("blue", l), red = this._mkHero("red", l);
        this.heroes.push({ lane: l, blue, red });
        if (l === PLAYER_LANE) {
          this.playerRing = this.add.circle(0, 0, 22, 0xffd24a, 0).setStrokeStyle(3, 0xffd24a, 0.9).setDepth(6);
        }
      }

      // 頂部血條/目標
      const ts = { fontFamily: "sans-serif", fontSize: "12px", fontStyle: "bold", stroke: "#000", strokeThickness: 3 };
      this.goalText = this.add.text(W / 2, 5, "🎯 任一路推爆對面基地就贏", { ...ts, fontSize: "12.5px", color: "#ffd24a" }).setOrigin(0.5, 0).setDepth(99999);
      this.laneTxt = this.add.text(W / 2, 24, "", { ...ts, color: "#fff" }).setOrigin(0.5, 0).setDepth(99999);
      this._updatePositions();

      this._bindDOM();

      // AI：紅隊 3 路（推 prog 往 0），每 2.4s 結算正確率
      this.time.addEvent({ delay: 2400, loop: true, callback: () => {
        if (!this.running || this.over) return;
        for (let l = 0; l < 3; l++) this._aiStep(l, "red", 0.55);
      }});
      // AI：藍隊友 上/下路（推 prog 往 1），每 2.6s
      this.time.addEvent({ delay: 2600, loop: true, callback: () => {
        if (!this.running || this.over) return;
        [0, 2].forEach(l => this._aiStep(l, "blue", 0.60));
      }});
    }

    _drawMap() {
      const S = this.S, ox = this.ox, oy = this.oy;
      this.add.graphics().setDepth(-2).fillStyle(0x0e1630, 1).fillRect(0, 0, this.W, this.H);
      if (this.textures.exists("moba_map")) this.add.image(ox + S / 2, oy + S / 2, "moba_map").setDisplaySize(S, S).setDepth(-1);
      else this.add.graphics().setDepth(-1).fillStyle(0x3a4a2c, 1).fillRoundedRect(ox + S * 0.04, oy + S * 0.04, S * 0.92, S * 0.92, 18);
      const g = this.add.graphics().setDepth(1);
      this.lanePaths.forEach(path => {
        g.lineStyle(15, 0x6b5a3a, 0.38);
        g.beginPath(); g.moveTo(path[0].x, path[0].y);
        for (let i = 1; i < path.length; i++) g.lineTo(path[i].x, path[i].y);
        g.strokePath();
      });
    }

    _mkHero(side, lane) {
      const k = side === "blue" ? "minion_blue" : "minion_red";
      const shadow = this.add.ellipse(0, 0, 24, 10, 0x000000, 0.28);
      const o = this.textures.exists(k) ? this.add.image(0, 0, k).setDisplaySize(34, 34)
        : this.add.circle(0, 0, 11, side === "blue" ? 0x6fc0ff : 0xff8a8a);
      o._shadow = shadow;
      return o;
    }

    // 沿 lane 的 3 點路徑取 t(0-1) 的座標
    _posOnLane(lane, t) {
      t = Math.max(0, Math.min(1, t));
      const p = this.lanePaths[lane];
      if (t <= 0.5) { const u = t * 2; return { x: p[0].x + (p[1].x - p[0].x) * u, y: p[0].y + (p[1].y - p[0].y) * u }; }
      const u = (t - 0.5) * 2; return { x: p[1].x + (p[2].x - p[1].x) * u, y: p[1].y + (p[2].y - p[1].y) * u };
    }

    _aiStep(lane, side, p) {
      const win = Math.random() < p;
      const d = 0.06;
      // 藍方答對 prog+，紅方答對 prog-（答錯就被對面小推）
      if (side === "blue") this.lanes[lane].prog += win ? d : -d * 0.5;
      else this.lanes[lane].prog += win ? -d : d * 0.5;
    }

    _updatePositions() {
      for (const h of this.heroes) {
        const prog = this.lanes[h.lane].prog;
        const bp = this._posOnLane(h.lane, Math.max(0.04, prog - 0.05));
        const rp = this._posOnLane(h.lane, Math.min(0.96, prog + 0.05));
        h.blue.x = bp.x; h.blue.y = bp.y; h.blue.setDepth(bp.y);
        h.red.x = rp.x; h.red.y = rp.y; h.red.setDepth(rp.y);
        if (h.blue._shadow) { h.blue._shadow.x = bp.x; h.blue._shadow.y = bp.y + 13; h.blue._shadow.setDepth(bp.y - 1); }
        if (h.red._shadow) { h.red._shadow.x = rp.x; h.red._shadow.y = rp.y + 13; h.red._shadow.setDepth(rp.y - 1); }
        if (h.lane === PLAYER_LANE && this.playerRing) { this.playerRing.x = bp.x; this.playerRing.y = bp.y; this.playerRing.setDepth(bp.y + 1); }
      }
      // 中路(你的)進度文字
      const mp = Math.round(this.lanes[PLAYER_LANE].prog * 100);
      if (this.laneTxt) this.laneTxt.setText("你的中路：" + mp + "%（推到 100% 破紅基地）");
    }

    update() {
      if (!this.running || this.over) return;
      // clamp + 勝負
      let blueWin = false, redWin = false, winLane = 1;
      for (let l = 0; l < 3; l++) {
        if (this.lanes[l].prog >= 1) { this.lanes[l].prog = 1; blueWin = true; winLane = l; }
        if (this.lanes[l].prog <= 0) { this.lanes[l].prog = 0; redWin = true; winLane = l; }
      }
      this._updatePositions();
      if (blueWin) this._triggerWin(true, winLane);
      else if (redWin) this._triggerWin(false, winLane);
    }

    _bindDOM() {
      this.qText = document.getElementById("q-text");
      this.qChoices = document.getElementById("q-choices");
      this.qHint = document.getElementById("q-hint");
      this.qIdx = 0; this.locked = false;
    }

    startGame() { this.running = true; this._nextQuestion(); }

    _nextQuestion() {
      if (this.over) return;
      this.locked = false;
      const item = QUESTIONS[this.qIdx % QUESTIONS.length]; this.qIdx++;
      this.qText.textContent = item.q; this.qHint.textContent = ""; this.qChoices.innerHTML = "";
      item.choices.forEach((c, i) => {
        const btn = document.createElement("button");
        btn.className = "q-btn"; btn.textContent = c;
        btn.addEventListener("click", () => this._answer(i, item, btn));
        this.qChoices.appendChild(btn);
      });
    }

    _answer(i, item, btn) {
      if (this.locked || this.over) return;
      this.locked = true;
      const correct = i === item.a;
      btn.classList.add(correct ? "correct" : "wrong");
      if (correct) {
        this.lanes[PLAYER_LANE].prog += 0.10;   // 你答對 → 中路往紅推
        this.qHint.textContent = "✓ 答對！中路推進 →";
      } else {
        this.lanes[PLAYER_LANE].prog -= 0.06;   // 答錯 → 被紅方逼退
        const right = this.qChoices.children[item.a]; if (right) right.classList.add("correct");
        this.qHint.textContent = "✗ 答錯！中路被逼退 ←";
      }
      this.time.delayedCall(correct ? 450 : 900, () => this._nextQuestion());
    }

    // 打贏施招動畫：贏方英雄放大發光 → 能量波飛向對面基地 → 爆炸+震動 → 結算
    _triggerWin(win, lane) {
      if (this.over) return;
      this.over = true; this.running = false;
      const hero = win ? this.heroes[lane].blue : this.heroes[lane].red;
      const path = this.lanePaths[lane];
      const targetBase = win ? path[path.length - 1] : path[0];   // 贏方推爆的對面基地端點（紅=TR、藍=BL）
      const col = win ? 0x4a9fff : 0xff5e5e;
      if (hero) {
        this.tweens.add({ targets: hero, scaleX: hero.scaleX * 1.6, scaleY: hero.scaleY * 1.6, duration: 240, yoyo: true, repeat: 1 });
        const glow = this.add.circle(hero.x, hero.y, 26, 0xffd24a, 0.55).setDepth(99997);
        this.tweens.add({ targets: glow, scale: 2.2, alpha: 0, duration: 520, onComplete: () => glow.destroy() });
      }
      const sx = hero ? hero.x : targetBase.x, sy = hero ? hero.y : targetBase.y;
      const bolt = this.add.circle(sx, sy, 13, 0xffd24a, 0.95).setStrokeStyle(3, 0xffffff, 0.8).setDepth(99997);
      this.tweens.add({
        targets: bolt, x: targetBase.x, y: targetBase.y, duration: 460, ease: "Quad.easeIn",
        onComplete: () => { bolt.destroy(); this._explode(targetBase, col); this.cameras.main.shake(360, 0.013); },
      });
      setTimeout(() => this._end(win), 1500);
    }

    _explode(base, col) {
      const flash = this.add.circle(base.x, base.y, 12, 0xffffff, 0.95).setDepth(99998);
      this.tweens.add({ targets: flash, scale: 7, alpha: 0, duration: 520, onComplete: () => flash.destroy() });
      for (let i = 0; i < 14; i++) {
        const ang = (i / 14) * Math.PI * 2, dist = this.S * (0.10 + Math.random() * 0.08);
        const pc = this.add.circle(base.x, base.y, 4 + Math.random() * 4, col, 1).setDepth(99998);
        this.tweens.add({ targets: pc, x: base.x + Math.cos(ang) * dist, y: base.y + Math.sin(ang) * dist, alpha: 0, scale: 0.3, duration: 560 + Math.random() * 200, ease: "Quad.easeOut", onComplete: () => pc.destroy() });
      }
    }

    _end(win) {
      if (this._ended) return;
      this._ended = true; this.over = true; this.running = false;
      document.getElementById("result-title").textContent = win ? "🏆 藍隊獲勝！" : "💀 紅隊獲勝";
      document.getElementById("result-sub").textContent = win ? "讀書就是戰力，你們三路壓制了對面！" : "再讀熟一點，下次贏回來！";
      document.getElementById("result").classList.add("on");
    }
  }

  function boot() {
    const host = document.getElementById("game");
    game = new Phaser.Game({
      type: Phaser.AUTO, width: host.clientWidth, height: host.clientHeight, parent: "game",
      backgroundColor: "#0e1630", scale: { mode: Phaser.Scale.RESIZE, autoCenter: Phaser.Scale.CENTER_BOTH }, scene: Battle,
    });
    window.__moba = game;
    document.getElementById("startBtn").addEventListener("click", () => {
      document.getElementById("intro").style.display = "none";
      game.scene.getScene("Battle").startGame();
    });
    document.getElementById("againBtn").addEventListener("click", () => location.reload());
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
</body>
</html>
