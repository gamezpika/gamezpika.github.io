<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script src="/no-zoom.js?v=1"></script>
<meta name="theme-color" content="#16213E">
<title>小智學園 · 新手任務</title>
<style>
  :root{
    --orange:#FF8C42; --blue:#00D4FF; --yellow:#FFD54F; --teal:#26C6DA;
    --bg:#16213E; --bg2:#0d1530; --ink:#2a1c08; --red:#FF5252;
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; overflow:hidden; background:#000;
    font-family:"Noto Sans TC","PingFang TC","Apple Color Emoji","Segoe UI Emoji",sans-serif;
    color:#fff; -webkit-user-select:none; user-select:none; -webkit-font-smoothing:antialiased; }

  /* ── 舞台（直式手機優先，桌面置中加殼）── */
  #stage{ position:fixed; inset:0; overflow:hidden;
    background:radial-gradient(120% 100% at 50% 0%, #1f2f57 0%, var(--bg) 55%, var(--bg2) 100%);
    max-width:480px; margin:0 auto; }
  @media(min-width:520px){
    body{ background:#0b0f1a; display:flex; align-items:center; justify-content:center; }
    #stage{ position:relative; width:393px; height:852px; max-height:96vh; border-radius:38px;
      box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 0 11px #11151f, 0 0 0 13px #2a3142; }
  }

  /* ── 場景層 ── */
  .scene{ position:absolute; inset:0; opacity:0; visibility:hidden; transition:opacity .55s ease;
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; }
  .scene.on{ opacity:1; visibility:visible; }
  .scene-bg{ position:absolute; inset:0; background-size:cover; background-position:center; }
  .dim{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,.55)); }

  /* ── HUD 任務進度 ── */
  #hud{ position:absolute; top:0; left:0; right:0; z-index:40; padding:14px 16px calc(14px + env(safe-area-inset-top));
    display:flex; align-items:center; gap:10px; opacity:0; transform:translateY(-12px);
    transition:opacity .4s, transform .4s; pointer-events:none;
    background:linear-gradient(180deg, rgba(13,21,48,.85), rgba(13,21,48,0)); }
  #hud.on{ opacity:1; transform:none; }
  #hud .label{ font-size:13px; font-weight:800; color:var(--yellow); white-space:nowrap; }
  #hud .bar{ flex:1; height:9px; border-radius:999px; background:rgba(255,255,255,.14); overflow:hidden; }
  #hud .fill{ height:100%; width:0; border-radius:999px; transition:width .6s cubic-bezier(.2,.8,.2,1);
    background:linear-gradient(90deg, var(--orange), var(--yellow)); }
  #hud .count{ font-size:13px; font-weight:800; color:#fff; min-width:34px; text-align:right; }

  /* ── 系統精靈 ── */
  #fairy{ position:absolute; z-index:30; width:150px; left:50%; bottom:210px;
    transform:translateX(-50%); transition:left .6s ease, bottom .6s ease, width .6s ease, opacity .4s;
    filter:drop-shadow(0 10px 18px rgba(0,0,0,.45)); pointer-events:none; opacity:0; }
  #fairy.show{ opacity:1; }
  #fairy img{ width:100%; display:block; animation:floaty 3.2s ease-in-out infinite; }
  #fairy .halo{ position:absolute; left:50%; top:55%; width:170%; height:60%; transform:translate(-50%,-50%);
    background:radial-gradient(closest-side, var(--blue-glow,rgba(0,212,255,.35)), transparent 70%);
    border-radius:50%; z-index:-1; animation:pulse 3.2s ease-in-out infinite; }
  @keyframes floaty{ 0%,100%{ transform:translateY(0) scale(1); } 50%{ transform:translateY(-16px) scale(1.015,.985); } }
  @keyframes pulse{ 0%,100%{ opacity:.5; transform:translate(-50%,-50%) scale(.9); } 50%{ opacity:.85; transform:translate(-50%,-50%) scale(1.05); } }

  /* ── 對話泡泡（打字機）── */
  #bubble{ position:absolute; z-index:35; left:18px; right:18px; bottom:calc(40px + env(safe-area-inset-bottom));
    background:#fff; color:var(--ink); border-radius:18px; padding:16px 18px 18px; line-height:1.6; font-size:16px;
    box-shadow:0 12px 30px rgba(0,0,0,.4); opacity:0; transform:translateY(16px); transition:opacity .35s, transform .35s;
    pointer-events:none; }
  #bubble.on{ opacity:1; transform:none; pointer-events:auto; }
  #bubble .who{ font-size:12px; font-weight:900; color:var(--orange); margin-bottom:4px; }
  #bubble .tap{ margin-top:10px; text-align:right; font-size:12px; color:#9aa; font-weight:700; animation:blink 1.2s infinite; }
  @keyframes blink{ 50%{ opacity:.3; } }
  #bubble:after{ content:""; position:absolute; top:-12px; left:40px; border:7px solid transparent; border-bottom-color:#fff; }

  /* ── 通用按鈕 ── */
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; border:none;
    font-family:inherit; font-weight:900; color:var(--ink); background:linear-gradient(135deg, var(--yellow), var(--orange));
    padding:14px 28px; border-radius:999px; font-size:16px; box-shadow:0 8px 22px rgba(255,140,66,.45);
    transition:transform .12s; }
  .btn:active{ transform:scale(.95); }
  .btn.ghost{ background:rgba(255,255,255,.1); color:#cfe0ff; box-shadow:none; border:1px solid rgba(255,255,255,.22); }
  /* 開始/解鎖 的播放三角 + 對話框「繼續」向下箭頭：純 CSS 圖形，取代原本的 emoji（跟著文字色 currentColor） */
  .ico-play{ display:inline-block; width:0; height:0; vertical-align:middle; margin-right:7px;
    border-style:solid; border-width:7px 0 7px 12px; border-color:transparent transparent transparent currentColor; }
  .ico-play.r{ margin-right:0; margin-left:7px; }
  .ico-chev{ display:inline-block; width:0; height:0; vertical-align:middle; margin-left:5px;
    border-style:solid; border-width:6px 5px 0 5px; border-color:currentColor transparent transparent transparent; }

  /* ── S0 Logo ── */
  #s0 .logo{ text-align:center; }
  #s0 .logo h1{ font-size:46px; font-weight:900; line-height:1.15; letter-spacing:2px;
    background:linear-gradient(135deg,#fff,var(--yellow) 45%,var(--orange)); -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 40px rgba(255,213,79,.25); animation:logoIn 1s cubic-bezier(.2,.9,.2,1) both; }
  #s0 .logo .en{ margin-top:6px; font-size:14px; letter-spacing:6px; color:var(--blue); font-weight:800;
    animation:logoIn 1s .25s cubic-bezier(.2,.9,.2,1) both; }
  #s0 .logo .tag{ margin-top:18px; font-size:14px; color:#bcd0f0; animation:logoIn 1s .5s ease both; }
  #s0 .start{ margin-top:42px; animation:logoIn 1s .8s ease both; }
  @keyframes logoIn{ from{ opacity:0; transform:translateY(18px) scale(.94); } to{ opacity:1; transform:none; } }
  .sparkles span{ position:absolute; font-size:18px; animation:twk 2.4s ease-in-out infinite; opacity:.0; }
  @keyframes twk{ 0%,100%{ opacity:0; transform:scale(.6); } 50%{ opacity:1; transform:scale(1.1); } }

  /* ── S1 上學路（校園場景）── */
  #s1 .student{ position:absolute; z-index:6; bottom:30%; left:34%; width:138px;
    filter:drop-shadow(0 10px 16px rgba(0,0,0,.4)); }
  #s1 .cmate{ position:absolute; z-index:6; bottom:30%; width:118px;
    filter:drop-shadow(0 10px 16px rgba(0,0,0,.4)); }
  #s1 .cmA{ left:8%; } #s1 .cmB{ right:8%; }
  #s1 .pole{ position:absolute; z-index:5; bottom:30%; left:50%; transform:translateX(-50%); height:44%;
    filter:drop-shadow(0 8px 14px rgba(0,0,0,.4)); }
  #s1 .s1anim{ opacity:0; transition:opacity .5s ease; }
  #s1 .s1anim.in{ opacity:1; }
  .phone-pickup{ position:absolute; bottom:28%; left:50%; transform:translateX(-50%); cursor:pointer; z-index:7;
    animation:phoneGlow 1.6s ease-in-out infinite; }
  @keyframes phoneGlow{ 0%,100%{ filter:drop-shadow(0 0 6px var(--blue)); transform:translateX(-50%) translateY(0) scale(1); }
    50%{ filter:drop-shadow(0 0 26px var(--blue)) drop-shadow(0 0 50px var(--blue)); transform:translateX(-50%) translateY(-6px) scale(1.08); } }

  /* ── S2 發光轉場 ── */
  .glow-burst{ position:absolute; width:50px; height:50px; border-radius:50%; transform:translate(-50%,-50%) scale(0);
    z-index:48; pointer-events:none;
    background:radial-gradient(circle, #ffffff 0%, #d6fbff 28%, rgba(0,212,255,0.75) 52%, rgba(0,212,255,0) 75%); }
  .glow-burst.go{ animation:glowBurst 1.1s ease-out forwards; }
  @keyframes glowBurst{ 0%{ transform:translate(-50%,-50%) scale(0); opacity:.85; }
    55%{ opacity:1; } 100%{ transform:translate(-50%,-50%) scale(32); opacity:1; } }
  #flash{ position:absolute; inset:0; background:#fff; opacity:0; z-index:50; pointer-events:none; }
  #flash.go{ animation:fl 1.4s ease forwards; }
  @keyframes fl{ 0%{ opacity:0; } 55%{ opacity:1; } 100%{ opacity:0; } }

  /* ── 建角輸入頁（解鎖手機）── */
  .creator{ text-align:left; }
  .creator h3{ margin-bottom:6px; }
  .creator .sub{ font-size:12px; color:#9fb4dc; text-align:center; margin-bottom:14px; }
  .creator .fld{ display:flex; align-items:center; gap:10px; margin:11px 0; }
  .creator .fld>span{ width:42px; font-size:14px; font-weight:800; color:var(--yellow); flex-shrink:0; }
  .creator input{ flex:1; background:rgba(255,255,255,.08); border:1.5px solid rgba(255,255,255,.2); border-radius:12px;
    padding:11px 12px; color:#fff; font-size:16px; font-family:inherit; outline:none; }
  .creator input:focus{ border-color:var(--blue); }
  .creator .seg{ display:flex; gap:8px; flex:1; }
  .creator .seg.grades{ display:grid; grid-template-columns:repeat(3,1fr); }
  .creator .seg button{ flex:1; background:rgba(255,255,255,.07); border:1.5px solid rgba(255,255,255,.18); border-radius:12px;
    padding:10px 4px; color:#cfe0ff; font-weight:800; font-size:14px; font-family:inherit; cursor:pointer; transition:.15s; }
  .creator .seg button.sel{ background:linear-gradient(135deg,var(--yellow),var(--orange)); color:var(--ink); border-color:transparent; }
  .creator #creatorOk{ width:100%; margin-top:12px; }
  .creator .hint{ color:var(--red); font-size:12px; font-weight:700; text-align:center; margin-top:8px; min-height:14px; }
  .creator.leaving{ opacity:0; transform:translateY(-54%) scale(.95); transition:.4s; }

  /* ── 手機飛出的小光團 ── */
  #orb{ position:absolute; left:50%; top:54%; width:26px; height:26px; border-radius:50%; z-index:32;
    transform:translate(-50%,-50%) scale(.3); opacity:0;
    background:radial-gradient(circle, #ffffff 0%, #bff5ff 38%, rgba(0,212,255,.65) 70%, transparent 80%);
    box-shadow:0 0 30px #00D4FF, 0 0 70px #00D4FF; transition:transform 1.2s cubic-bezier(.2,.8,.2,1), opacity .6s; }
  #orb.grow{ opacity:1; transform:translate(-50%,-110px) scale(2.4); }

  /* ── 任務舞台中央卡 ── */
  .panel{ position:absolute; left:18px; right:18px; top:50%; transform:translateY(-54%);
    background:rgba(15,22,46,.92); border:1px solid rgba(255,255,255,.14); border-radius:22px; padding:20px 18px 22px;
    box-shadow:0 18px 50px rgba(0,0,0,.5); z-index:25; }
  .panel h3{ font-size:17px; margin-bottom:14px; text-align:center; color:#fff; }
  .panel .q{ font-size:18px; font-weight:800; text-align:center; margin-bottom:16px; line-height:1.5; }
  .opts{ display:grid; gap:10px; }
  .opt{ background:rgba(255,255,255,.07); border:1.5px solid rgba(255,255,255,.16); border-radius:14px; padding:14px;
    font-size:16px; font-weight:700; text-align:center; cursor:pointer; transition:.15s; }
  .opt:active{ transform:scale(.97); }
  .opt.right{ background:rgba(38,198,124,.25); border-color:#26C67c; }
  .opt.wrong{ background:rgba(255,82,82,.2); border-color:var(--red); }

  /* 圖鑑卡 / 開箱 */
  .card-reward{ display:flex; flex-direction:column; align-items:center; gap:10px; }
  .chest{ font-size:74px; animation:chestShake .5s ease 3; }
  @keyframes chestShake{ 0%,100%{ transform:rotate(0); } 25%{ transform:rotate(-9deg); } 75%{ transform:rotate(9deg); } }
  .gacha{ width:160px; height:210px; border-radius:18px; perspective:900px; }
  .gacha .inner{ position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .8s; transform:rotateY(180deg); }
  .gacha.flip .inner{ transform:rotateY(0); }
  .gacha .face{ position:absolute; inset:0; backface-visibility:hidden; border-radius:18px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:6px; }
  .gacha .back{ background:linear-gradient(135deg,#3a2f6b,#6b4ea0); transform:rotateY(180deg); font-size:48px;
    border:2px solid rgba(255,255,255,.3); }
  .gacha .front{ background:linear-gradient(160deg,#fff6e6,#ffe2b0); color:var(--ink); border:3px solid var(--yellow);
    box-shadow:0 0 30px var(--yellow); }
  .gacha .front .ic{ font-size:58px; } .gacha .front .nm{ font-weight:900; font-size:16px; }
  .gacha .front .buff{ font-size:12px; font-weight:800; color:#b5651d; }

  /* coin burst */
  .coin{ position:absolute; font-size:24px; z-index:60; pointer-events:none; animation:coinUp 1s ease forwards; }
  @keyframes coinUp{ 0%{ opacity:1; transform:translateY(0) scale(.6); } 100%{ opacity:0; transform:translateY(-130px) scale(1.2); } }

  /* 升階徽章 */
  .badge-up{ display:flex; align-items:center; justify-content:center; gap:14px; font-weight:900; font-size:18px; }
  .badge-up .old{ opacity:.5; } .badge-up .arrow{ color:var(--yellow); font-size:24px; animation:nudge 1s infinite; }
  .badge-up .new{ color:var(--yellow); text-shadow:0 0 18px var(--yellow); animation:popNew .6s ease both; }
  @keyframes popNew{ 0%{ transform:scale(.4); opacity:0; } 70%{ transform:scale(1.2); } 100%{ transform:scale(1); opacity:1; } }
  @keyframes nudge{ 50%{ transform:translateX(4px); } }

  /* PK */
  .pk{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:16px; }
  .pk .side{ flex:1; text-align:center; }
  .pk .who2{ font-size:13px; font-weight:800; color:#bcd0f0; } .pk .ava{ font-size:40px; }
  .pk .scr{ font-size:26px; font-weight:900; } .pk .vs{ font-size:18px; color:var(--orange); font-weight:900; }
  .pk .you .scr{ color:var(--blue); } .pk .cpu .scr{ color:var(--red); }

  /* 蛋孵化 */
  .egg{ font-size:90px; animation:eggShake 0.45s ease 4; }
  @keyframes eggShake{ 0%,100%{ transform:rotate(0); } 25%{ transform:rotate(-12deg); } 75%{ transform:rotate(12deg); } }
  .hatched{ font-size:80px; animation:popNew .7s ease both; }

  /* 選科 */
  .subjects{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  .subj{ background:rgba(255,255,255,.08); border:1.5px solid rgba(255,255,255,.18); border-radius:14px; padding:14px 4px;
    text-align:center; cursor:pointer; transition:.15s; } .subj:active{ transform:scale(.94); }
  .subj .e{ font-size:26px; display:block; } .subj .n{ font-size:12px; font-weight:800; margin-top:4px; }

  /* 魔王 */
  .boss{ text-align:center; }
  .boss .b{ font-size:88px; animation:bossFloat 2s ease-in-out infinite; display:inline-block; }
  @keyframes bossFloat{ 50%{ transform:translateY(-10px); } }
  .hpbar{ height:14px; border-radius:999px; background:rgba(255,255,255,.15); overflow:hidden; margin:14px 0 6px; }
  .hpfill{ height:100%; width:100%; background:linear-gradient(90deg,var(--red),#ff8a8a); transition:width .5s; }

  /* finale */
  .finale{ text-align:center; }
  .finale h2{ font-size:26px; font-weight:900; margin-bottom:8px;
    background:linear-gradient(135deg,#fff,var(--yellow),var(--orange)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .finale .rewards{ display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin:18px 0 6px; }
  .finale .rw{ background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); border-radius:14px; padding:10px 14px;
    font-size:13px; font-weight:800; } .finale .rw .e{ font-size:22px; display:block; margin-bottom:2px; }

  .hidden{ display:none !important; }
  .gi{ display:inline-block; width:auto; vertical-align:middle; object-fit:contain; }
  .gib{ display:block; margin:0 auto; }
  .confetti{ position:absolute; top:-20px; font-size:18px; z-index:55; pointer-events:none; animation:fall linear forwards; }
  @keyframes fall{ to{ transform:translateY(120vh) rotate(540deg); opacity:.2; } }
</style>
</head>
<body>
<div id="stage">

  <!-- HUD -->
  <div id="hud">
    <span class="label">新手任務</span>
    <div class="bar"><div class="fill" id="hudfill"></div></div>
    <span class="count" id="hudcount">0/5</span>
  </div>

  <!-- S0 Logo -->
  <section class="scene" id="s0" data-tap="next">
    <div class="sparkles" id="sp0"></div>
    <div class="logo">
      <h1>小智學園</h1>
      <div class="en">XIAOZHI ACADEMY</div>
      <div class="tag">撿到一支發光的手機，你的冒險即將開始…</div>
    </div>
    <div class="start"><button class="btn" onclick="next()"><span class="ico-play"></span>開始</button></div>
  </section>

  <!-- S1 上學路：開學第一天，三人邊走邊聊 -->
  <section class="scene" id="s1">
    <div class="scene-bg" id="streetbg"></div>
    <img class="cmate cmA s1anim" id="cmA" src="assets/images/onboarding/classmate_a.png?v=1" alt="同學A" hidden>
    <img class="cmate cmB s1anim" id="cmB" src="assets/images/onboarding/classmate_b.png?v=1" alt="同學B" hidden>
    <img class="pole s1anim" id="pole" src="assets/images/onboarding/pole.png?v=1" alt="電線杆" hidden>
    <img class="student s1anim" id="student" src="assets/images/onboarding/student_pickup.png?v=1" alt="你" hidden>
    <div class="phone-pickup s1anim" id="phonePick" onclick="pickPhone()" hidden><img class="gi" style="height:60px" src="assets/images/onboarding/phone.png?v=1" alt=""></div>
  </section>

  <!-- S2 穿越漩渦 -->
  <section class="scene" id="s2"></section>

  <!-- S3 小屋（精靈自介在這裡用 bubble） -->
  <section class="scene" id="s3">
    <div class="scene-bg" id="cabinbg"></div>
    <div class="dim"></div>
  </section>

  <!-- 任務場景共用容器 -->
  <section class="scene" id="task">
    <div class="scene-bg" id="taskbg"></div>
    <div class="dim"></div>
    <div class="panel" id="panel"></div>
  </section>

  <!-- 結尾 -->
  <section class="scene" id="end">
    <div class="scene-bg" id="endbg"></div>
    <div class="dim"></div>
    <div class="finale panel" style="top:50%;">
      <h2><img class="gi" style="height:28px" src="assets/images/onboarding/icon_party.png?v=1" alt=""> 新手任務完成！</h2>
      <div style="font-size:14px;color:#cfe0ff;line-height:1.6;">你打倒了初始魔王，<br>正式成為小智學園的一員！</div>
      <div class="rewards">
        <div class="rw"><span class="e"><img class="gi gib" style="height:30px" src="assets/images/onboarding/coin.png?v=1" alt=""></span>2000+ 金幣</div>
        <div class="rw"><span class="e"><img class="gi gib" style="height:30px" src="assets/images/onboarding/badge_student.png?v=1" alt=""></span>正式學員</div>
        <div class="rw"><span class="e"><img class="gi gib" style="height:30px" src="assets/images/onboarding/knife.png?v=1" alt=""></span>美工刀</div>
        <div class="rw"><span class="e"><img class="gi gib" style="height:30px" src="assets/images/onboarding/backpack.png?v=1" alt=""></span>帽 + 書包</div>
        <div class="rw"><span class="e"><img class="gi gib" style="height:30px" src="assets/images/onboarding/pet_chick.png?v=1" alt=""></span>初始寵物</div>
        <div class="rw"><span class="e"><img class="gi gib" style="height:30px" src="assets/images/onboarding/scroll.png?v=1" alt=""></span>轉職道具</div>
      </div>
      <div style="margin-top:18px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
        <a class="btn" href="/village-web/index.html?map=island&spawn=0.672,0.59"><img class="gi" style="height:22px" src="assets/images/onboarding/school.png?v=1" alt=""> 進入學園</a>
        <button class="btn ghost" onclick="restart()"><img class="gi" style="height:20px" src="assets/images/onboarding/icon_replay.png?v=1" alt=""> 重看一次</button>
      </div>
    </div>
  </section>

  <!-- 精靈 + 泡泡（跨場景持續） -->
  <div id="fairy"><div class="halo"></div><img src="assets/images/onboarding/sprite_main.png?v=1" alt="系統精靈"></div>
  <div id="bubble"><div class="who">系統精靈 · 艾斯</div><div class="txt" id="btxt"></div><div class="tap" id="btap">輕觸繼續<span class="ico-chev"></span></div></div>

</div>

<script>
const SPRITE_NAME = "艾斯";
const AST='assets/images/onboarding/';
function gi(name,h,b){ return '<img class="gi'+(b?' gib':'')+'" style="height:'+h+'px" src="'+AST+name+'.png?v=1" alt="">'; }

// ── DOM refs ──
const $ = s => document.querySelector(s);

const CABIN = "assets/images/onboarding/cabin_interior.jpg?v=1";
const GRAD = "linear-gradient(180deg,#3a2a55,#1d1733)";
function setBg(el, url){
  const img = new Image();
  img.onload = ()=>{ el.style.backgroundImage = `url('${url}')`; };
  img.onerror = ()=>{ el.style.backgroundImage = GRAD; };
  img.src = url;
}

function showScene(key){

}

// ── 對話泡泡（打字機）──
let typing = null, onBubbleTap = null;
function say(text, cb, opts={}){
  clearInterval(typing);
  bubble.querySelector('.who').textContent = (opts.who || ('系統精靈 · ' + SPRITE_NAME));
  bubble.classList.add('on'); btxt.textContent=''; btap.style.display='none';
  btxt._full = text.length;
  let i=0;
  typing = setInterval(()=>{
    btxt.textContent = text.slice(0, ++i);
    if(i>=text.length){ clearInterval(typing); typing=null; btap.style.display = cb?'block':'none'; onBubbleTap = cb||null; }
  }, 32);
}
bubble.addEventListener('click', ()=>{
  if(typing && btxt.textContent.length < (btxt._full||0)) return;
  if(onBubbleTap){ const f=onBubbleTap; onBubbleTap=null; btap.style.display='none'; f(); }
});
function hideBubble(){ bubble.classList.remove('on'); onBubbleTap=null; }

// ── 精靈定位 ──
function fairyShow(show){ fairy.classList.toggle('show', show); }
function fairyAt(left, bottom, w){ // px / %
  if(left!=null) fairy.style.left = left;
  if(bottom!=null) fairy.style.bottom = bottom;
  if(w!=null) fairy.style.width = w;
}

function coinBurst(x,y,n=8){

// ── Demo 後台：建角色（pptx 第5-6頁的輸入姓名/性別/年級＝真的建一個 demo 玩家）──
const DEMO_API = "https://eduarena-tutoring-production.up.railway.app";
async function createDemoAccount(name, genderLabel, grade){
  try{
    const j = (r)=>r.json();
    // Google 登入會在登入頁把 ID token 存進 sessionStorage → 這裡用 Google 身分建角色(持久)
    let gidt = ""; try { gidt = sessionStorage.getItem("eduarena_google_idtoken") || ""; } catch(e){}
    let platform, uid;
    if (gidt) {
      platform = "google";
      const auth = await fetch(DEMO_API+"/api/auth", {method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({type:"google", idToken:gidt})}).then(j).catch(()=>null);
      if (!auth || !auth.account) { console.warn("[google auth] 失敗"); return; }
      uid = auth.account.platformUserId;
    } else {
      platform = "web";
      uid = "demo_" + Date.now().toString(36) + Math.floor(Math.random()*1e4).toString(36);
      await fetch(DEMO_API+"/api/auth", {method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({type:"web", userId:uid, name})}).then(j);
    }
    // 建小孩帳號（Google 帳號最多 3 個）
    const created = await fetch(DEMO_API+"/api/auth/child/create", {method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({platform, platform_user_id:uid, child_name:name, grade:Number(grade), semester:1})}).then(j);
    let cid = created && created.child && created.child.id;
    const isNew = !!cid;
    // Google 帳號已滿 3 人 → 不卡住，改用既有最後一個小孩進場
    if (!cid && created && created.error === "max_children") {
      const re = await fetch(DEMO_API+"/api/auth", {method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify(gidt ? {type:"google", idToken:gidt} : {type:"web", userId:uid, name})}).then(j).catch(()=>null);
      const kids = (re && re.children) || [];
      if (kids.length) cid = kids[kids.length-1].id;
    }
    if(!cid) return;
    const sel = await fetch(DEMO_API+"/api/auth/child/select", {method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({platform, platform_user_id:uid, child_id:cid})}).then(j);
    const token = sel && sel.token;
    if(!token) return;
    localStorage.setItem("eduarena_demo_token", token);
    localStorage.setItem("eduarena_demo_uid", uid);
    localStorage.setItem("eduarena_demo_child_id", String(cid));
    try { sessionStorage.removeItem("eduarena_google_idtoken"); } catch(e){}
    // 只有「新建的小孩」才灌初始進度＋裝備（既有小孩不重灌）
    if (isNew) {
      await fetch(DEMO_API+"/api/demo/grant-stars?subject=chinese&pct=60",
        {method:"POST", headers:{"Authorization":"Bearer "+token}}).then(j).catch(()=>{});
      await fetch(DEMO_API+"/api/demo/grant-starter",
        {method:"POST", headers:{"Authorization":"Bearer "+token}})
        .then(r=>{ if(!r.ok) console.warn("[grant-starter] 綁定失敗 HTTP", r.status); return r.json().catch(()=>null); })
        .catch(e=>console.warn("[grant-starter] 綁定失敗", e));
    }
  }catch(e){ console.warn("[demo account] 建立失敗，劇情照常continue:", e); }
}

function showCreator(){
  if($('#creator')) return;
  const wrap=document.createElement('div'); wrap.className='panel creator'; wrap.id='creator';
  wrap.innerHTML =
    '<h3>'+gi('phone',22)+' 解鎖手機</h3><div class="sub">輸入你的資料，開始這趟冒險</div>'+
    '<div class="fld"><span>姓名</span><input id="cName" maxlength="6" placeholder="輸入你的名字" autocomplete="off"></div>'+

      '<button data-v="男生">男生</button><button data-v="女生">女生</button></div></div>'+
    '<div class="fld"><span>年級</span><div class="seg grades" id="segGrade">'+
      [1,2,3,4,5,6].map(g=>'<button data-v="'+g+'">'+g+'年級</button>').join('')+'</div></div>'+
    '<button class="btn" id="creatorOk">解鎖<span class="ico-play r"></span></button>'+
    '<div class="hint" id="creatorHint"></div>';
  $('#s3').appendChild(wrap);
  wrap.querySelectorAll('.seg').forEach(seg=>{
    seg.addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return;
      seg.querySelectorAll('button').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); });
  });
  $('#creatorOk').onclick=()=>{
    const name=$('#cName').value.trim();
    const g=wrap.querySelector('#segGender .sel'), gr=wrap.querySelector('#segGrade .sel');
    if(!name || !g || !gr){ $('#creatorHint').textContent='請填寫姓名、選擇性別與年級～'; return; }
    $('#creatorOk').onclick=null; // 驗證通過，擋連點重複 spawnOrb
    PLAYER={ name, gender:g.dataset.v, grade:gr.dataset.v };
    // 存性別給村莊/職業介紹所讀（女角職業圖用女版）
    try { localStorage.setItem('village_gender', g.dataset.v === '女生' ? 'female' : 'male'); } catch(e){}
    // 存年級給魔王戰等讀（顯示用；後端題目年級已綁 demo child 帳號）
    try { localStorage.setItem('village_grade', String(gr.dataset.v)); } catch(e){}
    // 存名字給魔王戰/多人等讀（顯示用）；village_player_name 是 mp.js 用的 canonical key
    try { localStorage.setItem('village_name', name); localStorage.setItem('village_player_name', name); } catch(e){}
    // 新手初始裝備穿上身：角色頁裝備槽（武器=美工刀／頭=學生帽／衣=學生服(原本造型)／書包）
    try { localStorage.setItem('village_equip', JSON.stringify({ body:'basic', hat:'hat_student', weapon:'knife', bag:'bag_student' })); } catch(e){}
    // pptx 第5-6頁：輸入完 = 真的在 demo 後台建一個玩家（背景進行，不擋劇情）
    createDemoAccount(name, g.dataset.v, gr.dataset.v);
    wrap.classList.add('leaving'); setTimeout(()=>wrap.remove(), 400);
    spawnOrb();
  };
}

function pickPhone(){
  if(stage!==1) return;
  stage=2; // 立刻離開 1，擋掉連點重入
  const ph=$('#phonePick');
  ph.style.transition='transform .45s, filter .45s';
  ph.style.transform='translateX(-50%) scale(1.7)';
  ph.style.filter='drop-shadow(0 0 45px #00D4FF) drop-shadow(0 0 90px #ffffff)';
  hideBubble();
  setTimeout(()=>{
    // 從手機位置爆出發光圈 + 白閃 → 進小屋
    const r=ph.getBoundingClientRect(), st=$('#stage').getBoundingClientRect();
    const burst=document.createElement('div'); burst.className='glow-burst';
    burst.style.left=(r.left+r.width/2-st.left)+'px';
    burst.style.top=(r.top+r.height/2-st.top)+'px';
    $('#stage').appendChild(burst);
    requestAnimationFrame(()=>burst.classList.add('go'));
    const fl=document.createElement('div'); fl.id='flash'; fl.className='go'; $('#stage').appendChild(fl);
    setTimeout(()=>{ stage=3; run(); }, 850);
    setTimeout(()=>{ burst.remove(); fl.remove(); }, 1500);
  }, 450);
}

        <div class="opt" data-r="1">玉山</div>
        <div class="opt" data-r="0">雪山</div>
      </div>`;
    panel.querySelectorAll('.opt').forEach(o=>o.addEventListener('click', function(){
      panel.querySelectorAll('.opt').forEach(x=>x.style.pointerEvents='none');
      if(this.dataset.r==='1'){
        this.classList.add('right'); $('#pyou').textContent='1';
        setTimeout(()=>{
          panel.innerHTML = `<h3><img class="gi" style="height:24px" src="assets/images/onboarding/trophy.png?v=1" alt=""> 你贏了！</h3>
            <div style="display:flex;gap:14px;justify-content:center;margin:14px 0;">
              <div class="gacha flip" style="width:120px;height:150px;"><div class="inner"><div class="face front" style="background:linear-gradient(160deg,#fff6e6,#ffe2b0);"><div class="ic">${gi('cap',60)}</div><div class="nm">學生帽</div><div class="buff">敏捷 +2</div></div></div></div>
              <div class="gacha flip" style="width:120px;height:150px;"><div class="inner"><div class="face front" style="background:linear-gradient(160deg,#fff6e6,#ffe2b0);"><div class="ic">${gi('backpack',60)}</div><div class="nm">書包</div><div class="buff">攜帶 +5</div></div></div></div>
            </div>
            <div style="text-align:center;"><button class="btn" id="t3ok">收下防具！</button></div>`;
          confetti(24);
          $('#t3ok').onclick=()=>{ setHud(3); say('防具到手！接著看看你的「排行榜」跟「圖鑑」成果吧～', ()=>startTask(4)); };
        }, 700);
      } else { this.classList.add('wrong'); this.style.pointerEvents='none';
        $('#pcpu').textContent='1'; say('電腦搶先了！再試一題就好～',null);
        setTimeout(()=>panel.querySelectorAll('.opt').forEach(x=>{ if(!x.classList.contains('wrong')) x.style.pointerEvents='auto';}),900); }
    }));
  });
}

// 任務 4：看排行/圖鑑 → 初始寵物 + 解鎖牧場
function task4(){
  say('任務 4：看一下你的成果，還有給你一份見面禮——你的第一隻寵物！', ()=>{
    hideBubble();
    panel.innerHTML = `<h3><img class="gi" style="height:24px" src="assets/images/onboarding/trophy.png?v=1" alt=""> 我的成果</h3>
      <div style="display:flex;justify-content:space-around;text-align:center;margin-bottom:14px;">
        <div><div id="res-cards" style="font-size:24px;font-weight:900;color:#FFD54F;">3</div><div style="font-size:12px;color:#9ab;">圖鑑卡</div></div>
        <div><div id="res-coins" style="font-size:24px;font-weight:900;color:#FF8C42;">300</div><div style="font-size:12px;color:#9ab;">金幣</div></div>
      </div>
      <div style="text-align:center;"><div class="egg" id="egg"><img class="gi" style="height:92px" src="assets/images/onboarding/egg.png?v=1" alt=""></div>
        <div style="font-size:13px;color:#cfe0ff;">輕觸蛋孵化你的寵物！</div></div>`;
    // 真資料：金幣 + 圖鑑卡張數（grant-starter 開場已灌；失敗維持上面演出 fallback，demo 不開天窗）。排行依派派要求移除。
    (function(){
      var tk = localStorage.getItem('eduarena_demo_token'); if(!tk) return;
      var H = { Authorization: 'Bearer ' + tk };
      fetch(DEMO_API+'/api/user/dashboard',{headers:H}).then(r=>r.json()).then(d=>{
        if(d && typeof d.coins==='number'){ var e=document.getElementById('res-coins'); if(e) e.textContent=d.coins; }
      }).catch(()=>{});
      fetch(DEMO_API+'/api/cards/dex',{headers:H}).then(r=>r.json()).then(d=>{
        if(d && typeof d.total_unlocked==='number'){ var e=document.getElementById('res-cards'); if(e) e.textContent=d.total_unlocked; }
      }).catch(()=>{});
    })();
    $('#egg').onclick=function(){
      this.onclick=null;
      // 寵物啾啾在開場 grant-starter 已真發；保險起見再冪等呼叫一次確保帳號真的有
      try{ var _tk=localStorage.getItem('eduarena_demo_token');
        if(_tk) fetch(DEMO_API+'/api/demo/grant-starter',{method:'POST',headers:{Authorization:'Bearer '+_tk}}).catch(()=>{});
      }catch(e){}
      setTimeout(()=>{ confetti(28);
        panel.innerHTML = `<h3><img class="gi" style="height:24px" src="assets/images/onboarding/icon_party.png?v=1" alt=""> 孵化成功！</h3>
          <div style="text-align:center;"><div class="hatched"><img class="gi" style="height:82px" src="assets/images/onboarding/pet_chick.png?v=1" alt=""></div>
          <div style="font-weight:900;margin-top:6px;">小雞「啾啾」加入了！</div>
          <div style="font-size:13px;color:#26C6DA;font-weight:800;margin-top:6px;"><img class="gi" style="height:20px" src="assets/images/onboarding/wheat.png?v=1" alt=""> 牧場已解鎖！</div>
          <div style="margin-top:16px;"><button class="btn" id="t4ok">太可愛了！</button></div></div>`;
        $('#t4ok').onclick=()=>{ setHud(4); say('最後一關！去挑戰守在學園深處的「初始魔王」吧！', ()=>startTask(5)); };
      }, 1900);
    };
  });
}

// 任務 5：PK 魔王選科 → 2000 金 + 轉職道具
function task5(){
  say('任務 5：選一個你最拿手的科目，來打倒初始魔王！', ()=>{
    hideBubble();
    panel.innerHTML = `<h3><img class="gi" style="height:22px" src="assets/images/onboarding/icon_swords.png?v=1" alt=""> 選擇你的科目</h3>
      <div class="subjects">
        <div class="subj" data-s="國語"><span class="e"><img class="gi gib" style="height:32px" src="assets/images/subjects/chinese.png?v=1" alt=""></span><span class="n">國語</span></div>
        <div class="subj" data-s="英文"><span class="e"><img class="gi gib" style="height:32px" src="assets/images/subjects/english.png?v=1" alt=""></span><span class="n">英文</span></div>
        <div class="subj" data-s="數學"><span class="e"><img class="gi gib" style="height:32px" src="assets/images/subjects/math.png?v=1" alt=""></span><span class="n">數學</span></div>
        <div class="subj" data-s="自然"><span class="e"><img class="gi gib" style="height:32px" src="assets/images/subjects/science.png?v=1" alt=""></span><span class="n">自然</span></div>
        <div class="subj" data-s="社會"><span class="e"><img class="gi gib" style="height:32px" src="assets/images/subjects/social.png?v=1" alt=""></span><span class="n">社會</span></div>
      </div>`;
    panel.querySelectorAll('.subj').forEach(s=>s.addEventListener('click', ()=>bossFight(s.dataset.s)));
  });
}
// 用真‧棋盤格魔王戰（boss-arena2，接後端真題+真金幣，吃 demo 帳號 attack/defense）
// 打贏後 boss-arena2 帶 from=onboarding 會導回 onboarding.html?scene=end 看結尾領大獎
const SUBJ_KEY = { "國語":"chinese", "英文":"english", "數學":"math", "自然":"science", "社會":"social" };
function bossFight(subj){
  const key = SUBJ_KEY[subj] || "math";
  let hero = "boy";
  try { hero = localStorage.getItem("village_gender") === "female" ? "girl" : "boy"; } catch(e){}
  const nm = encodeURIComponent((PLAYER.name || "").slice(0,12));
  say('進入魔王戰場…用你的「'+subj+'」知識打倒初始魔王！', ()=>{
    location.href = "boss-arena2.html?subject=" + key + "&hero=" + hero + "&name=" + nm + "&from=onboarding";
  });
}

function finale(){
  hideBubble(); fairyShow(false); showScene('end'); confetti(60);
}

function restart(){ stage=0; step=0; PLAYER={ name:'', gender:'', grade:'' }; hud.classList.remove('on'); fairyShow(false); hideBubble();
  document.querySelectorAll('.glow-burst,#flash,#creator,#orb').forEach(e=>e.remove()); resetS1(); showScene('s0'); }

// 啟動：從棋盤格魔王戰「真的打贏」回來(?scene=end + 一次性 flag) → 顯示結尾領大獎；否則正常開場
(function(){
  let sc="", cleared=false;
  try{ sc=new URLSearchParams(location.search).get('scene')||""; }catch(e){}
  try{ cleared = localStorage.getItem('onboarding_boss_cleared')==='1'; }catch(e){}
  if(sc==='end' && cleared){
    try{ localStorage.removeItem('onboarding_boss_cleared'); }catch(e){}
    hud.classList.add('on'); setHud(5); hideBubble(); fairyShow(false); showScene('end'); confetti(40);
  } else { showScene('s0'); }
})();
</script>
